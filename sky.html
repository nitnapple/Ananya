<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Star Sculptor: Ananya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Critical: Disables browser zooming/scrolling */
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: clamp(2rem, 8vw, 4rem); /* Responsive font size */
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            margin: 0 0 20px 0;
            padding: 0 20px;
            opacity: 1;
            line-height: 1.2;
        }
        p {
            font-size: clamp(1rem, 4vw, 1.2rem);
            color: #ccc;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
            padding: 0 20px;
        }
        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 20px 60px; /* Larger touch target */
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(51, 51, 255, 0.6);
            transition: all 0.2s;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(51, 51, 255, 0.8);
            background: linear-gradient(45deg, #d400aa, #2222dd);
        }
        
        /* HUD */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 80px; /* Fixed height for touch safety at top */
            padding: 15px 20px;
            padding-top: max(15px, env(safe-area-inset-top)); /* Handle Notch */
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }
        .lives-container {
            display: flex;
            gap: 5px;
        }
        .life-pip {
            width: 25px; /* Larger pips */
            height: 10px;
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
            transform: skewX(-20deg);
        }
        .life-pip.lost {
            background: #333;
            box-shadow: none;
        }
        .target-word {
            display: flex;
            gap: 5px;
        }
        .letter-slot {
            width: 30px;
            height: 40px;
            border-bottom: 3px solid rgba(0, 210, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            font-family: monospace;
            font-weight: bold;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
            transition: all 0.3s;
        }
        .letter-slot.filled {
            background: rgba(0, 210, 255, 0.2);
            text-shadow: 0 0 15px #00d2ff;
            border-bottom: 3px solid #fff;
        }
        
        /* Volume Toggle */
        #vol-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            border: 2px solid #555;
            color: #fff;
            border-radius: 50%;
            width: 50px; /* Larger hit area */
            height: 50px;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        
        @media (max-width: 600px) {
            .letter-slot { width: 25px; height: 35px; font-size: 1.2rem; }
            .target-word { gap: 3px; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div class="hud-top" id="game-hud" style="display: none;">
    <div class="lives-container" id="lives-display">
        <!-- populated by js -->
    </div>
    <div class="target-word" id="word-display">
        <!-- populated by js -->
    </div>
    <button id="vol-btn">🔊</button>
</div>

<!-- SCREENS -->
<div id="ui-layer">
    <div id="start-screen">
        <h1>Sky Force:<br>Ananya</h1>
        <p>Touch & Drag to Pilot</p>
        <p>Collect: <strong>A-N-A-N-Y-A</strong></p>
        <button class="btn" id="start-btn">LAUNCH</button>
    </div>
    
    <div id="end-screen" style="display: none;">
        <h1 id="end-title">MISSION COMPLETE</h1>
        <p id="end-subtitle">ANANYA FORMED</p>
        <button class="btn" id="restart-btn">REPLAY</button>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * AUDIO SYSTEM (Web Audio API - No external files)
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    masterGain: null,
    bgmOscillators: [],
    isMuted: false,

    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3; 
                this.masterGain.connect(this.ctx.destination);
            }
        }
        this.resume();
    },

    resume: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e => console.log(e));
        }
    },

    toggleMute: function() {
        this.isMuted = !this.isMuted;
        if(this.masterGain && this.ctx) {
            const currentTime = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(currentTime);
            this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.3, currentTime, 0.1);
        }
        return this.isMuted;
    },

    playShoot: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    playCollect: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    playExplosion: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 50;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 500;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        lfo.stop(this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    startBGM: function() {
        if (!this.ctx) return;
        this.stopBGM();

        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.value = 55; // A1
        const gain1 = this.ctx.createGain();
        gain1.gain.value = 0.1;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        osc1.connect(filter);
        filter.connect(this.masterGain);
        osc1.start();
        this.bgmOscillators.push(osc1);

        this.beatInterval = setInterval(() => {
            if(this.isMuted || !this.ctx) return;
            const kOsc = this.ctx.createOscillator();
            const kGain = this.ctx.createGain();
            kOsc.frequency.setValueAtTime(150, this.ctx.currentTime);
            kOsc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            kGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kOsc.connect(kGain);
            kGain.connect(this.masterGain);
            kOsc.start();
            kOsc.stop(this.ctx.currentTime + 0.2);
        }, 500); 
    },

    stopBGM: function() {
        this.bgmOscillators.forEach(o => o.stop());
        this.bgmOscillators = [];
        if (this.beatInterval) clearInterval(this.beatInterval);
    }
};

/**
 * ------------------------------------------------------------------
 * GAME CONFIG & VARIABLES
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const hud = document.getElementById('game-hud');
const livesContainer = document.getElementById('lives-display');
const wordDisplay = document.getElementById('word-display');
const volBtn = document.getElementById('vol-btn');

let width, height;
let particles = [];
let bullets = [];
let enemies = [];
let stars = [];
let floatingTexts = [];

// Game State
let gameRunning = false;
let frameCount = 0;
let lives = 5;
const targetName = "ANANYA";
let foundLetters = []; 
let score = 0;

// Player
const player = {
    x: 0, y: 0,
    w: 50, h: 50,
    lastShot: 0,
    fireRate: 8,
    invulnerable: 0
};

// Input
const input = { 
    x: 0, 
    y: 0, 
    active: false,
    // Relative touch tracking
    offsetX: 0,
    offsetY: 0
};

/**
 * ------------------------------------------------------------------
 * SETUP & UTILS
 * ------------------------------------------------------------------
 */
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    // Only reset player if game isn't running to avoid gameplay jumps
    if (!gameRunning) {
        player.x = width/2;
        player.y = height - 150;
        input.x = width/2;
        input.y = height - 150;
    } else {
        // Keep inside bounds
        player.x = Math.max(25, Math.min(width-25, player.x));
        player.y = Math.max(25, Math.min(height-25, player.y));
    }
}
window.addEventListener('resize', resize);
resize();

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

// ------------------------------------
// MOBILE OPTIMIZED INPUT HANDLING
// ------------------------------------

// Mouse: Direct Follow (Classic Arcade)
// We use a fixed offset Y so cursor doesn't cover ship
canvas.addEventListener('mousedown', e => {
    input.active = true;
    input.x = e.clientX;
    input.y = e.clientY - 60; // Offset above cursor
    AudioSys.resume();
});
canvas.addEventListener('mousemove', e => {
    if(input.active) {
        input.x = e.clientX;
        input.y = e.clientY - 60;
    }
});
canvas.addEventListener('mouseup', () => input.active = false);

// Touch: Relative Movement (Virtual Joystick style)
// This allows player to touch ANYWHERE to move ship, preventing finger occlusion
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    input.active = true;
    
    // Lock the difference between touch and current ship position
    input.offsetX = player.x - t.clientX;
    input.offsetY = player.y - t.clientY;
    
    // Update input target immediately so no initial jump
    input.x = player.x; 
    input.y = player.y;

    AudioSys.resume();
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(!input.active) return;
    const t = e.touches[0];
    
    // Apply the locked offset to current touch
    input.x = t.clientX + input.offsetX;
    input.y = t.clientY + input.offsetY;
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if(e.touches.length === 0) input.active = false;
});

// Sound Toggle
volBtn.addEventListener('click', () => {
    const isMuted = AudioSys.toggleMute();
    volBtn.innerText = isMuted ? '🔇' : '🔊';
});

/**
 * ------------------------------------------------------------------
 * GAME LOGIC
 * ------------------------------------------------------------------
 */

function initStars() {
    stars = [];
    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 4 + 1
        });
    }
}

function initHUD() {
    // Lives
    livesContainer.innerHTML = '';
    for(let i=0; i<5; i++) {
        const pip = document.createElement('div');
        pip.className = 'life-pip';
        pip.id = `life-${i}`;
        livesContainer.appendChild(pip);
    }
    
    // Word
    wordDisplay.innerHTML = '';
    foundLetters = [];
    for(let i=0; i<targetName.length; i++) {
        foundLetters.push(false);
        const slot = document.createElement('div');
        slot.className = 'letter-slot';
        slot.innerText = ''; 
        slot.dataset.char = targetName[i];
        slot.id = `word-slot-${i}`;
        wordDisplay.appendChild(slot);
    }
}

function updateLivesUI() {
    for(let i=0; i<5; i++) {
        const pip = document.getElementById(`life-${i}`);
        if(i < lives) pip.className = 'life-pip';
        else pip.className = 'life-pip lost';
    }
}

function startGame() {
    AudioSys.init();
    AudioSys.startBGM();
    
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    hud.style.display = 'flex';
    
    gameRunning = true;
    lives = 5;
    frameCount = 0;
    bullets = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    
    // Reset pos
    player.x = width/2;
    player.y = height - 150;
    input.x = width/2;
    input.y = height - 150;
    input.active = false; // Reset input state to prevent jump
    
    initStars();
    initHUD();
    requestAnimationFrame(loop);
}

function gameOver(win) {
    gameRunning = false;
    AudioSys.stopBGM();
    hud.style.display = 'none';
    endScreen.style.display = 'flex';
    
    const title = document.getElementById('end-title');
    const sub = document.getElementById('end-subtitle');
    
    if(win) {
        title.innerText = "MISSION ACCOMPLISHED";
        title.style.color = "#00ffcc";
        sub.innerText = "NAME SEQUENCE COMPLETED";
        AudioSys.playCollect();
    } else {
        title.innerText = "CRITICAL FAILURE";
        title.style.color = "#ff3366";
        sub.innerText = "HULL INTEGRITY ZERO";
    }
}

function spawnEnemy() {
    const size = 30 + Math.random() * 20;
    
    // Smart Spawning: 35% chance to drop a NEEDED letter
    let char = '';
    const neededIndices = foundLetters.map((found, idx) => found ? -1 : idx).filter(i => i !== -1);
    
    if (Math.random() < 0.35 && neededIndices.length > 0) {
        const targetIdx = neededIndices[Math.floor(Math.random() * neededIndices.length)];
        char = targetName[targetIdx];
    } else {
        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        char = alpha[Math.floor(Math.random() * alpha.length)];
    }

    enemies.push({
        x: Math.random() * (width - size*2) + size,
        y: -50,
        w: size,
        h: size,
        letter: char,
        hp: 2,
        vy: Math.random() * 2 + 1.5,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random()-0.5) * 0.05
    });
}

function spawnBullet() {
    AudioSys.playShoot();
    bullets.push({x: player.x - 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    bullets.push({x: player.x + 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    vibrate(5);
}

function createExplosion(x, y, color, amount) {
    for(let i=0; i<amount; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 1
        });
    }
}

/**
 * ------------------------------------------------------------------
 * MAIN LOOP
 * ------------------------------------------------------------------
 */
function loop() {
    if(!gameRunning) return;
    
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
    
    frameCount++;

    // 1. STARS
    ctx.fillStyle = 'white';
    stars.forEach(s => {
        s.y += s.speed;
        if(s.y > height) { s.y = 0; s.x = Math.random()*width; }
        ctx.globalAlpha = Math.random() * 0.5 + 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    // 2. PLAYER LOGIC
    // Use Lerp for smooth movement
    player.x += (input.x - player.x) * 0.2; // Slightly faster lerp for tighter control
    player.y += (input.y - player.y) * 0.2;
    
    // Clamp to screen
    if(player.x < 25) { player.x = 25; input.x = 25; } // Keep input synced at edge
    if(player.x > width-25) { player.x = width-25; input.x = width-25; }
    if(player.y < 25) { player.y = 25; input.y = 25; }
    if(player.y > height-25) { player.y = height-25; input.y = height-25; }
    
    // Auto-fire only when input is active (finger down)
    if(input.active && frameCount - player.lastShot > player.fireRate) {
        spawnBullet();
        player.lastShot = frameCount;
    }
    
    if(player.invulnerable > 0) player.invulnerable--;

    // 3. SPAWN ENEMIES
    if(frameCount % 35 === 0) spawnEnemy();

    // 4. COLLISIONS & UPDATES
    ctx.globalCompositeOperation = 'lighter'; 
    
    // Bullets
    for(let i = bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.y += b.vy;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        
        if(b.y < -50) { bullets.splice(i,1); continue; }
        
        // Check Hit
        for(let j=enemies.length-1; j>=0; j--) {
            let e = enemies[j];
            if(Math.abs(b.x - e.x) < e.w/2 + b.w/2 && Math.abs(b.y - e.y) < e.h/2 + b.h/2) {
                bullets.splice(i,1);
                e.hp--;
                e.y -= 2; 
                createExplosion(b.x, b.y, '#fff', 2);
                
                if(e.hp <= 0) {
                    AudioSys.playExplosion();
                    vibrate(15);
                    createExplosion(e.x, e.y, '#ffaa00', 10);
                    
                    // Letter Check
                    let collected = false;
                    for(let k=0; k<targetName.length; k++) {
                        if(targetName[k] === e.letter && !foundLetters[k]) {
                            foundLetters[k] = true;
                            collected = true;
                            
                            const slot = document.getElementById(`word-slot-${k}`);
                            slot.innerText = e.letter;
                            slot.classList.add('filled');
                            
                            floatingTexts.push({x: e.x, y: e.y, text: e.letter, life: 1.0, vy: -2});
                            AudioSys.playCollect();
                            break; 
                        }
                    }
                    if(!collected) score += 10;
                    enemies.splice(j,1);
                    
                    if(foundLetters.every(x=>x)) setTimeout(() => gameOver(true), 1500);
                }
                break;
            }
        }
    }
    
    // Enemies
    ctx.globalCompositeOperation = 'source-over';
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.vy;
        e.rot += e.rotSpeed;
        
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        
        ctx.fillStyle = '#444';
        let isNeeded = false;
        for(let k=0; k<targetName.length; k++) {
            if(targetName[k] === e.letter && !foundLetters[k]) isNeeded = true;
        }
        if(isNeeded) {
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
        } else {
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
        }
        
        ctx.beginPath();
        for(let s=0; s<6; s++) {
            const angle = s * Math.PI/3;
            ctx.lineTo(Math.cos(angle)*e.w/2, Math.sin(angle)*e.h/2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.rotate(-e.rot); 
        ctx.fillStyle = isNeeded ? '#00ff00' : '#aaa';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.letter, 0, 0);
        
        ctx.restore();
        
        // Player Crash
        if(player.invulnerable === 0) {
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if(Math.sqrt(dx*dx + dy*dy) < (player.w/2 + e.w/2)) {
                lives--;
                updateLivesUI();
                player.invulnerable = 100; 
                createExplosion(player.x, player.y, '#ff3366', 20);
                AudioSys.playExplosion();
                vibrate(200);
                enemies.splice(i,1);
                
                if(lives <= 0) gameOver(false);
            }
        }
        
        if(e.y > height + 50) enemies.splice(i,1);
    }
    
    // 5. DRAW PLAYER
    if(player.invulnerable % 10 < 5) { 
        ctx.save();
        ctx.translate(player.x, player.y);
        
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00d2ff';
        
        ctx.fillStyle = '#eee';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 20);
        ctx.lineTo(0, 10);
        ctx.lineTo(-20, 20);
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff00cc';
        ctx.fillStyle = '#ff00cc';
        ctx.beginPath();
        ctx.moveTo(-10, 20);
        ctx.lineTo(0, 40 + Math.random()*15);
        ctx.lineTo(10, 20);
        ctx.fill();
        
        ctx.restore();
    }
    
    // 6. FLOATING TEXTS & PARTICLES
    ctx.globalCompositeOperation = 'lighter';
    for(let i=floatingTexts.length-1; i>=0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if(ft.life <= 0) { floatingTexts.splice(i,1); continue; }
        
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        
        if(p.life <= 0) { particles.splice(i,1); continue; }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
</body>
