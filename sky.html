<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Star Sculptor: Ananya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: clamp(2.5rem, 10vw, 5rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            margin: 0 0 20px 0;
            padding: 0 20px;
            opacity: 1;
            line-height: 1.1;
        }
        p {
            font-size: clamp(1.1rem, 5vw, 1.4rem);
            color: #ccc;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            padding: 0 20px;
            max-width: 600px;
        }
        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 20px 50px;
            min-width: 200px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(51, 51, 255, 0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(51, 51, 255, 0.8);
            background: linear-gradient(45deg, #d400aa, #2222dd);
        }
        
        /* HUD UPDATED FOR MOBILE */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            padding: 10px 15px;
            padding-top: max(15px, env(safe-area-inset-top));
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        /* Top row: Lives, Level, Vol */
        .hud-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        /* Second row: Score, Time */
        .hud-row-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-family: monospace;
            font-size: 1rem;
            text-shadow: 1px 1px 2px black;
            padding: 0 5px;
        }

        .level-tag { color: #ffeb3b; font-weight: bold; font-size: 1.2rem; }
        .score-tag { color: #00e676; font-weight: bold; }
        .time-tag { color: #00d2ff; font-weight: bold; }

        .lives-container {
            display: flex;
            gap: 4px;
        }
        .life-pip {
            width: 20px;
            height: 8px;
            background: #ff3366;
            box-shadow: 0 0 5px #ff3366;
            transform: skewX(-20deg);
        }
        .life-pip.lost {
            background: #444;
            box-shadow: none;
        }
        
        .target-word-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 5px;
        }
        
        .target-word {
            display: flex;
            gap: 3px;
            flex-wrap: wrap; 
            justify-content: center;
        }

        .letter-slot {
            width: 26px;
            height: 36px;
            border-bottom: 2px solid rgba(0, 210, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-family: monospace;
            font-weight: bold;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
            transition: all 0.3s;
        }
        .letter-slot.filled {
            background: rgba(0, 210, 255, 0.2);
            text-shadow: 0 0 10px #00d2ff;
            border-bottom: 2px solid #fff;
            color: #fff;
            transform: scale(1.1);
        }
        .letter-slot.space {
            border: none;
            background: transparent;
            width: 10px;
        }
        
        /* Larger Mobile Touch Target for Volume */
        #vol-btn {
            pointer-events: auto;
            background: rgba(255,255,255,0.15);
            border: 1px solid #999;
            color: #fff;
            border-radius: 50%;
            width: 44px; /* Mobile accessible size */
            height: 44px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(5px);
        }
        
        /* Small Screen Optimizations */
        @media (max-width: 380px) {
            .letter-slot { width: 20px; height: 30px; font-size: 1rem; }
            .hud-row-stats { font-size: 0.9rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div class="hud-top" id="game-hud" style="display: none;">
    <!-- Row 1: Key Info & Controls -->
    <div class="hud-row-top">
        <div class="lives-container" id="lives-display"></div>
        <div class="level-tag" id="level-display">LVL 1</div>
        <button id="vol-btn">🔊</button>
    </div>
    
    <!-- Row 2: Secondary Stats -->
    <div class="hud-row-stats">
        <div class="score-tag" id="score-display">PTS: 0</div>
        <div class="time-tag" id="time-display">00:00</div>
    </div>

    <!-- Row 3: The Objective -->
    <div class="target-word-container">
        <div class="target-word" id="word-display">
            <!-- populated by js -->
        </div>
    </div>
</div>

<!-- SCREENS -->
<div id="ui-layer">
    <div id="start-screen">
        <h1>Sky Force:<br>Ananya</h1>
        <p>10 Levels. One Mission.</p>
        <p style="color: #ffeb3b; margin-top: 15px; font-size: 0.9rem;">DRAG TO MOVE • AUTO-FIRE</p>
        <button class="btn" id="start-btn">ENGAGE</button>
    </div>
    
    <div id="end-screen" style="display: none;">
        <h1 id="end-title">MISSION COMPLETE</h1>
        <p id="end-subtitle">ALL TARGETS SECURED</p>
        <p id="final-score" style="color: #00e676; margin-top: 10px; font-size: 1.5rem; font-weight: bold;"></p>
        <button class="btn" id="restart-btn">REPLAY</button>
    </div>
    
    <!-- Level Transition Overlay -->
    <div id="level-screen" style="display: none;">
        <h1 id="level-title" style="font-size: 3rem; color: #ffeb3b; text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);">LEVEL 2</h1>
        <p id="level-subtitle" style="font-size: 1.5rem; letter-spacing: 5px;">SHANDILYA</p>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * GAME DATA
 * ------------------------------------------------------------------
 */
const LEVELS = [
    "ANANYA",
    "SHANDILYA",
    "BLUE LAGOON",
    "CONSTITUTION CLUB",
    "JANPATH",
    "PHILOSOPHY",
    "HER MAJESTY",
    "SWIMMING",
    "TOKYO",
    "JUJUTSU KAISEN"
];

/**
 * ------------------------------------------------------------------
 * AUDIO SYSTEM
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    masterGain: null,
    bgmOscillators: [],
    isMuted: false,

    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3; 
                this.masterGain.connect(this.ctx.destination);
            }
        }
        this.resume();
    },

    resume: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e => console.log(e));
        }
    },

    toggleMute: function() {
        this.isMuted = !this.isMuted;
        if(this.masterGain && this.ctx) {
            const currentTime = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(currentTime);
            this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.3, currentTime, 0.1);
        }
        return this.isMuted;
    },

    playShoot: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    playCollect: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    playExplosion: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 50;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 500;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        lfo.stop(this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    startBGM: function() {
        if (!this.ctx) return;
        this.stopBGM();
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.value = 55; // A1
        const gain1 = this.ctx.createGain();
        gain1.gain.value = 0.1;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        osc1.connect(filter);
        filter.connect(this.masterGain);
        osc1.start();
        this.bgmOscillators.push(osc1);

        this.beatInterval = setInterval(() => {
            if(this.isMuted || !this.ctx) return;
            const kOsc = this.ctx.createOscillator();
            const kGain = this.ctx.createGain();
            kOsc.frequency.setValueAtTime(150, this.ctx.currentTime);
            kOsc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kGain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            kGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kOsc.connect(kGain);
            kGain.connect(this.masterGain);
            kOsc.start();
            kOsc.stop(this.ctx.currentTime + 0.2);
        }, 500); 
    },

    stopBGM: function() {
        this.bgmOscillators.forEach(o => o.stop());
        this.bgmOscillators = [];
        if (this.beatInterval) clearInterval(this.beatInterval);
    }
};

/**
 * ------------------------------------------------------------------
 * GAME CONFIG & VARIABLES
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const levelScreen = document.getElementById('level-screen');
const hud = document.getElementById('game-hud');

// HUD Elements
const livesContainer = document.getElementById('lives-display');
const wordDisplay = document.getElementById('word-display');
const levelDisplay = document.getElementById('level-display');
const scoreDisplay = document.getElementById('score-display');
const timeDisplay = document.getElementById('time-display');
const volBtn = document.getElementById('vol-btn');

let width, height;
let particles = [];
let bullets = [];
let enemies = [];
let stars = [];
let floatingTexts = [];

// Game State
let gameRunning = false;
let frameCount = 0;
let lives = 5;
let currentLevelIndex = 0;
let score = 0;
let gameStartTime = 0;
let currentTimeStr = "00:00";
let foundLetters = []; 
let currentTarget = "";
let levelTransitioning = false;

// Player
const player = {
    x: 0, y: 0,
    w: 50, h: 50,
    lastShot: 0,
    fireRate: 8,
    invulnerable: 0
};

// Input
const input = { 
    x: 0, 
    y: 0, 
    active: false,
    offsetX: 0,
    offsetY: 0,
    rawX: 0, // For visual touch indicator
    rawY: 0
};

/**
 * ------------------------------------------------------------------
 * SETUP & UTILS
 * ------------------------------------------------------------------
 */
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    if (!gameRunning) {
        player.x = width/2;
        player.y = height - 150;
        input.x = width/2;
        input.y = height - 150;
    } else {
        player.x = Math.max(25, Math.min(width-25, player.x));
        player.y = Math.max(25, Math.min(height-25, player.y));
    }
}
window.addEventListener('resize', resize);
resize();

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

// Input Handling
function handleInputStart(x, y) {
    input.active = true;
    input.rawX = x;
    input.rawY = y;
    input.offsetX = player.x - x;
    input.offsetY = player.y - y;
    input.x = player.x; 
    input.y = player.y;
    AudioSys.resume();
}

function handleInputMove(x, y) {
    if(!input.active) return;
    input.rawX = x;
    input.rawY = y;
    input.x = x + input.offsetX;
    input.y = y + input.offsetY;
}

canvas.addEventListener('mousedown', e => {
    // Mouse behaves like touch (relative offset) for consistency, 
    // or we can keep it direct. Let's make it direct but with the offset logic 
    // so it doesn't snap if you click far away.
    handleInputStart(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', e => {
    handleInputMove(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => input.active = false);

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    handleInputStart(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    handleInputMove(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if(e.touches.length === 0) input.active = false;
});

volBtn.addEventListener('click', () => {
    const isMuted = AudioSys.toggleMute();
    volBtn.innerText = isMuted ? '🔇' : '🔊';
});

/**
 * ------------------------------------------------------------------
 * GAME LOGIC
 * ------------------------------------------------------------------
 */

function initStars() {
    stars = [];
    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 4 + 1
        });
    }
}

function initHUD() {
    // Lives
    livesContainer.innerHTML = '';
    for(let i=0; i<5; i++) {
        const pip = document.createElement('div');
        pip.className = 'life-pip';
        pip.id = `life-${i}`;
        livesContainer.appendChild(pip);
    }
    updateLevelHUD();
}

function updateLevelHUD() {
    levelDisplay.innerText = `LVL ${currentLevelIndex + 1}`;
    
    // Set up word slots
    wordDisplay.innerHTML = '';
    foundLetters = [];
    currentTarget = LEVELS[currentLevelIndex];
    
    for(let i=0; i<currentTarget.length; i++) {
        const char = currentTarget[i];
        const slot = document.createElement('div');
        slot.id = `word-slot-${i}`;
        
        if (char === ' ') {
            // Space handling
            slot.className = 'letter-slot space';
            foundLetters.push(true); // Space is already found
        } else {
            slot.className = 'letter-slot';
            slot.innerText = ''; 
            slot.dataset.char = char;
            foundLetters.push(false);
        }
        wordDisplay.appendChild(slot);
    }
}

function updateLivesUI() {
    for(let i=0; i<5; i++) {
        const pip = document.getElementById(`life-${i}`);
        if(i < lives) pip.className = 'life-pip';
        else pip.className = 'life-pip lost';
    }
}

function startGame() {
    AudioSys.init();
    AudioSys.startBGM();
    
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    hud.style.display = 'flex';
    
    gameRunning = true;
    lives = 5;
    score = 0;
    frameCount = 0;
    currentLevelIndex = 0;
    gameStartTime = Date.now();
    
    bullets = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    
    // Reset pos
    player.x = width/2;
    player.y = height - 150;
    input.x = width/2;
    input.y = height - 150;
    input.active = false; 
    
    initStars();
    initHUD();
    requestAnimationFrame(loop);
}

function nextLevel() {
    currentLevelIndex++;
    levelTransitioning = true;
    
    if (currentLevelIndex >= LEVELS.length) {
        gameOver(true);
        return;
    }

    // Clear enemies
    enemies = [];
    bullets = [];
    
    // Show Overlay
    levelScreen.style.display = 'flex';
    document.getElementById('level-title').innerText = `LEVEL ${currentLevelIndex + 1}`;
    document.getElementById('level-subtitle').innerText = LEVELS[currentLevelIndex];
    
    // Award Bonus Points
    score += 500;
    scoreDisplay.innerText = `PTS: ${score}`;
    AudioSys.playCollect();

    setTimeout(() => {
        levelScreen.style.display = 'none';
        levelTransitioning = false;
        updateLevelHUD();
    }, 2000);
}

function gameOver(win) {
    gameRunning = false;
    AudioSys.stopBGM();
    hud.style.display = 'none';
    levelScreen.style.display = 'none';
    endScreen.style.display = 'flex';
    
    const title = document.getElementById('end-title');
    const sub = document.getElementById('end-subtitle');
    const fScore = document.getElementById('final-score');
    
    if(win) {
        title.innerText = "MISSION ACCOMPLISHED";
        title.style.color = "#00ffcc";
        sub.innerText = "ALL LEVELS CLEARED";
        AudioSys.playCollect();
    } else {
        title.innerText = "CRITICAL FAILURE";
        title.style.color = "#ff3366";
        sub.innerText = "SHIP DESTROYED";
    }
    fScore.innerText = `FINAL SCORE: ${score} | TIME: ${currentTimeStr}`;
}

function spawnEnemy() {
    if (levelTransitioning) return;
    
    const size = 30 + Math.random() * 20;
    
    // Drop logic: High chance for needed letters
    let char = '';
    const neededIndices = foundLetters.map((found, idx) => found ? -1 : idx).filter(i => i !== -1);
    
    if (Math.random() < 0.4 && neededIndices.length > 0) {
        const targetIdx = neededIndices[Math.floor(Math.random() * neededIndices.length)];
        char = currentTarget[targetIdx];
    } else {
        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        char = alpha[Math.floor(Math.random() * alpha.length)];
    }

    enemies.push({
        x: Math.random() * (width - size*2) + size,
        y: -50,
        w: size,
        h: size,
        letter: char,
        hp: 2,
        vy: Math.random() * 2 + 1.5 + (currentLevelIndex * 0.2), // Get faster each level
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random()-0.5) * 0.05
    });
}

function spawnBullet() {
    if (levelTransitioning) return;
    AudioSys.playShoot();
    bullets.push({x: player.x - 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    bullets.push({x: player.x + 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    vibrate(5);
}

function createExplosion(x, y, color, amount) {
    for(let i=0; i<amount; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 1
        });
    }
}

function updateTime() {
    if (levelTransitioning) return;
    const elapsed = Math.floor((Date.now() - gameStartTime) / 1000);
    const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const s = (elapsed % 60).toString().padStart(2, '0');
    currentTimeStr = `${m}:${s}`;
    timeDisplay.innerText = currentTimeStr;
}

/**
 * ------------------------------------------------------------------
 * MAIN LOOP
 * ------------------------------------------------------------------
 */
function loop() {
    if(!gameRunning) return;
    
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
    
    frameCount++;
    if(frameCount % 60 === 0) updateTime();

    // 1. STARS
    ctx.fillStyle = 'white';
    stars.forEach(s => {
        s.y += s.speed;
        if(s.y > height) { s.y = 0; s.x = Math.random()*width; }
        ctx.globalAlpha = Math.random() * 0.5 + 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    // 2. PLAYER LOGIC
    // Smooth lerp
    player.x += (input.x - player.x) * 0.2; 
    player.y += (input.y - player.y) * 0.2;
    
    // Clamp
    if(player.x < 25) { player.x = 25; input.x = 25; } 
    if(player.x > width-25) { player.x = width-25; input.x = width-25; }
    if(player.y < 25) { player.y = 25; input.y = 25; }
    if(player.y > height-25) { player.y = height-25; input.y = height-25; }
    
    if(input.active && frameCount - player.lastShot > player.fireRate) {
        spawnBullet();
        player.lastShot = frameCount;
    }
    
    if(player.invulnerable > 0) player.invulnerable--;
    
    // VISUAL: Draw Touch Indicator (Where your finger is)
    if(input.active) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(input.rawX, input.rawY, 30, 0, Math.PI*2);
        ctx.stroke();
        
        // Connection line to ship
        ctx.beginPath();
        ctx.moveTo(input.rawX, input.rawY);
        ctx.lineTo(player.x, player.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();
    }

    // 3. SPAWN ENEMIES
    if(!levelTransitioning && frameCount % 35 === 0) spawnEnemy();

    // 4. COLLISIONS & UPDATES
    ctx.globalCompositeOperation = 'lighter'; 
    
    // Bullets
    for(let i = bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.y += b.vy;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        
        if(b.y < -50) { bullets.splice(i,1); continue; }
        
        // Check Hit
        for(let j=enemies.length-1; j>=0; j--) {
            let e = enemies[j];
            if(Math.abs(b.x - e.x) < e.w/2 + b.w/2 && Math.abs(b.y - e.y) < e.h/2 + b.h/2) {
                bullets.splice(i,1);
                e.hp--;
                e.y -= 2; 
                createExplosion(b.x, b.y, '#fff', 2);
                
                if(e.hp <= 0) {
                    AudioSys.playExplosion();
                    vibrate(15);
                    createExplosion(e.x, e.y, '#ffaa00', 10);
                    
                    // Letter Check
                    let collected = false;
                    for(let k=0; k<currentTarget.length; k++) {
                        if(currentTarget[k] === e.letter && !foundLetters[k]) {
                            foundLetters[k] = true;
                            collected = true;
                            
                            const slot = document.getElementById(`word-slot-${k}`);
                            slot.innerText = e.letter;
                            slot.classList.add('filled');
                            
                            score += 100; // Big points for letter
                            floatingTexts.push({x: e.x, y: e.y, text: e.letter, life: 1.0, vy: -2});
                            AudioSys.playCollect();
                            break; 
                        }
                    }
                    if(!collected) score += 10; // Small points for rocks
                    scoreDisplay.innerText = `PTS: ${score}`;
                    
                    enemies.splice(j,1);
                    
                    // CHECK WIN LEVEL
                    if(foundLetters.every(x=>x)) {
                        setTimeout(nextLevel, 1000);
                    }
                }
                break;
            }
        }
    }
    
    // Enemies
    ctx.globalCompositeOperation = 'source-over';
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.vy;
        e.rot += e.rotSpeed;
        
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        
        ctx.fillStyle = '#444';
        let isNeeded = false;
        // Check if letter is needed in current level
        for(let k=0; k<currentTarget.length; k++) {
            if(currentTarget[k] === e.letter && !foundLetters[k]) isNeeded = true;
        }

        if(isNeeded) {
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
        } else {
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
        }
        
        ctx.beginPath();
        for(let s=0; s<6; s++) {
            const angle = s * Math.PI/3;
            ctx.lineTo(Math.cos(angle)*e.w/2, Math.sin(angle)*e.h/2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        ctx.rotate(-e.rot); 
        ctx.fillStyle = isNeeded ? '#00ff00' : '#aaa';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.letter, 0, 0);
        
        ctx.restore();
        
        // Player Crash
        if(player.invulnerable === 0) {
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if(Math.sqrt(dx*dx + dy*dy) < (player.w/2 + e.w/2)) {
                lives--;
                updateLivesUI();
                player.invulnerable = 100; 
                createExplosion(player.x, player.y, '#ff3366', 20);
                AudioSys.playExplosion();
                vibrate(200);
                enemies.splice(i,1);
                
                if(lives <= 0) gameOver(false);
            }
        }
        
        if(e.y > height + 50) enemies.splice(i,1);
    }
    
    // 5. DRAW PLAYER
    if(player.invulnerable % 10 < 5) { 
        ctx.save();
        ctx.translate(player.x, player.y);
        
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00d2ff';
        
        ctx.fillStyle = '#eee';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 20);
        ctx.lineTo(0, 10);
        ctx.lineTo(-20, 20);
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff00cc';
        ctx.fillStyle = '#ff00cc';
        ctx.beginPath();
        ctx.moveTo(-10, 20);
        ctx.lineTo(0, 40 + Math.random()*15);
        ctx.lineTo(10, 20);
        ctx.fill();
        
        ctx.restore();
    }
    
    // 6. FLOATING TEXTS & PARTICLES
    ctx.globalCompositeOperation = 'lighter';
    for(let i=floatingTexts.length-1; i>=0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if(ft.life <= 0) { floatingTexts.splice(i,1); continue; }
        
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        
        if(p.life <= 0) { particles.splice(i,1); continue; }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
</body>
