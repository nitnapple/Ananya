<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Sculptor: Ananya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Critical for mobile game controls */
            user-select: none;
            -webkit-user-select: none;
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            margin: 0;
            opacity: 1;
        }
        p {
            font-size: 1.2rem;
            color: #ccc;
            margin-top: 10px;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 2px solid rgba(255,255,255,0.2);
            padding: 15px 50px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(51, 51, 255, 0.6);
            transition: all 0.2s;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 0 10px rgba(51, 51, 255, 0.8);
        }
        
        /* HUD */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            pointer-events: none;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
        }
        .lives-container {
            display: flex;
            gap: 5px;
        }
        .life-pip {
            width: 20px;
            height: 8px;
            background: #ff3366;
            box-shadow: 0 0 10px #ff3366;
            transform: skewX(-20deg);
        }
        .life-pip.lost {
            background: #333;
            box-shadow: none;
        }
        .target-word {
            display: flex;
            gap: 8px;
        }
        .letter-slot {
            width: 35px;
            height: 45px;
            border-bottom: 3px solid rgba(0, 210, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.8rem;
            font-family: monospace;
            font-weight: bold;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .letter-slot.filled {
            background: rgba(0, 210, 255, 0.2);
            text-shadow: 0 0 15px #00d2ff, 0 0 30px #ffffff;
            border-bottom: 3px solid #fff;
            transform: scale(1.1);
        }
        
        /* Volume Toggle */
        #vol-btn {
            pointer-events: auto;
            background: rgba(0,0,0,0.5);
            border: 1px solid #555;
            color: #fff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div class="hud-top" id="game-hud" style="display: none;">
    <div class="lives-container" id="lives-display">
        <!-- populated by js -->
    </div>
    <div class="target-word" id="word-display">
        <!-- populated by js -->
    </div>
    <button id="vol-btn">🔊</button>
</div>

<!-- SCREENS -->
<div id="ui-layer">
    <div id="start-screen">
        <h1>Sky Force:<br>Ananya</h1>
        <p>Target: Collect letters <strong>A-N-A-N-Y-A</strong></p>
        <p>Control: Drag to move & shoot</p>
        <button class="btn" id="start-btn">ENGAGE</button>
    </div>
    
    <div id="end-screen" style="display: none;">
        <h1 id="end-title">MISSION COMPLETE</h1>
        <p id="end-subtitle">ANANYA FORMED</p>
        <button class="btn" id="restart-btn">REPLAY</button>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * AUDIO SYSTEM (Web Audio API - No external files)
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    masterGain: null,
    bgmOscillators: [],
    isMuted: false,

    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
            this.masterGain = this.ctx.createGain();
            this.masterGain.gain.value = 0.3; // Main volume
            this.masterGain.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },

    toggleMute: function() {
        this.isMuted = !this.isMuted;
        if(this.masterGain) {
            this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.3, this.ctx.currentTime, 0.1);
        }
        return this.isMuted;
    },

    playShoot: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    playCollect: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    playExplosion: function() {
        if (!this.ctx || this.isMuted) return;
        // Simple noise burst approximation using erratic oscillator
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        
        // Tremolo for roughness
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 50;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 500;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        lfo.stop(this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    startBGM: function() {
        if (!this.ctx) return;
        this.stopBGM(); // clear old

        // Bassline drone
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.value = 55; // A1
        const gain1 = this.ctx.createGain();
        gain1.gain.value = 0.1;
        
        // Filter for that muffled synthwave bass
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;

        osc1.connect(filter);
        filter.connect(this.masterGain);
        osc1.start();
        this.bgmOscillators.push(osc1);

        // Simple beat (simulated with an interval for simplicity)
        this.beatInterval = setInterval(() => {
            if(this.isMuted) return;
            // Kick
            const kOsc = this.ctx.createOscillator();
            const kGain = this.ctx.createGain();
            kOsc.frequency.setValueAtTime(150, this.ctx.currentTime);
            kOsc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kGain.gain.setValueAtTime(0.4, this.ctx.currentTime);
            kGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kOsc.connect(kGain);
            kGain.connect(this.masterGain);
            kOsc.start();
            kOsc.stop(this.ctx.currentTime + 0.2);
        }, 500); // 120 BPM
    },

    stopBGM: function() {
        this.bgmOscillators.forEach(o => o.stop());
        this.bgmOscillators = [];
        if (this.beatInterval) clearInterval(this.beatInterval);
    }
};

/**
 * ------------------------------------------------------------------
 * GAME CONFIG & VARIABLES
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); // Optimize
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const hud = document.getElementById('game-hud');
const livesContainer = document.getElementById('lives-display');
const wordDisplay = document.getElementById('word-display');
const volBtn = document.getElementById('vol-btn');

let width, height;
let particles = [];
let bullets = [];
let enemies = [];
let stars = [];
let floatingTexts = [];

// Game State
let gameRunning = false;
let frameCount = 0;
let lives = 5;
const targetName = "ANANYA";
let foundLetters = []; // Boolean array
let score = 0;

// Player
const player = {
    x: 0, y: 0,
    w: 50, h: 50,
    lastShot: 0,
    fireRate: 8,
    invulnerable: 0,
    trail: []
};

// Input
const input = { x: 0, y: 0, active: false };

/**
 * ------------------------------------------------------------------
 * SETUP & UTILS
 * ------------------------------------------------------------------
 */
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    // Keep player on screen if resized
    player.x = width/2;
    player.y = height - 100;
}
window.addEventListener('resize', resize);
resize();

// Haptics
function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

// Input Handling (Touch & Mouse)
function handleInput(x, y) {
    // Relative movement logic: 
    // We don't snap the ship to the finger immediately if it's far, 
    // but in this game, 1:1 follow with an offset is usually best for arcade shooters.
    
    // Y-Offset allows user to see the ship above their finger
    const yOffset = 80; 
    
    input.x = x;
    input.y = y - yOffset;
    input.active = true;
}

canvas.addEventListener('mousedown', e => {
    input.active = true;
    handleInput(e.clientX, e.clientY);
    // On desktop, snap immediately on click? Or smooth.
});
canvas.addEventListener('mousemove', e => {
    if(input.active) handleInput(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => input.active = false);

// Touch: Prevent default to stop scrolling
canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    input.active = true;
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault(); // Stop scroll
    handleInput(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if(e.touches.length === 0) input.active = false;
});

// Sound Toggle
volBtn.addEventListener('click', () => {
    const isMuted = AudioSys.toggleMute();
    volBtn.innerText = isMuted ? '🔇' : '🔊';
});

/**
 * ------------------------------------------------------------------
 * GAME LOGIC
 * ------------------------------------------------------------------
 */

function initStars() {
    stars = [];
    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 4 + 1
        });
    }
}

function initHUD() {
    // Lives
    livesContainer.innerHTML = '';
    for(let i=0; i<5; i++) {
        const pip = document.createElement('div');
        pip.className = 'life-pip';
        pip.id = `life-${i}`;
        livesContainer.appendChild(pip);
    }
    
    // Word
    wordDisplay.innerHTML = '';
    foundLetters = [];
    for(let i=0; i<targetName.length; i++) {
        foundLetters.push(false);
        const slot = document.createElement('div');
        slot.className = 'letter-slot';
        slot.innerText = targetName[i]; // Show letter but dimmed?
        // Actually, let's hide it and only show when found, or show empty placeholder
        slot.innerText = ''; 
        slot.dataset.char = targetName[i];
        slot.id = `word-slot-${i}`;
        wordDisplay.appendChild(slot);
    }
}

function updateLivesUI() {
    for(let i=0; i<5; i++) {
        const pip = document.getElementById(`life-${i}`);
        if(i < lives) pip.className = 'life-pip';
        else pip.className = 'life-pip lost';
    }
}

function startGame() {
    AudioSys.init();
    AudioSys.startBGM();
    
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    hud.style.display = 'flex';
    
    gameRunning = true;
    lives = 5;
    frameCount = 0;
    bullets = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    
    player.x = width/2;
    player.y = height - 100;
    input.x = width/2;
    input.y = height - 100;
    
    initStars();
    initHUD();
    requestAnimationFrame(loop);
}

function gameOver(win) {
    gameRunning = false;
    AudioSys.stopBGM();
    hud.style.display = 'none';
    endScreen.style.display = 'flex';
    
    const title = document.getElementById('end-title');
    const sub = document.getElementById('end-subtitle');
    
    if(win) {
        title.innerText = "MISSION ACCOMPLISHED";
        title.style.color = "#00ffcc";
        sub.innerText = "NAME SEQUENCE COMPLETED";
        AudioSys.playCollect();
    } else {
        title.innerText = "CRITICAL FAILURE";
        title.style.color = "#ff3366";
        sub.innerText = "HULL INTEGRITY ZERO";
    }
}

function spawnEnemy() {
    const size = 30 + Math.random() * 20;
    
    // Letter Logic:
    // 30% chance to drop a letter we actually need
    let char = '';
    const neededIndices = foundLetters.map((found, idx) => found ? -1 : idx).filter(i => i !== -1);
    
    if (Math.random() < 0.35 && neededIndices.length > 0) {
        // Drop needed letter
        const targetIdx = neededIndices[Math.floor(Math.random() * neededIndices.length)];
        char = targetName[targetIdx];
    } else {
        // Random junk letter
        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        char = alpha[Math.floor(Math.random() * alpha.length)];
    }

    enemies.push({
        x: Math.random() * (width - size*2) + size,
        y: -50,
        w: size,
        h: size,
        letter: char,
        hp: 2,
        vy: Math.random() * 2 + 1.5,
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random()-0.5) * 0.05
    });
}

function spawnBullet() {
    AudioSys.playShoot();
    // Left Gun
    bullets.push({x: player.x - 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    // Right Gun
    bullets.push({x: player.x + 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    
    vibrate(5); // Slight tick
}

function createExplosion(x, y, color, amount) {
    for(let i=0; i<amount; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 1
        });
    }
}

/**
 * ------------------------------------------------------------------
 * MAIN LOOP
 * ------------------------------------------------------------------
 */
function loop() {
    if(!gameRunning) return;
    
    // Background Clear
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
    
    frameCount++;

    // 1. STARS
    ctx.fillStyle = 'white';
    stars.forEach(s => {
        s.y += s.speed;
        if(s.y > height) { s.y = 0; s.x = Math.random()*width; }
        ctx.globalAlpha = Math.random() * 0.5 + 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    // 2. PLAYER LOGIC
    // Smooth follow
    player.x += (input.x - player.x) * 0.15;
    player.y += (input.y - player.y) * 0.15;
    
    // Clamp
    if(player.x < 25) player.x = 25;
    if(player.x > width-25) player.x = width-25;
    if(player.y < 25) player.y = 25;
    if(player.y > height-25) player.y = height-25;
    
    // Auto-fire
    if(input.active && frameCount - player.lastShot > player.fireRate) {
        spawnBullet();
        player.lastShot = frameCount;
    }
    
    if(player.invulnerable > 0) player.invulnerable--;

    // 3. SPAWN ENEMIES
    if(frameCount % 35 === 0) spawnEnemy();

    // 4. UPDATES & COLLISIONS
    
    // Bullets
    ctx.globalCompositeOperation = 'lighter'; // GLOW
    for(let i = bullets.length-1; i>=0; i--) {
        let b = bullets[i];
        b.y += b.vy;
        
        ctx.shadowBlur = 15;
        ctx.shadowColor = b.color;
        ctx.fillStyle = b.color;
        ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        
        if(b.y < -50) { bullets.splice(i,1); continue; }
        
        // Check Hit
        for(let j=enemies.length-1; j>=0; j--) {
            let e = enemies[j];
            if(Math.abs(b.x - e.x) < e.w/2 + b.w/2 && Math.abs(b.y - e.y) < e.h/2 + b.h/2) {
                // Hit
                bullets.splice(i,1);
                e.hp--;
                e.y -= 2; // Impact shake
                createExplosion(b.x, b.y, '#fff', 2);
                
                if(e.hp <= 0) {
                    AudioSys.playExplosion();
                    vibrate(15);
                    createExplosion(e.x, e.y, '#ffaa00', 10);
                    
                    // Letter Logic
                    let collected = false;
                    for(let k=0; k<targetName.length; k++) {
                        if(targetName[k] === e.letter && !foundLetters[k]) {
                            foundLetters[k] = true;
                            collected = true;
                            
                            // Update UI
                            const slot = document.getElementById(`word-slot-${k}`);
                            slot.innerText = e.letter;
                            slot.classList.add('filled');
                            
                            // Visual Feedback
                            floatingTexts.push({x: e.x, y: e.y, text: e.letter, life: 1.0, vy: -2});
                            AudioSys.playCollect();
                            break; // Only collect one instance per rock
                        }
                    }
                    
                    if(!collected) {
                        // Just points
                        score += 10;
                    }
                    
                    enemies.splice(j,1);
                    
                    // Check Win
                    if(foundLetters.every(x=>x)) {
                        setTimeout(() => gameOver(true), 1500);
                    }
                }
                break;
            }
        }
    }
    
    // Enemies
    ctx.globalCompositeOperation = 'source-over';
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.vy;
        e.rot += e.rotSpeed;
        
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        
        // Draw Rock
        ctx.fillStyle = '#444';
        // Highlight rocks we need
        let isNeeded = false;
        for(let k=0; k<targetName.length; k++) {
            if(targetName[k] === e.letter && !foundLetters[k]) isNeeded = true;
        }
        if(isNeeded) {
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
        } else {
            ctx.strokeStyle = '#666';
            ctx.lineWidth = 1;
        }
        
        // Hexagon-ish shape
        ctx.beginPath();
        for(let s=0; s<6; s++) {
            const angle = s * Math.PI/3;
            ctx.lineTo(Math.cos(angle)*e.w/2, Math.sin(angle)*e.h/2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        
        // Letter
        ctx.rotate(-e.rot); // Keep letter upright
        ctx.fillStyle = isNeeded ? '#00ff00' : '#aaa';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(e.letter, 0, 0);
        
        ctx.restore();
        
        // Player Crash
        if(player.invulnerable === 0) {
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if(Math.sqrt(dx*dx + dy*dy) < (player.w/2 + e.w/2)) {
                // Crash
                lives--;
                updateLivesUI();
                player.invulnerable = 100; // frames
                createExplosion(player.x, player.y, '#ff3366', 20);
                AudioSys.playExplosion();
                vibrate(200);
                enemies.splice(i,1);
                
                if(lives <= 0) gameOver(false);
            }
        }
        
        if(e.y > height + 50) enemies.splice(i,1);
    }
    
    // 5. DRAW PLAYER
    if(player.invulnerable % 10 < 5) { // Flicker if invuln
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Glow effect
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#00d2ff';
        
        // Ship Body
        ctx.fillStyle = '#eee';
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 20);
        ctx.lineTo(0, 10);
        ctx.lineTo(-20, 20);
        ctx.closePath();
        ctx.fill();
        
        // Engine
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff00cc';
        ctx.fillStyle = '#ff00cc';
        ctx.beginPath();
        ctx.moveTo(-10, 20);
        ctx.lineTo(0, 40 + Math.random()*15);
        ctx.lineTo(10, 20);
        ctx.fill();
        
        ctx.restore();
    }
    
    // 6. FLOATING TEXTS & PARTICLES
    ctx.globalCompositeOperation = 'lighter';
    
    // Text
    for(let i=floatingTexts.length-1; i>=0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if(ft.life <= 0) { floatingTexts.splice(i,1); continue; }
        
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    
    // Particles
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        
        if(p.life <= 0) { particles.splice(i,1); continue; }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
</body>
</html>
