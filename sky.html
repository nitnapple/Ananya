<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Star Sculptor: Ananya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }
        canvas {
            display: block;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            z-index: 10;
        }
        h1 {
            font-size: clamp(2rem, 8vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-shadow: 0 0 20px #00d2ff, 0 0 40px #00d2ff;
            margin: 0 0 20px 0;
            padding: 0 20px;
            opacity: 1;
            line-height: 1.1;
        }
        p {
            font-size: clamp(1rem, 4.5vw, 1.2rem);
            color: #ccc;
            margin-top: 5px;
            text-shadow: 0 0 5px rgba(0,0,0,0.8);
            padding: 0 20px;
            max-width: 600px;
            line-height: 1.4;
        }
        .btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: 2px solid rgba(255,255,255,0.4);
            padding: 15px 40px;
            min-width: 180px;
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 25px rgba(51, 51, 255, 0.6);
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(51, 51, 255, 0.8);
            background: linear-gradient(45deg, #d400aa, #2222dd);
        }
        
        /* --- OPTIMIZED HUD --- */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
            padding: 8px 12px;
            padding-top: max(10px, env(safe-area-inset-top));
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 4px;
            pointer-events: none;
            z-index: 5;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 80%, transparent 100%);
        }

        .hud-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            height: 44px;
        }

        .controls-container {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .hud-row-stats {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            gap: 12px;
            font-family: monospace;
            font-size: 0.9rem;
            text-shadow: 1px 1px 2px black;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            padding: 2px 0;
            margin-bottom: 4px;
        }

        .level-tag { color: #ffeb3b; font-weight: bold; }
        .score-tag { color: #00e676; font-weight: bold; }
        .time-tag { color: #00d2ff; font-weight: bold; }

        .lives-container {
            display: flex;
            gap: 3px;
            align-items: center;
        }
        .life-pip {
            width: 18px;
            height: 8px;
            background: #ff3366;
            box-shadow: 0 0 5px #ff3366;
            transform: skewX(-20deg);
        }
        .life-pip.lost {
            background: #444;
            box-shadow: none;
        }
        
        .target-word-container {
            display: flex;
            justify-content: center;
            width: 100%;
            margin-top: 0;
            min-height: 40px; 
        }
        
        .target-word {
            display: flex;
            gap: 3px;
            flex-wrap: wrap; 
            justify-content: center;
        }
        
        .letter-slot {
            width: 28px;
            height: 38px;
            border-bottom: 3px solid rgba(0, 210, 255, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-family: monospace;
            font-weight: bold;
            color: #00d2ff;
            background: rgba(0, 210, 255, 0.05);
            transition: all 0.3s;
        }

        .target-word.compact {
            gap: 2px;
        }
        .target-word.compact .letter-slot {
            width: 6vw;
            max-width: 24px;
            height: 32px;
            font-size: 0.9rem;
            border-bottom-width: 2px;
        }

        .letter-slot.filled {
            background: rgba(0, 210, 255, 0.2);
            text-shadow: 0 0 10px #00d2ff;
            border-bottom: 3px solid #fff;
            color: #fff;
            transform: scale(1.1);
        }
        .letter-slot.space {
            border: none;
            background: transparent;
            width: 8px;
        }
        
        .circle-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.4);
            color: #fff;
            border-radius: 50%;
            width: 44px;
            height: 44px;
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            backdrop-filter: blur(4px);
            font-weight: bold;
        }
        .circle-btn:active {
            background: rgba(255,255,255,0.3);
            transform: scale(0.95);
        }
        
        /* Overlays (Pause & End) */
        #pause-screen, #end-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(10px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto; /* Capture clicks */
            padding: 20px;
            box-sizing: border-box;
        }

        /* End Screen Specifics */
        #end-title {
            font-size: clamp(2.5rem, 9vw, 4.5rem);
            margin-bottom: 5px;
            line-height: 1.1;
            text-align: center;
        }
        
        #end-subtitle {
            font-size: clamp(1rem, 4vw, 1.4rem);
            color: #bbb;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-align: center;
        }

        #final-score {
            font-family: monospace;
            font-size: clamp(1.1rem, 4.5vw, 1.5rem);
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            padding: 15px 0;
            width: 100%;
            text-align: center;
            margin-bottom: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #fff;
        }

        @media (max-width: 380px) {
            .hud-row-stats { font-size: 0.8rem; gap: 8px; }
            .btn { padding: 12px 30px; font-size: 1.1rem; }
            .circle-btn { width: 40px; height: 40px; font-size: 1rem; }
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div class="hud-top" id="game-hud" style="display: none;">
    <div class="hud-row-top">
        <div class="lives-container" id="lives-display"></div>
        <div class="controls-container">
            <button class="circle-btn" id="pause-btn">||</button>
            <button class="circle-btn" id="vol-btn">🔊</button>
        </div>
    </div>
    
    <div class="hud-row-stats">
        <div class="level-tag" id="level-display">LVL 1</div>
        <div class="score-tag" id="score-display">PTS: 0</div>
        <div class="time-tag" id="time-display">00:00</div>
    </div>

    <div class="target-word-container">
        <div class="target-word" id="word-display"></div>
    </div>
</div>

<!-- SCREENS -->
<div id="ui-layer">
    <div id="start-screen">
        <h1>Sky Force:<br>Ananya</h1>
        <p>10 Levels. One Mission.</p>
        <p style="color: #ffeb3b; font-weight: bold; font-size: 0.9rem; margin-top: 15px;">DRAG TO MOVE • AUTO-FIRE</p>
        <button class="btn" id="start-btn">ENGAGE</button>
    </div>
    
    <div id="pause-screen">
        <h1 style="color: #ffeb3b; font-size: 3rem; margin-bottom: 30px;">PAUSED</h1>
        <button class="btn" id="resume-btn">RESUME</button>
        <button class="btn" id="quit-btn" style="background: transparent; border: 1px solid #666; margin-top: 20px; font-size: 1rem; padding: 10px 30px;">QUIT</button>
    </div>

    <div id="end-screen">
        <h1 id="end-title">MISSION COMPLETE</h1>
        <p id="end-subtitle">ALL TARGETS SECURED</p>
        <div id="final-score"></div>
        <button class="btn" id="restart-btn">REPLAY MISSION</button>
    </div>
    
    <div id="level-screen" style="display: none;">
        <h1 id="level-title" style="font-size: 3rem; color: #ffeb3b; text-shadow: 0 0 20px rgba(255, 235, 59, 0.5);">LEVEL 2</h1>
        <p id="level-subtitle" style="font-size: 1.2rem; letter-spacing: 3px; margin-top: 10px;">SHANDILYA</p>
    </div>
</div>

<script>
/**
 * ------------------------------------------------------------------
 * GAME DATA & ASSETS
 * ------------------------------------------------------------------
 */
const LEVELS = [
    "ANANYA",
    "SHANDILYA",
    "BLUE LAGOON",
    "CONSTITUTION CLUB",
    "JANPATH",
    "PHILOSOPHY",
    "HER MAJESTY",
    "SWIMMING",
    "TOKYO",
    "JUJUTSU KAISEN"
];

const asteroidImg = new Image();
asteroidImg.crossOrigin = "Anonymous";
asteroidImg.src = "https://cdn.creazilla.com/cliparts/4310/asteroid-clipart-xl.png";

/**
 * ------------------------------------------------------------------
 * AUDIO SYSTEM
 * ------------------------------------------------------------------
 */
const AudioSys = {
    ctx: null,
    masterGain: null,
    bgmOscillators: [],
    isMuted: false,

    init: function() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
                this.ctx = new AudioContext();
                this.masterGain = this.ctx.createGain();
                this.masterGain.gain.value = 0.3; 
                this.masterGain.connect(this.ctx.destination);
            }
        }
        this.resume();
    },

    resume: function() {
        if (this.ctx && this.ctx.state === 'suspended') {
            this.ctx.resume().catch(e => console.log(e));
        }
    },

    toggleMute: function() {
        this.isMuted = !this.isMuted;
        if(this.masterGain && this.ctx) {
            const currentTime = this.ctx.currentTime;
            this.masterGain.gain.cancelScheduledValues(currentTime);
            this.masterGain.gain.setTargetAtTime(this.isMuted ? 0 : 0.3, currentTime, 0.1);
        }
        return this.isMuted;
    },

    playShoot: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(800, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.1);
    },

    playCollect: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    playPowerupCollect: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(200, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    playExplosion: function() {
        if (!this.ctx || this.isMuted) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(10, this.ctx.currentTime + 0.3);
        
        const lfo = this.ctx.createOscillator();
        lfo.frequency.value = 50;
        const lfoGain = this.ctx.createGain();
        lfoGain.gain.value = 500;
        lfo.connect(lfoGain);
        lfoGain.connect(osc.frequency);
        lfo.start();
        lfo.stop(this.ctx.currentTime + 0.3);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
        osc.connect(gain);
        gain.connect(this.masterGain);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.3);
    },

    startBGM: function() {
        if (!this.ctx) return;
        this.stopBGM();
        const osc1 = this.ctx.createOscillator();
        osc1.type = 'sawtooth';
        osc1.frequency.value = 55; // A1
        const gain1 = this.ctx.createGain();
        gain1.gain.value = 0.08;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 400;
        osc1.connect(filter);
        filter.connect(this.masterGain);
        osc1.start();
        this.bgmOscillators.push(osc1);

        this.beatInterval = setInterval(() => {
            if(this.isMuted || !this.ctx || window.isPaused) return; 
            const kOsc = this.ctx.createOscillator();
            const kGain = this.ctx.createGain();
            kOsc.frequency.setValueAtTime(150, this.ctx.currentTime);
            kOsc.frequency.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kGain.gain.setValueAtTime(0.25, this.ctx.currentTime);
            kGain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            kOsc.connect(kGain);
            kGain.connect(this.masterGain);
            kOsc.start();
            kOsc.stop(this.ctx.currentTime + 0.2);
        }, 500); 
    },

    stopBGM: function() {
        this.bgmOscillators.forEach(o => o.stop());
        this.bgmOscillators = [];
        if (this.beatInterval) clearInterval(this.beatInterval);
    }
};

/**
 * ------------------------------------------------------------------
 * GAME CONFIG & VARIABLES
 * ------------------------------------------------------------------
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false }); 
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const levelScreen = document.getElementById('level-screen');
const pauseScreen = document.getElementById('pause-screen');
const hud = document.getElementById('game-hud');

// HUD Elements
const livesContainer = document.getElementById('lives-display');
const wordDisplay = document.getElementById('word-display');
const levelDisplay = document.getElementById('level-display');
const scoreDisplay = document.getElementById('score-display');
const timeDisplay = document.getElementById('time-display');
const volBtn = document.getElementById('vol-btn');
const pauseBtn = document.getElementById('pause-btn');
const resumeBtn = document.getElementById('resume-btn');
const quitBtn = document.getElementById('quit-btn');

let width, height;
let particles = [];
let bullets = [];
let enemies = [];
let stars = [];
let floatingTexts = [];
let powerups = [];

// Game State
let gameRunning = false;
window.isPaused = false; 
let frameCount = 0;
let lives = 5;
let currentLevelIndex = 0;
let score = 0;
let gameStartTime = 0;
let pausedTime = 0;
let pauseStart = 0;
let currentTimeStr = "00:00";
let foundLetters = []; 
let currentTarget = "";
let levelTransitioning = false;

// Timers for cleanup
let winTimeout = null;
let levelTimeout = null;

// Player
const player = {
    x: 0, y: 0,
    w: 50, h: 50,
    lastShot: 0,
    fireRate: 8,
    invulnerable: 0,
    beamMode: 0 // Timer for beam powerup
};

// Input
const input = { 
    x: 0, 
    y: 0, 
    active: false,
    offsetX: 0,
    offsetY: 0,
    rawX: 0,
    rawY: 0
};

/**
 * ------------------------------------------------------------------
 * SETUP & UTILS
 * ------------------------------------------------------------------
 */
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    
    if (!gameRunning) {
        player.x = width/2;
        player.y = height - 150;
        input.x = width/2;
        input.y = height - 150;
    } else {
        player.x = Math.max(25, Math.min(width-25, player.x));
        player.y = Math.max(25, Math.min(height-25, player.y));
    }
}
window.addEventListener('resize', resize);
resize();

function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
}

// Input Handling
function handleInputStart(x, y) {
    if(window.isPaused) return;
    input.active = true;
    input.rawX = x;
    input.rawY = y;
    input.offsetX = player.x - x;
    input.offsetY = player.y - y;
    input.x = player.x; 
    input.y = player.y;
    AudioSys.resume();
}

function handleInputMove(x, y) {
    if(!input.active || window.isPaused) return;
    input.rawX = x;
    input.rawY = y;
    input.x = x + input.offsetX;
    input.y = y + input.offsetY;
}

canvas.addEventListener('mousedown', e => {
    handleInputStart(e.clientX, e.clientY);
});
canvas.addEventListener('mousemove', e => {
    handleInputMove(e.clientX, e.clientY);
});
canvas.addEventListener('mouseup', () => input.active = false);

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    handleInputStart(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const t = e.touches[0];
    handleInputMove(t.clientX, t.clientY);
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    if(e.touches.length === 0) input.active = false;
});

// Controls
volBtn.addEventListener('click', () => {
    const isMuted = AudioSys.toggleMute();
    volBtn.innerText = isMuted ? '🔇' : '🔊';
});

pauseBtn.addEventListener('click', () => {
    togglePause();
});

resumeBtn.addEventListener('click', () => {
    togglePause();
});

quitBtn.addEventListener('click', () => {
    togglePause(); 
    gameRunning = false;
    hud.style.display = 'none';
    pauseScreen.style.display = 'none';
    startScreen.style.display = 'flex';
    AudioSys.stopBGM();
});

function togglePause() {
    if(!gameRunning) return;
    window.isPaused = !window.isPaused;
    
    if(window.isPaused) {
        pauseScreen.style.display = 'flex';
        pauseStart = Date.now();
        input.active = false; 
    } else {
        pauseScreen.style.display = 'none';
        pausedTime += (Date.now() - pauseStart);
        requestAnimationFrame(loop);
    }
}

/**
 * ------------------------------------------------------------------
 * GAME LOGIC
 * ------------------------------------------------------------------
 */

function initStars() {
    stars = [];
    for(let i=0; i<80; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2 + 0.5,
            speed: Math.random() * 4 + 1
        });
    }
}

function initHUD() {
    livesContainer.innerHTML = '';
    for(let i=0; i<5; i++) {
        const pip = document.createElement('div');
        pip.className = 'life-pip';
        pip.id = `life-${i}`;
        livesContainer.appendChild(pip);
    }
    updateLevelHUD();
}

function updateLevelHUD() {
    levelDisplay.innerText = `LVL ${currentLevelIndex + 1}`;
    
    wordDisplay.innerHTML = '';
    foundLetters = [];
    currentTarget = LEVELS[currentLevelIndex];
    
    if(currentTarget.length > 8) {
        wordDisplay.classList.add('compact');
    } else {
        wordDisplay.classList.remove('compact');
    }
    
    for(let i=0; i<currentTarget.length; i++) {
        const char = currentTarget[i];
        const slot = document.createElement('div');
        slot.id = `word-slot-${i}`;
        
        if (char === ' ') {
            slot.className = 'letter-slot space';
            foundLetters.push(true); 
        } else {
            slot.className = 'letter-slot';
            slot.innerText = ''; 
            slot.dataset.char = char;
            foundLetters.push(false);
        }
        wordDisplay.appendChild(slot);
    }
}

function updateLivesUI() {
    for(let i=0; i<5; i++) {
        const pip = document.getElementById(`life-${i}`);
        if(i < lives) pip.className = 'life-pip';
        else pip.className = 'life-pip lost';
    }
}

function clearGameTimeouts() {
    if(winTimeout) clearTimeout(winTimeout);
    if(levelTimeout) clearTimeout(levelTimeout);
    winTimeout = null;
    levelTimeout = null;
}

function startGame() {
    clearGameTimeouts(); 
    AudioSys.init();
    AudioSys.startBGM();
    
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    levelScreen.style.display = 'none';
    pauseScreen.style.display = 'none';
    hud.style.display = 'flex';
    
    gameRunning = true;
    window.isPaused = false;
    lives = 5;
    score = 0;
    scoreDisplay.innerText = `PTS: ${score}`;
    frameCount = 0;
    currentLevelIndex = 0;
    levelTransitioning = false;
    gameStartTime = Date.now();
    pausedTime = 0;
    
    bullets = [];
    enemies = [];
    particles = [];
    floatingTexts = [];
    powerups = [];
    
    player.x = width/2;
    player.y = height - 150;
    player.beamMode = 0;
    input.x = width/2;
    input.y = height - 150;
    input.active = false; 
    
    initStars();
    initHUD();
    requestAnimationFrame(loop);
}

function nextLevel() {
    winTimeout = null;
    currentLevelIndex++;
    levelTransitioning = true;
    player.beamMode = 0; // Reset beam on level change
    
    if (currentLevelIndex >= LEVELS.length) {
        gameOver(true);
        return;
    }

    enemies = [];
    bullets = [];
    powerups = [];
    
    levelScreen.style.display = 'flex';
    document.getElementById('level-title').innerText = `LEVEL ${currentLevelIndex + 1}`;
    document.getElementById('level-subtitle').innerText = LEVELS[currentLevelIndex];
    
    score += 500;
    scoreDisplay.innerText = `PTS: ${score}`;
    AudioSys.playCollect();

    levelTimeout = setTimeout(() => {
        if(!gameRunning) return; 
        levelScreen.style.display = 'none';
        levelTransitioning = false;
        updateLevelHUD();
        enemies = [];
        bullets = [];
    }, 2000);
}

function gameOver(win) {
    clearGameTimeouts(); 
    gameRunning = false;
    AudioSys.stopBGM();
    hud.style.display = 'none';
    levelScreen.style.display = 'none';
    endScreen.style.display = 'flex';
    
    const title = document.getElementById('end-title');
    const sub = document.getElementById('end-subtitle');
    const fScore = document.getElementById('final-score');
    
    if(win) {
        title.innerText = "MISSION ACCOMPLISHED";
        title.style.color = "#00ffcc";
        sub.innerText = "ALL LEVELS CLEARED";
        AudioSys.playCollect();
    } else {
        title.innerText = "CRITICAL FAILURE";
        title.style.color = "#ff3366";
        sub.innerText = "SHIP DESTROYED";
    }
    fScore.innerText = `FINAL SCORE: ${score} | TIME: ${currentTimeStr}`;
}

function spawnPowerup(x, y) {
    powerups.push({
        x: x,
        y: y,
        vy: 2,
        w: 30,
        h: 30,
        type: 'beam'
    });
}

function spawnEnemy() {
    if (levelTransitioning) return;
    
    const size = 30 + Math.random() * 20;
    
    let char = '';
    const neededIndices = foundLetters.map((found, idx) => found ? -1 : idx).filter(i => i !== -1);
    
    if (Math.random() < 0.4 && neededIndices.length > 0) {
        const targetIdx = neededIndices[Math.floor(Math.random() * neededIndices.length)];
        char = currentTarget[targetIdx];
    } else {
        const alpha = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        char = alpha[Math.floor(Math.random() * alpha.length)];
    }

    enemies.push({
        x: Math.random() * (width - size*2) + size,
        y: -50,
        w: size,
        h: size,
        letter: char,
        hp: Math.floor(Math.random() * 3) + 3,
        vy: Math.random() * 2 + 1.5 + (currentLevelIndex * 0.2), 
        rot: Math.random() * Math.PI,
        rotSpeed: (Math.random()-0.5) * 0.05
    });
}

function spawnBullet() {
    if (levelTransitioning) return;
    AudioSys.playShoot();
    bullets.push({x: player.x - 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    bullets.push({x: player.x + 15, y: player.y, w: 4, h: 20, vy: -18, color: '#00ffff'});
    vibrate(5);
}

function createExplosion(x, y, color, amount) {
    for(let i=0; i<amount; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 10,
            vy: (Math.random() - 0.5) * 10,
            life: 1.0,
            color: color,
            size: Math.random() * 4 + 1
        });
    }
}

function updateTime() {
    if (levelTransitioning) return;
    const effectiveTime = Date.now() - gameStartTime - pausedTime;
    const elapsed = Math.max(0, Math.floor(effectiveTime / 1000));
    const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
    const s = (elapsed % 60).toString().padStart(2, '0');
    currentTimeStr = `${m}:${s}`;
    timeDisplay.innerText = currentTimeStr;
}

/**
 * ------------------------------------------------------------------
 * MAIN LOOP
 * ------------------------------------------------------------------
 */
function loop() {
    if(!gameRunning) return;
    if(window.isPaused) return; 

    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#050510';
    ctx.fillRect(0, 0, width, height);
    
    frameCount++;
    if(frameCount % 60 === 0) updateTime();

    // 1. STARS
    ctx.fillStyle = 'white';
    stars.forEach(s => {
        s.y += s.speed;
        if(s.y > height) { s.y = 0; s.x = Math.random()*width; }
        ctx.globalAlpha = Math.random() * 0.5 + 0.2;
        ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;

    // 2. PLAYER LOGIC
    player.x += (input.x - player.x) * 0.2; 
    player.y += (input.y - player.y) * 0.2;
    
    if(player.x < 25) { player.x = 25; input.x = 25; } 
    if(player.x > width-25) { player.x = width-25; input.x = width-25; }
    if(player.y < 25) { player.y = 25; input.y = 25; }
    if(player.y > height-25) { player.y = height-25; input.y = height-25; }
    
    // BEAM or NORMAL FIRE
    if(player.beamMode > 0) {
        player.beamMode--;
        // DRAW BEAM
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        // Pulsating width
        let beamW = 40 + Math.sin(frameCount * 0.5) * 10;
        let grad = ctx.createLinearGradient(player.x - beamW/2, player.y, player.x + beamW/2, player.y);
        grad.addColorStop(0, 'rgba(0, 255, 255, 0)');
        grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
        grad.addColorStop(1, 'rgba(0, 255, 255, 0)');
        
        ctx.fillStyle = grad;
        ctx.fillRect(player.x - beamW/2, 0, beamW, player.y);
        
        // Secondary outer glow
        ctx.fillStyle = 'rgba(0, 200, 255, 0.2)';
        ctx.fillRect(player.x - beamW, 0, beamW*2, player.y);
        
        ctx.restore();
        
        // BEAM COLLISION (Hit everything in column)
        // Check every 4 frames to avoid instant 60 damage/sec unless we want that
        if(frameCount % 4 === 0) {
             for (let j = enemies.length - 1; j >= 0; j--) {
                let e = enemies[j];
                // Simple X check with margin
                if(Math.abs(e.x - player.x) < (beamW/2 + e.w/2)) {
                    // HIT
                    e.hp -= 3; // High damage
                    createExplosion(e.x, e.y, '#00ffff', 2);
                    
                    if (e.hp <= 0) {
                        AudioSys.playExplosion();
                        createExplosion(e.x, e.y, '#ffaa00', 10);
                        
                        let collected = false;
                        for(let k=0; k<currentTarget.length; k++) {
                            if(currentTarget[k] === e.letter && !foundLetters[k]) {
                                foundLetters[k] = true;
                                collected = true;
                                const slot = document.getElementById(`word-slot-${k}`);
                                if(slot) {
                                    slot.innerText = e.letter;
                                    slot.classList.add('filled');
                                }
                                score += 100; 
                                floatingTexts.push({x: e.x, y: e.y, text: e.letter, life: 1.0, vy: -2});
                                AudioSys.playCollect();
                                break; 
                            }
                        }
                        if(!collected) score += 10;
                        scoreDisplay.innerText = `PTS: ${score}`;
                        
                        // Spawn Powerup Chance
                        if(Math.random() < 0.1) spawnPowerup(e.x, e.y);
                        
                        enemies.splice(j,1);
                        
                        if(foundLetters.every(x=>x) && !winTimeout && !levelTransitioning) {
                            winTimeout = setTimeout(nextLevel, 1000);
                        }
                    }
                }
             }
        }
        
    } else {
        // Normal Fire
        if(input.active && frameCount - player.lastShot > player.fireRate) {
            spawnBullet();
            player.lastShot = frameCount;
        }
    }
    
    if(player.invulnerable > 0) player.invulnerable--;
    
    // VISUAL: Draw Touch Indicator
    if(input.active) {
        ctx.globalCompositeOperation = 'lighter';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(input.rawX, input.rawY, 30, 0, Math.PI*2);
        ctx.stroke();
        
        ctx.beginPath();
        ctx.moveTo(input.rawX, input.rawY);
        ctx.lineTo(player.x, player.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
        ctx.stroke();
    }

    // 3. SPAWN ENEMIES
    if(!levelTransitioning && frameCount % 35 === 0) spawnEnemy();
    
    // 4. POWERUPS
    ctx.globalCompositeOperation = 'source-over';
    for (let i = powerups.length - 1; i >= 0; i--) {
        let p = powerups[i];
        p.y += p.vy;
        
        // Draw
        ctx.save();
        ctx.translate(p.x, p.y);
        // Glow
        ctx.shadowColor = '#ffff00';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(0, 0, 15, 0, Math.PI*2);
        ctx.fill();
        // Icon
        ctx.fillStyle = '#000';
        ctx.font = 'bold 20px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText("⚡", 0, 2);
        ctx.restore();
        
        // Collision with player
        const dist = Math.sqrt((player.x - p.x)**2 + (player.y - p.y)**2);
        if(dist < (player.w/2 + 15)) {
            // Collected
            player.beamMode = 300; // 5 seconds at 60fps
            AudioSys.playPowerupCollect();
            floatingTexts.push({x: player.x, y: player.y - 40, text: "BEAM MODE!", life: 1.5, vy: -1});
            powerups.splice(i, 1);
            continue;
        }
        
        if(p.y > height + 50) powerups.splice(i, 1);
    }

    // 5. COLLISIONS & UPDATES (Bullets vs Enemies)
    ctx.globalCompositeOperation = 'lighter'; 
    if(player.beamMode <= 0) { // Only check bullets if not in beam mode
        for(let i = bullets.length-1; i>=0; i--) {
            let b = bullets[i];
            b.y += b.vy;
            
            ctx.shadowBlur = 15;
            ctx.shadowColor = b.color;
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
            ctx.shadowBlur = 0;
            
            if(b.y < -50) { bullets.splice(i,1); continue; }
            
            // Check Hit
            for(let j=enemies.length-1; j>=0; j--) {
                let e = enemies[j];
                if(Math.abs(b.x - e.x) < e.w/2 + b.w/2 && Math.abs(b.y - e.y) < e.h/2 + b.h/2) {
                    bullets.splice(i,1);
                    e.hp--;
                    e.y -= 2; 
                    createExplosion(b.x, b.y, '#fff', 2);
                    
                    if(e.hp <= 0) {
                        AudioSys.playExplosion();
                        vibrate(15);
                        createExplosion(e.x, e.y, '#ffaa00', 10);
                        
                        let collected = false;
                        for(let k=0; k<currentTarget.length; k++) {
                            if(currentTarget[k] === e.letter && !foundLetters[k]) {
                                foundLetters[k] = true;
                                collected = true;
                                const slot = document.getElementById(`word-slot-${k}`);
                                if(slot) {
                                    slot.innerText = e.letter;
                                    slot.classList.add('filled');
                                }
                                score += 100; 
                                floatingTexts.push({x: e.x, y: e.y, text: e.letter, life: 1.0, vy: -2});
                                AudioSys.playCollect();
                                break; 
                            }
                        }
                        if(!collected) score += 10;
                        scoreDisplay.innerText = `PTS: ${score}`;
                        
                        // Spawn Powerup Chance (Low in normal mode)
                        if(Math.random() < 0.05) spawnPowerup(e.x, e.y);

                        enemies.splice(j,1);
                        
                        if(foundLetters.every(x=>x) && !winTimeout && !levelTransitioning) {
                            winTimeout = setTimeout(nextLevel, 1000);
                        }
                    }
                    break;
                }
            }
        }
    }
    
    // Enemies
    ctx.globalCompositeOperation = 'source-over';
    for(let i=enemies.length-1; i>=0; i--) {
        let e = enemies[i];
        e.y += e.vy;
        e.rot += e.rotSpeed;
        
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.rot);
        
        // Check Needed
        let isNeeded = false;
        for(let k=0; k<currentTarget.length; k++) {
            if(currentTarget[k] === e.letter && !foundLetters[k]) isNeeded = true;
        }

        if (asteroidImg.complete && asteroidImg.naturalWidth !== 0) {
            if(isNeeded) {
                ctx.shadowColor = '#00ff00';
                ctx.shadowBlur = 15;
            }
            ctx.drawImage(asteroidImg, -e.w/2, -e.h/2, e.w, e.h);
            ctx.shadowBlur = 0;
        } else {
            ctx.fillStyle = '#444';
            if(isNeeded) {
                ctx.strokeStyle = '#00ff00';
                ctx.lineWidth = 2;
            } else {
                ctx.strokeStyle = '#666';
                ctx.lineWidth = 1;
            }
            ctx.beginPath();
            for(let s=0; s<6; s++) {
                const angle = s * Math.PI/3;
                ctx.lineTo(Math.cos(angle)*e.w/2, Math.sin(angle)*e.h/2);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
        }
        
        // Draw Letter
        ctx.rotate(-e.rot); 
        ctx.fillStyle = isNeeded ? '#00ff00' : '#fff';
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#000';
        ctx.shadowBlur = 4;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.8)';
        ctx.strokeText(e.letter, 0, 0);
        ctx.shadowBlur = 0;
        ctx.fillText(e.letter, 0, 0);
        ctx.restore();
        
        // Player Crash
        if(player.invulnerable === 0) {
            const dx = player.x - e.x;
            const dy = player.y - e.y;
            if(Math.sqrt(dx*dx + dy*dy) < (player.w/2 + e.w/2)) {
                lives--;
                updateLivesUI();
                player.invulnerable = 100; 
                createExplosion(player.x, player.y, '#ff3366', 20);
                AudioSys.playExplosion();
                vibrate(200);
                enemies.splice(i,1);
                
                if(lives <= 0) gameOver(false);
            }
        }
        
        if(e.y > height + 50) enemies.splice(i,1);
    }
    
    // 6. DRAW PLAYER
    if(player.invulnerable % 10 < 5) { 
        ctx.save();
        ctx.translate(player.x, player.y);
        
        ctx.globalCompositeOperation = 'lighter';
        ctx.shadowBlur = 20;
        
        // Change color based on Powerup
        if(player.beamMode > 0) {
            ctx.shadowColor = '#ffff00';
            ctx.fillStyle = '#ffffaa';
        } else {
            ctx.shadowColor = '#00d2ff';
            ctx.fillStyle = '#eee';
        }
        
        ctx.beginPath();
        ctx.moveTo(0, -30);
        ctx.lineTo(20, 20);
        ctx.lineTo(0, 10);
        ctx.lineTo(-20, 20);
        ctx.closePath();
        ctx.fill();
        
        ctx.shadowBlur = 30;
        ctx.shadowColor = '#ff00cc';
        ctx.fillStyle = '#ff00cc';
        ctx.beginPath();
        ctx.moveTo(-10, 20);
        ctx.lineTo(0, 40 + Math.random()*15);
        ctx.lineTo(10, 20);
        ctx.fill();
        
        ctx.restore();
    }
    
    // 7. FLOATING TEXTS & PARTICLES
    ctx.globalCompositeOperation = 'lighter';
    for(let i=floatingTexts.length-1; i>=0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if(ft.life <= 0) { floatingTexts.splice(i,1); continue; }
        
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 30px Arial';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText(ft.text, ft.x, ft.y);
    }
    
    for(let i=particles.length-1; i>=0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        
        if(p.life <= 0) { particles.splice(i,1); continue; }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.shadowBlur = 0;
    
    requestAnimationFrame(loop);
}

document.getElementById('start-btn').addEventListener('click', startGame);
document.getElementById('restart-btn').addEventListener('click', startGame);

</script>
