<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Star Sculptor: Ananya</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050505;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none; /* Prevent browser zooming/scrolling */
        }
        canvas {
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            text-shadow: 0 0 20px #00d2ff;
            margin: 0;
            opacity: 0;
            transition: opacity 2s;
        }
        p {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 10px;
        }
        #start-btn, #restart-btn {
            pointer-events: auto;
            background: linear-gradient(45deg, #ff00cc, #3333ff);
            border: none;
            padding: 15px 40px;
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 204, 0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 20px;
        }
        #start-btn:active, #restart-btn:active {
            transform: scale(0.95);
        }
        /* Top HUD Area */
        .hud-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
        }
        .lives {
            font-size: 1.5rem;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366;
            font-weight: bold;
        }
        .target-word {
            display: flex;
            gap: 10px;
        }
        .letter-slot {
            width: 40px;
            height: 50px;
            border-bottom: 3px solid #00d2ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            color: #00d2ff;
            text-shadow: 0 0 15px #00d2ff;
            background: rgba(0, 210, 255, 0.1);
        }
        .letter-slot.empty {
            color: transparent;
            text-shadow: none;
            background: rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div class="hud-top" id="game-hud" style="display: none;">
    <div class="lives" id="lives-display">❤❤❤❤❤</div>
    <div class="target-word" id="word-display">
        <!-- Will be populated by JS -->
    </div>
    <div style="width: 80px;"></div> <!-- Spacer for centering -->
</div>

<div id="ui-layer">
    <div id="start-screen">
        <h1 style="opacity: 1; font-size: 2.5rem; margin-bottom: 20px;">Operation: Ananya</h1>
        <p>Rocks hold the trapped letters.</p>
        <p>Destroy rocks to free the letters.</p>
        <p>Spell <strong>ANANYA</strong>.</p>
        <p style="color: #ff3366; font-size: 1rem;">Avoid crashing! 5 Lives.</p>
        <button id="start-btn">LAUNCH MISSION</button>
    </div>
    
    <div id="end-screen" style="display: none;">
        <h1 id="end-title">MISSION COMPLETE</h1>
        <p id="end-subtitle">ANANYA FORMED</p>
        <button id="restart-btn">REPLAY</button>
    </div>
</div>

<script>
/**
 * GAME CONFIGURATION & ASSETS
 */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });
const uiLayer = document.getElementById('ui-layer');
const startScreen = document.getElementById('start-screen');
const endScreen = document.getElementById('end-screen');
const startBtn = document.getElementById('start-btn');
const restartBtn = document.getElementById('restart-btn');
const gameHud = document.getElementById('game-hud');
const livesDisplay = document.getElementById('lives-display');
const wordDisplay = document.getElementById('word-display');
const endTitle = document.getElementById('end-title');
const endSubtitle = document.getElementById('end-subtitle');

let width, height;
let particles = [];
let bullets = [];
let enemies = [];
let stars = [];
let floatingTexts = []; // Animations for collected letters

let gameRunning = false;
let frameCount = 0;
let lives = 5;

// Game Logic State
const targetName = "ANANYA";
let foundLetters = []; // Array of booleans, e.g., [true, false, true, ...]

// Player Object
const player = {
    x: 0,
    y: 0,
    w: 40,
    h: 40,
    speed: 15,
    lastShot: 0,
    fireRate: 8,
    color: '#00d2ff',
    invulnerable: 0 // frames
};

// Input state
const input = { x: 0, y: 0, firing: false };

/**
 * RESIZE HANDLING
 */
function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    player.x = width / 2;
    player.y = height - 100;
    input.x = width / 2;
    input.y = height - 100;
    
    // Regenerate stars
    stars = [];
    for(let i=0; i<100; i++) {
        stars.push({
            x: Math.random() * width,
            y: Math.random() * height,
            size: Math.random() * 2,
            speed: Math.random() * 3 + 0.5
        });
    }
}
window.addEventListener('resize', resize);
resize();

/**
 * INPUT HANDLING
 */
function updateInput(e) {
    e.preventDefault();
    let cx, cy;
    if (e.touches) {
        cx = e.touches[0].clientX;
        cy = e.touches[0].clientY;
        input.firing = true;
    } else {
        cx = e.clientX;
        cy = e.clientY;
    }
    input.x = cx;
    input.y = cy - 50;
}

window.addEventListener('mousemove', (e) => {
    updateInput(e);
    input.firing = true;
});
window.addEventListener('touchmove', updateInput, { passive: false });
window.addEventListener('touchstart', updateInput, { passive: false });
window.addEventListener('mousedown', () => input.firing = true);
window.addEventListener('mouseup', () => input.firing = false);

/**
 * HUD & LOGIC HELPERS
 */
function initHUD() {
    wordDisplay.innerHTML = '';
    foundLetters = [];
    for(let i=0; i<targetName.length; i++) {
        foundLetters.push(false);
        const div = document.createElement('div');
        div.className = 'letter-slot empty';
        div.innerText = targetName[i];
        div.id = `slot-${i}`;
        wordDisplay.appendChild(div);
    }
    updateLivesUI();
    gameHud.style.display = 'flex';
}

function updateLivesUI() {
    let hearts = "";
    for(let i=0; i<lives; i++) hearts += "❤";
    livesDisplay.innerText = hearts;
    if(lives <= 2) livesDisplay.style.color = '#ff0000';
    else livesDisplay.style.color = '#ff3366';
}

function updateWordUI(index) {
    const slot = document.getElementById(`slot-${index}`);
    if(slot) {
        slot.className = 'letter-slot'; // Remove 'empty' class
        // visual pop effect
        slot.style.transform = "scale(1.5)";
        setTimeout(() => slot.style.transform = "scale(1)", 200);
    }
}

/**
 * GAME CONTROL
 */

function startGame() {
    startScreen.style.display = 'none';
    endScreen.style.display = 'none';
    gameRunning = true;
    lives = 5;
    frameCount = 0;
    
    enemies = [];
    bullets = [];
    particles = [];
    floatingTexts = [];
    
    initHUD();
    
    requestAnimationFrame(loop);
}

function gameOver(won) {
    gameRunning = false;
    gameHud.style.display = 'none';
    endScreen.style.display = 'flex';
    
    if(won) {
        endTitle.innerText = "MISSION SUCCESS";
        endSubtitle.innerText = "NAME 'ANANYA' FORMED";
        endTitle.style.color = "#00ffcc";
        // Fireworks
        let fwInt = setInterval(() => {
            if(gameRunning) clearInterval(fwInt); // stop if restarted
            createParticles(Math.random()*width, Math.random()*height, '#' + Math.floor(Math.random()*16777215).toString(16), 20);
        }, 500);
    } else {
        endTitle.innerText = "MISSION FAILED";
        endSubtitle.innerText = "OUT OF LIVES";
        endTitle.style.color = "#ff3366";
    }
}

function spawnEnemy() {
    // Weighted random letter generation
    // We want A, N, Y to appear slightly more often if we need them
    const charset = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    let letter = charset[Math.floor(Math.random() * charset.length)];
    
    // 40% chance to force a needed letter
    if (Math.random() < 0.4) {
        const neededIndices = foundLetters.map((val, idx) => val ? -1 : idx).filter(i => i !== -1);
        if (neededIndices.length > 0) {
            const idx = neededIndices[Math.floor(Math.random() * neededIndices.length)];
            letter = targetName[idx];
        }
    }

    const size = 35 + Math.random() * 20;
    enemies.push({
        x: Math.random() * (width - 60) + 30,
        y: -50,
        w: size,
        h: size,
        letter: letter,
        hp: 2, // Takes 2 shots
        angle: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.05,
        vy: Math.random() * 2 + 1.5,
        color: '#777'
    });
}

function spawnBullet() {
    bullets.push({
        x: player.x,
        y: player.y - 20,
        w: 4,
        h: 15,
        vy: -15,
        color: '#ff00cc'
    });
    // Muzzle flash
    createParticles(player.x, player.y - 20, '#fff', 3);
}

function createParticles(x, y, color, count) {
    for(let i=0; i<count; i++) {
        particles.push({
            x: x,
            y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 1.0,
            color: color,
            size: Math.random() * 3 + 1
        });
    }
}

function createFloatingText(x, y, text) {
    floatingTexts.push({
        x: x,
        y: y,
        text: text,
        life: 1.0,
        vy: -2
    });
}

function checkCollision(rect1, rect2) {
    // Simple circle-ish collision for gameplay feel
    const dx = rect1.x - rect2.x;
    const dy = rect1.y - rect2.y;
    const dist = Math.sqrt(dx*dx + dy*dy);
    return dist < (rect1.w/2 + rect2.w/2);
}

/**
 * MAIN LOOP
 */
function loop() {
    if(!gameRunning) return;
    
    // Clear screen
    ctx.fillStyle = 'rgba(5, 5, 10, 0.4)';
    ctx.fillRect(0, 0, width, height);
    
    frameCount++;
    
    // --- UPDATE ---
    
    // Spawning logic
    if (frameCount % 40 === 0) spawnEnemy(); // spawn rate

    // Stars
    ctx.fillStyle = 'white';
    stars.forEach(star => {
        star.y += star.speed;
        if(star.y > height) star.y = 0;
        ctx.globalAlpha = Math.random() * 0.5 + 0.3;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    });

    // Player Movement
    player.x += (input.x - player.x) * 0.15;
    player.y += (input.y - player.y) * 0.15;
    
    // Clamp
    if(player.x < 20) player.x = 20;
    if(player.x > width-20) player.x = width-20;
    if(player.y < 20) player.y = 20;
    if(player.y > height-20) player.y = height-20;

    // Shooting
    if (input.firing && frameCount - player.lastShot > player.fireRate) {
        spawnBullet();
        player.lastShot = frameCount;
    }
    
    // Decrement invulnerability
    if(player.invulnerable > 0) player.invulnerable--;

    // Bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y += b.vy;
        
        ctx.fillStyle = b.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = b.color;
        ctx.fillRect(b.x - b.w/2, b.y, b.w, b.h);
        ctx.shadowBlur = 0;
        
        if (b.y < -50) {
            bullets.splice(i, 1);
            continue;
        }
        
        // Bullet vs Enemy
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (checkCollision({x:b.x, y:b.y, w:b.w, h:b.h}, {x:e.x, y:e.y, w:e.w, h:e.h})) {
                bullets.splice(i, 1); // Remove bullet
                e.hp--;
                
                // Visual impact
                e.y -= 2; 
                createParticles(e.x, e.y + e.h/2, '#fff', 2);

                if (e.hp <= 0) {
                    // Rock Destroyed
                    createParticles(e.x, e.y, '#aaa', 10);
                    createParticles(e.x, e.y, '#ffaa00', 5);
                    
                    // CHECK LETTER LOGIC
                    let neededIndex = -1;
                    // Find first occurrence of this letter that isn't found yet
                    for(let k=0; k<targetName.length; k++) {
                        if(targetName[k] === e.letter && !foundLetters[k]) {
                            neededIndex = k;
                            break;
                        }
                    }

                    if(neededIndex !== -1) {
                        // Success!
                        foundLetters[neededIndex] = true;
                        updateWordUI(neededIndex);
                        createFloatingText(e.x, e.y, e.letter); // Floating letter animation
                        
                        // Check Win
                        if(foundLetters.every(l => l)) {
                            setTimeout(() => gameOver(true), 1000);
                        }
                    } else {
                        // Wrong letter or already collected
                        // Just score points?
                    }
                    
                    enemies.splice(j, 1);
                }
                break;
            }
        }
    }
    
    // Enemies
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.vy;
        e.angle += e.rotSpeed;

        // Draw Rock (Polygon)
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.angle);
        
        ctx.fillStyle = '#444';
        if(targetName.includes(e.letter)) ctx.fillStyle = '#556'; // Hint color
        
        ctx.beginPath();
        const sides = 6;
        for (let s = 0; s < sides; s++) {
            const theta = (s / sides) * 2 * Math.PI;
            const r = e.w / 2 * (0.8 + Math.random() * 0.2); // Jaggedness
            const px = Math.cos(theta) * r;
            const py = Math.sin(theta) * r;
            if (s === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = '#666';
        ctx.stroke();

        // Draw Letter on Rock
        ctx.rotate(-e.angle); // Rotate back so text is readable? Or keep it spinning?
        // Let's rotate back slightly to make it readable but still part of the rock
        // Actually, spinning letters are hard to read. Let's make text upright.
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 20px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowBlur = 5;
        ctx.shadowColor = '#000';
        ctx.fillText(e.letter, 0, 0);
        ctx.shadowBlur = 0;
        
        ctx.restore();
        
        // Player Collision (Crash)
        if (player.invulnerable === 0 && checkCollision(player, e)) {
            player.invulnerable = 60; // 1 second invincibility
            lives--;
            updateLivesUI();
            
            // Explosion
            createParticles(player.x, player.y, '#ff0000', 15);
            createParticles(e.x, e.y, '#aaa', 10);
            enemies.splice(i, 1); // Destroy rock
            
            // Shake screen effect (simulated by random offset next frame?)
            
            if (lives <= 0) {
                gameOver(false);
            }
            continue;
        }

        if (e.y > height + 50) {
            enemies.splice(i, 1);
        }
    }
    
    // Floating Texts (Collected Letters)
    for(let i=floatingTexts.length-1; i>=0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.life -= 0.02;
        if(ft.life <= 0) {
            floatingTexts.splice(i, 1);
            continue;
        }
        ctx.globalAlpha = ft.life;
        ctx.font = 'bold 30px monospace';
        ctx.fillStyle = '#00ffcc';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ffcc';
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1.0;
        ctx.shadowBlur = 0;
    }
    
    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        
        if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
        }
        
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
    }
    
    // Draw Player
    if (Math.floor(Date.now() / 100) % 2 === 0 || player.invulnerable === 0) {
        ctx.save();
        ctx.translate(player.x, player.y);
        
        // Engine flame
        ctx.fillStyle = `rgba(0, 200, 255, ${Math.random()})`;
        ctx.beginPath();
        ctx.moveTo(-8, 15);
        ctx.lineTo(0, 35 + Math.random()*10);
        ctx.lineTo(8, 15);
        ctx.fill();
        
        // Ship body
        ctx.shadowBlur = 15;
        ctx.shadowColor = player.color;
        ctx.fillStyle = '#eee';
        ctx.beginPath();
        ctx.moveTo(0, -25);
        ctx.lineTo(15, 15);
        ctx.lineTo(0, 5);
        ctx.lineTo(-15, 15);
        ctx.closePath();
        ctx.fill();
        ctx.shadowBlur = 0;
        
        ctx.restore();
    }
    
    requestAnimationFrame(loop);
}

// Button Listeners
startBtn.addEventListener('click', startGame);
restartBtn.addEventListener('click', startGame);

</script>
</body>
</html>
