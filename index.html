    body {
      background: linear-gradient(120deg, #ffe0f7 0%, #fffbe6 50%, #e0e7ff 100%);
      overflow-x: hidden;
    }
    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      animation: sparkle 2s infinite linear;
      opacity: 0.7;
    }
    @keyframes sparkle {
      0% { transform: scale(1) translateY(0);}
      50% { transform: scale(1.2) translateY(-15px);}
      100% { transform: scale(1) translateY(0);}
    }
    @keyframes float {
      0% { transform: translateY(0);}
      50% { transform: translateY(-30px);}
      100% { transform: translateY(0);}
    }
    .balloon {
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }
    .balloon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 28px;
      background: linear-gradient(to bottom, #aaa 30%, transparent 100%);
      transform: translateX(-50%);
    }
    .card-animate {
      animation: fadeInUp 1.2s cubic-bezier(.42,0,.58,1) both;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }
    .glow {
      box-shadow: 0 0 18px 4px #f472b6, 0 0 40px 10px #fff2, 0 4px 24px 2px #f0abfc;
    }
    .cake-animate {
      animation: cakePop 1.5s cubic-bezier(.42,0,.58,1) both;
    }
    @keyframes cakePop {
      from { opacity: 0; transform: scale(0.7);}
      70% { transform: scale(1.1);}
      to { opacity: 1; transform: scale(1);}
    }

      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      animation: pulseBadge 1.6s infinite;
    }
    @keyframes pulseBadge {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }

    .game-preview {

      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
