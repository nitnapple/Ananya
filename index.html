<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Ask</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Josefin+Sans:wght@100;300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #070605;
      --cream: #f2ebe0;
      --gold: #c8973a;
      --gold2: #e8b84b;
      --muted: rgba(242,235,224,0.38);
    }

    html, body { width: 100%; height: 100%; overflow: hidden; }

    body {
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Josefin Sans', sans-serif;
      cursor: default;
    }

    /* Grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.045; pointer-events: none; z-index: 200;
    }

    /* Vignette */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse 75% 75% at 50% 50%, transparent 20%, rgba(0,0,0,0.88) 100%);
      pointer-events: none; z-index: 2;
    }

    /* BG canvas (aurora) */
    #bg { position: fixed; inset: 0; z-index: 0; }

    /* Particle canvas */
    #stars { position: fixed; inset: 0; z-index: 1; }

    /* Spotlight */
    #spot {
      position: fixed;
      width: 700px; height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(200,151,58,0.07) 0%, transparent 60%);
      pointer-events: none; z-index: 3;
      transform: translate(-50%,-50%);
      transition: left 0.8s cubic-bezier(0.23,1,0.32,1), top 0.8s cubic-bezier(0.23,1,0.32,1);
      left: 50%; top: 50%;
    }

    /* Orbit rings */
    #orbit-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 4;
    }

    .orbit-ring {
      position: absolute;
      border-radius: 50%;
      border: 0.5px solid rgba(200,151,58,0.08);
    }

    .orbit-ring:nth-child(1) { width: 340px; height: 340px; animation: orbit1 22s linear infinite; }
    .orbit-ring:nth-child(2) { width: 520px; height: 520px; animation: orbit2 35s linear infinite reverse; }
    .orbit-ring:nth-child(3) { width: 720px; height: 720px; animation: orbit1 50s linear infinite; }

    .orbit-dot {
      position: absolute;
      width: 4px; height: 4px;
      border-radius: 50%;
      background: var(--gold);
      top: -2px; left: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 6px 2px rgba(200,151,58,0.4);
    }

    @keyframes orbit1 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes orbit2 { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* Main stage */
    .stage {
      position: relative; z-index: 10;
      text-align: center; padding: 2rem;
      max-width: 920px;
    }

    /* Eyebrow */
    .eyebrow {
      font-weight: 100; font-size: clamp(9px,1.1vw,12px);
      letter-spacing: 0.5em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 2.4rem;
      opacity: 0; animation: riseIn 0.9s ease 0.5s forwards;
    }

    /* Rule */
    .rule {
      display: flex; align-items: center; gap: 1rem;
      justify-content: center; margin-bottom: 2.8rem;
      opacity: 0; animation: riseIn 0.9s ease 0.75s forwards;
    }
    .rule-line {
      height: 0.5px;
      background: linear-gradient(to right, transparent, var(--gold));
      animation: expandLine 1.2s ease 0.9s both;
      width: 0;
    }
    .rule-line:last-child { background: linear-gradient(to left, transparent, var(--gold)); }
    .rule-diamond { width: 5px; height: 5px; background: var(--gold); transform: rotate(45deg); animation: spinIn 0.6s ease 1s both; }

    @keyframes expandLine { from { width: 0; } to { width: 60px; } }
    @keyframes spinIn { from { opacity: 0; transform: rotate(0deg) scale(0); } to { opacity: 1; transform: rotate(45deg) scale(1); } }

    /* Headline */
    .headline {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: clamp(2.8rem, 7vw, 6.5rem);
      line-height: 1.08; color: var(--cream);
      letter-spacing: -0.01em; margin-bottom: 0.25em;
    }

    /* Each word in headline is a span that animates */
    .headline .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(30px) rotateX(20deg);
      animation: wordIn 0.8s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    .headline em { font-style: normal; position: relative; display: inline-block; }

    /* Gold shimmer sweep on "here?" */
    .headline em::after {
      content: attr(data-text);
      position: absolute; inset: 0;
      background: linear-gradient(105deg, transparent 30%, rgba(255,220,120,0.85) 50%, transparent 70%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3.5s ease 2.5s infinite;
    }

    @keyframes wordIn {
      to { opacity: 1; transform: translateY(0) rotateX(0deg); }
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Gold "here?" base color */
    .gold-word {
      color: var(--gold);
      display: inline-block;
    }

    /* Sub text */
    .sub {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1.4rem, 3.2vw, 2.6rem);
      color: var(--muted); line-height: 1.45;
      margin-top: 1.2rem;
    }

    .sub .word {
      display: inline-block;
      opacity: 0;
      transform: translateY(18px);
      animation: wordIn 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
    }

    /* Dash separator */
    .separator {
      display: inline-block;
      opacity: 0;
      animation: riseIn 0.5s ease forwards;
    }

    /* Phone icon wrap */
    .icon-wrap {
      margin: 3rem auto 0;
      width: 54px; height: 54px;
      border: 0.5px solid rgba(200,151,58,0.35);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      opacity: 0; animation: riseIn 0.8s ease 2.2s forwards;
    }

    .icon-wrap .ring {
      position: absolute; border-radius: 50%;
      border: 0.5px solid rgba(200,151,58,0.14);
      animation: ping 3s ease-in-out infinite;
    }

    .icon-wrap .ring:nth-child(1) { inset: -10px; animation-delay: 0s; }
    .icon-wrap .ring:nth-child(2) { inset: -22px; animation-delay: 0.6s; }
    .icon-wrap .ring:nth-child(3) { inset: -36px; animation-delay: 1.2s; }

    @keyframes ping {
      0%   { transform: scale(1); opacity: 0.9; }
      70%  { transform: scale(1.08); opacity: 0.3; }
      100% { transform: scale(1); opacity: 0.9; }
    }

    .phone-icon {
      width: 22px; height: 22px;
      fill: none; stroke: var(--gold);
      stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
      animation: phoneBob 4s ease-in-out 2.5s infinite;
    }

    @keyframes phoneBob {
      0%,100% { transform: rotate(0deg); }
      20%     { transform: rotate(-12deg) scale(1.1); }
      40%     { transform: rotate(8deg); }
      60%     { transform: rotate(-4deg); }
      80%     { transform: rotate(2deg); }
    }

    /* Tagline */
    .tagline {
      margin-top: 3.2rem;
      font-weight: 100; font-size: clamp(9px,1vw,11px);
      letter-spacing: 0.55em; text-transform: uppercase;
      color: rgba(200,151,58,0.45);
      opacity: 0; animation: riseIn 0.8s ease 2.5s forwards;
      animation-fill-mode: forwards;
    }

    /* Scan line sweep */
    #scan {
      position: fixed; left: 0; right: 0;
      height: 1.5px;
      background: linear-gradient(to right, transparent 0%, rgba(200,151,58,0.18) 30%, rgba(232,184,75,0.35) 50%, rgba(200,151,58,0.18) 70%, transparent 100%);
      pointer-events: none; z-index: 150;
      top: -2px;
      animation: scanSweep 8s ease-in-out 3s infinite;
    }

    @keyframes scanSweep {
      0%   { top: -2px; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 0.6; }
      100% { top: 100vh; opacity: 0; }
    }

    /* Parallax layers */
    .layer-back  { will-change: transform; }
    .layer-front { will-change: transform; }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Floating geometric accents */
    .geo {
      position: fixed; pointer-events: none; z-index: 5;
      border: 0.5px solid rgba(200,151,58,0.1);
    }

    .geo1 {
      width: 80px; height: 80px;
      top: 12%; left: 8%;
      animation: floatGeo 14s ease-in-out infinite;
      transform: rotate(20deg);
    }

    .geo2 {
      width: 50px; height: 50px;
      bottom: 15%; right: 10%;
      animation: floatGeo 18s ease-in-out 2s infinite reverse;
      border-radius: 2px;
      transform: rotate(45deg);
    }

    .geo3 {
      width: 110px; height: 110px;
      top: 55%; left: 5%;
      border-radius: 50%;
      animation: floatGeo 22s ease-in-out 5s infinite;
      opacity: 0.5;
    }

    .geo4 {
      width: 65px; height: 65px;
      top: 20%; right: 7%;
      animation: floatGeo 16s ease-in-out 3s infinite reverse;
      transform: rotate(-15deg);
    }

    @keyframes floatGeo {
      0%,100% { transform: translateY(0) rotate(var(--r, 20deg)); }
      33%     { transform: translateY(-18px) rotate(calc(var(--r, 20deg) + 8deg)); }
      66%     { transform: translateY(10px) rotate(calc(var(--r, 20deg) - 5deg)); }
    }
  </style>
</head>
<body>

  <!-- Background aurora canvas -->
  <canvas id="bg"></canvas>

  <!-- Stars/particle canvas -->
  <canvas id="stars"></canvas>

  <!-- Mouse spotlight -->
  <div id="spot"></div>

  <!-- Orbit rings -->
  <div id="orbit-wrap">
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
    <div class="orbit-ring"><div class="orbit-dot"></div></div>
  </div>

  <!-- Floating geometric shapes -->
  <div class="geo geo1" style="--r:20deg"></div>
  <div class="geo geo2" style="--r:45deg"></div>
  <div class="geo geo3" style="--r:0deg"></div>
  <div class="geo geo4" style="--r:-15deg"></div>

  <!-- Scan line -->
  <div id="scan"></div>

  <main class="stage" id="stage">
    <p class="eyebrow">You already have what you need</p>

    <div class="rule">
      <span class="rule-line"></span>
      <span class="rule-diamond"></span>
      <span class="rule-line"></span>
    </div>

    <h1 class="headline" id="headline">
      What are you<br />
      looking for <em class="gold-word" data-text="here?">here?</em>
    </h1>

    <p class="sub" id="sub">
      You have the contact number —<br />
      just ask me what you want.
    </p>

    <div class="icon-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <svg class="phone-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
    </div>

    <p class="tagline">Reach out · Don't browse</p>
  </main>

  <script>
    /* ── AURORA BACKGROUND ─────────────────────────────── */
    const bgC = document.getElementById('bg');
    const bgX = bgC.getContext('2d');
    bgC.width = window.innerWidth; bgC.height = window.innerHeight;

    const blobs = [
      { x: 0.25, y: 0.35, r: 0.38, hue: 38,  sat: 70, t: 0,    spd: 0.0004 },
      { x: 0.70, y: 0.60, r: 0.30, hue: 30,  sat: 55, t: 2,    spd: 0.0003 },
      { x: 0.50, y: 0.80, r: 0.25, hue: 50,  sat: 60, t: 4,    spd: 0.00045 },
      { x: 0.15, y: 0.70, r: 0.20, hue: 28,  sat: 50, t: 1,    spd: 0.00035 },
      { x: 0.80, y: 0.25, r: 0.22, hue: 42,  sat: 65, t: 3,    spd: 0.0005 },
    ];

    function drawAurora(ts) {
      bgX.clearRect(0, 0, bgC.width, bgC.height);
      blobs.forEach(b => {
        b.t += b.spd * 16;
        const bx = (b.x + Math.sin(b.t) * 0.12) * bgC.width;
        const by = (b.y + Math.cos(b.t * 0.8) * 0.10) * bgC.height;
        const r  = b.r * Math.min(bgC.width, bgC.height);
        const g  = bgX.createRadialGradient(bx, by, 0, bx, by, r);
        const alpha = 0.06 + 0.025 * Math.sin(b.t * 1.3);
        g.addColorStop(0, `hsla(${b.hue}, ${b.sat}%, 40%, ${alpha})`);
        g.addColorStop(1, `hsla(${b.hue}, ${b.sat}%, 20%, 0)`);
        bgX.fillStyle = g;
        bgX.beginPath();
        bgX.arc(bx, by, r, 0, Math.PI * 2);
        bgX.fill();
      });
      requestAnimationFrame(drawAurora);
    }
    requestAnimationFrame(drawAurora);

    /* ── CONSTELLATION PARTICLES ───────────────────────── */
    const sc = document.getElementById('stars');
    const sx = sc.getContext('2d');

    function resizeCanvases() {
      bgC.width  = sc.width  = window.innerWidth;
      bgC.height = sc.height = window.innerHeight;
    }
    resizeCanvases();
    window.addEventListener('resize', resizeCanvases);

    const GOLD_C  = [200, 151, 58];
    const CREAM_C = [242, 235, 224];
    const N = 80;

    const pts = Array.from({ length: N }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.4 + 0.3,
      vx: (Math.random() - 0.5) * 0.22,
      vy: (Math.random() - 0.5) * 0.22,
      a: Math.random() * 0.5 + 0.1,
      tw: Math.random() * Math.PI * 2,
      ts: Math.random() * 0.018 + 0.004,
      col: Math.random() > 0.45 ? GOLD_C : CREAM_C,
    }));

    const LINK_DIST = 100;

    function drawStars() {
      sx.clearRect(0, 0, sc.width, sc.height);

      // Connection lines
      for (let i = 0; i < N; i++) {
        for (let j = i + 1; j < N; j++) {
          const dx = pts[i].x - pts[j].x;
          const dy = pts[i].y - pts[j].y;
          const d  = Math.sqrt(dx * dx + dy * dy);
          if (d < LINK_DIST) {
            const a = (1 - d / LINK_DIST) * 0.07;
            sx.beginPath();
            sx.moveTo(pts[i].x, pts[i].y);
            sx.lineTo(pts[j].x, pts[j].y);
            sx.strokeStyle = `rgba(200,151,58,${a})`;
            sx.lineWidth = 0.5;
            sx.stroke();
          }
        }
      }

      // Dots
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        p.tw += p.ts;
        if (p.x < -5) p.x = sc.width + 5;
        if (p.x > sc.width + 5) p.x = -5;
        if (p.y < -5) p.y = sc.height + 5;
        if (p.y > sc.height + 5) p.y = -5;
        const a = p.a * (0.55 + 0.45 * Math.sin(p.tw));
        const [r, g, b] = p.col;
        sx.beginPath();
        sx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        sx.fillStyle = `rgba(${r},${g},${b},${a})`;
        sx.fill();
      });
      requestAnimationFrame(drawStars);
    }
    drawStars();

    /* ── MOUSE PARALLAX + SPOTLIGHT ────────────────────── */
    const spot  = document.getElementById('spot');
    const stage = document.getElementById('stage');
    let mx = window.innerWidth / 2, my = window.innerHeight / 2;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      spot.style.left = mx + 'px';
      spot.style.top  = my + 'px';

      // Subtle parallax on stage
      const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
      const dx = (mx - cx) / cx;
      const dy = (my - cy) / cy;
      stage.style.transform = `translate(${dx * -8}px, ${dy * -6}px)`;
    });

    /* ── WORD-BY-WORD STAGGER REVEAL ───────────────────── */
    function wrapWords(el, baseDelay, delayStep) {
      // Collect text nodes and br elements
      const nodes = Array.from(el.childNodes);
      el.innerHTML = '';

      nodes.forEach(node => {
        if (node.nodeType === Node.TEXT_NODE) {
          node.textContent.split(' ').filter(w => w).forEach((word, i) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = word;
            span.style.animationDelay = (baseDelay + delayStep * i) + 's';
            el.appendChild(span);
            el.appendChild(document.createTextNode(' '));
          });
        } else if (node.nodeName === 'BR') {
          el.appendChild(document.createElement('br'));
        } else if (node.nodeName === 'EM') {
          // preserve the <em> with its class and data-text
          const em = document.createElement('em');
          em.className = node.className;
          em.setAttribute('data-text', node.getAttribute('data-text'));
          // wrap inner text
          node.textContent.split(' ').filter(w => w).forEach((word, i) => {
            const span = document.createElement('span');
            span.className = 'word';
            span.textContent = word;
            span.style.animationDelay = (baseDelay + delayStep * i) + 's';
            em.appendChild(span);
          });
          el.appendChild(em);
          el.appendChild(document.createTextNode(' '));
        }
      });
    }

    // Animate headline words starting at 1.0s, 0.12s apart
    wrapWords(document.getElementById('headline'), 1.0, 0.13);

    // Animate sub words starting at 1.8s, 0.08s apart
    wrapWords(document.getElementById('sub'), 1.75, 0.08);
  </script>
</body>
</html>
