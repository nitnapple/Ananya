<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smash the Ants: Neon Swarm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Roboto:wght@400;700&display=swap');

        body {
            font-family: 'Roboto', sans-serif;
            overflow: hidden; /* Prevent scrolling */
            touch-action: none; /* Prevent browser gestures */
            user-select: none;
            -webkit-user-select: none;
            background-color: #050505;
            /* Subtle dark grid pattern */
            background-image: linear-gradient(#1a1a1a 1px, transparent 1px), linear-gradient(90deg, #1a1a1a 1px, transparent 1px);
            background-size: 50px 50px;
        }

        .game-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 1px;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none; /* Let clicks pass through to canvas unless on a button */
        }

        .pointer-events-auto {
            pointer-events: auto;
        }

        /* Animations */
        .shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        
        .pulse-text {
            animation: pulse-scale 0.5s ease-in-out;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        @keyframes pulse-scale {
            0% { transform: scale(1); }
            50% { transform: scale(1.5); color: #ff0000; text-shadow: 0 0 20px #ff0000; }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body class="w-full h-screen relative">

    <!-- Canvas for Game Rendering -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="flex flex-col justify-between p-4">
        
        <!-- Top HUD -->
        <div class="flex justify-between items-start w-full pointer-events-none">
            <!-- Score Board -->
            <div class="bg-slate-900/80 backdrop-blur-sm border-2 border-slate-700 rounded-xl p-3 shadow-[0_0_15px_rgba(255,255,255,0.1)] min-w-[100px]">
                <p class="text-sm text-slate-400 font-bold uppercase tracking-wider">Score</p>
                <p id="scoreDisplay" class="text-5xl game-font text-white leading-none drop-shadow-[0_0_5px_rgba(255,255,255,0.5)]">0</p>
            </div>
            
            <!-- Warning Label for Ramp Up -->
            <div id="swarmWarning" class="hidden text-red-500 font-black text-2xl game-font animate-bounce bg-black/80 px-4 py-1 rounded-full border border-red-500 absolute left-1/2 transform -translate-x-1/2 top-20 sm:top-4 whitespace-nowrap shadow-[0_0_20px_#ef4444]">
                SWARM INCOMING!
            </div>

            <!-- Right Side Controls -->
            <div class="flex gap-2 pointer-events-auto">
                <!-- Lives Board -->
                <div class="bg-slate-900/80 backdrop-blur-sm border-2 border-slate-700 rounded-xl p-3 shadow-[0_0_15px_rgba(255,255,255,0.1)] flex flex-col items-center pointer-events-none">
                    <p class="text-xs text-slate-400 font-bold uppercase tracking-wider mb-1">Lives</p>
                    <div id="heartsDisplay" class="flex space-x-1 text-3xl">
                        <span>❤️</span><span>❤️</span><span>❤️</span>
                    </div>
                </div>

                <!-- Pause Button -->
                <button id="pauseBtn" class="bg-yellow-500 hover:bg-yellow-400 border-2 border-yellow-700 rounded-xl px-4 shadow-[0_0_10px_#eab308] text-2xl flex items-center justify-center transition-transform active:scale-95">
                    ⏸️
                </button>
            </div>
        </div>

        <!-- Pause Screen -->
        <div id="pauseScreen" class="hidden absolute inset-0 flex items-center justify-center bg-black/60 backdrop-blur-sm pointer-events-auto z-40">
            <div class="bg-slate-900 rounded-3xl p-8 shadow-[0_0_50px_rgba(255,255,255,0.1)] border-4 border-slate-700 text-center transform scale-100">
                <h2 class="text-6xl game-font text-white mb-6 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">PAUSED</h2>
                <button id="resumeBtn" class="bg-green-600 hover:bg-green-500 text-white text-3xl game-font py-3 px-10 rounded-xl border-b-4 border-green-800 active:border-b-0 active:translate-y-1 transition-all shadow-[0_0_15px_#16a34a]">
                    RESUME
                </button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="startScreen" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-sm pointer-events-auto z-50">
            <div class="bg-slate-900 rounded-3xl p-6 max-w-sm w-full mx-4 shadow-[0_0_40px_rgba(239,68,68,0.2)] border-4 border-slate-700 text-center relative overflow-hidden transform transition-all">
                <div class="absolute top-0 left-0 w-full h-4 bg-red-600 box-shadow-[0_0_20px_#dc2626]"></div>
                
                <h1 class="text-6xl game-font text-red-500 mb-1 mt-4 drop-shadow-[0_0_10px_#ef4444]">Smash<br><span class="text-white text-5xl">The Ants</span></h1>
                
                <div class="my-4 space-y-3 text-left bg-black/50 p-4 rounded-xl border border-slate-700">
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-red-600 border-2 border-red-400 shadow-[0_0_10px_#ef4444] flex-shrink-0"></div>
                        <div>
                            <p class="font-bold text-slate-200 leading-tight">Smash Red Ants</p>
                            <p class="text-xs text-green-400 font-bold">+ Points</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-3">
                        <div class="w-8 h-8 rounded-full bg-slate-800 border-2 border-slate-500 shadow-[0_0_10px_#64748b] flex-shrink-0"></div>
                        <div>
                            <p class="font-bold text-slate-200 leading-tight">Avoid Black Ants</p>
                            <p class="text-xs text-red-400 font-bold">-1 Life (3 Max)</p>
                        </div>
                    </div>
                    <div class="bg-red-900/30 p-2 rounded border border-red-900/50 mt-2">
                        <p class="text-xs text-red-400 font-bold text-center">⚠️ WARNING: Ant numbers increase 40% every 2 seconds!</p>
                    </div>
                </div>

                <button id="startBtn" class="w-full bg-green-600 hover:bg-green-500 text-white text-3xl game-font py-4 rounded-xl border-b-4 border-green-800 active:border-b-0 active:translate-y-1 transition-all shadow-[0_0_20px_#16a34a] animate-pulse">
                    START SWARM
                </button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameOverScreen" class="hidden absolute inset-0 flex items-center justify-center bg-black/90 backdrop-blur-md pointer-events-auto z-50">
            <div class="bg-slate-900 rounded-3xl p-8 max-w-sm w-full mx-4 shadow-[0_0_50px_rgba(239,68,68,0.2)] border-4 border-slate-700 text-center relative">
                <h2 id="gameOverTitle" class="text-6xl game-font text-white mb-2 drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">GAME OVER</h2>
                <p id="gameOverReason" class="text-red-500 font-bold text-lg mb-6 leading-tight drop-shadow-[0_0_5px_#ef4444]">You smashed 3 Black Ants!</p>
                
                <div class="bg-slate-800 border-2 border-slate-600 rounded-xl p-4 mb-6">
                    <p class="text-slate-400 uppercase text-xs font-bold tracking-widest">Final Score</p>
                    <p id="finalScore" class="text-7xl game-font text-white drop-shadow-[0_0_10px_rgba(255,255,255,0.5)]">0</p>
                </div>

                <button id="restartBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white text-3xl game-font py-4 rounded-xl border-b-4 border-blue-800 active:border-b-0 active:translate-y-1 transition-all shadow-[0_0_20px_#2563eb]">
                    RETRY
                </button>
            </div>
        </div>
    </div>

    <script>
        // --- Game Setup ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const ui = {
            score: document.getElementById('scoreDisplay'),
            hearts: document.getElementById('heartsDisplay'),
            startScreen: document.getElementById('startScreen'),
            gameOverScreen: document.getElementById('gameOverScreen'),
            gameOverReason: document.getElementById('gameOverReason'),
            finalScore: document.getElementById('finalScore'),
            startBtn: document.getElementById('startBtn'),
            restartBtn: document.getElementById('restartBtn'),
            pauseBtn: document.getElementById('pauseBtn'),
            resumeBtn: document.getElementById('resumeBtn'),
            pauseScreen: document.getElementById('pauseScreen'),
            swarmWarning: document.getElementById('swarmWarning')
        };

        // --- Audio Context ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'splat') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300 + Math.random()*100, now); // Varied pitch
                osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'wrong') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.linearRampToValueAtTime(50, now + 0.5);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        }

        // --- Game State ---
        let gameState = {
            isPlaying: false,
            isPaused: false,
            score: 0,
            lives: 3,
            lastSpawn: 0,
            lastRampUp: 0,
            pauseStartTime: 0, // Track when we paused
            spawnInterval: 1500,
            baseSpeed: 2.5,
            entities: [],
            particles: []
        };

        let animationFrameId;

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // --- Game Objects ---
        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.size = Math.random() * 4 + 2;
                this.speedX = (Math.random() - 0.5) * 8;
                this.speedY = (Math.random() - 0.5) * 8;
                this.life = 1.0;
                this.decay = Math.random() * 0.05 + 0.02;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.life -= this.decay; this.size *= 0.9;
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.life);
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            }
        }

        class Splat {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                this.scale = 0; this.maxScale = 1 + Math.random() * 0.4;
                this.alpha = 0.8; this.rotation = Math.random() * Math.PI * 2;
                this.type = 'splat';
            }
            update() {
                if (this.scale < this.maxScale) this.scale += 0.2;
                else this.alpha -= 0.005; 
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.rotation);
                ctx.scale(this.scale, this.scale); ctx.globalAlpha = this.alpha;
                // Splats don't glow too much to keep background clean, or maybe faint glow
                ctx.shadowBlur = 5;
                ctx.shadowColor = this.color;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -10); ctx.bezierCurveTo(10, -15, 20, -5, 10, 5);
                ctx.bezierCurveTo(20, 15, 5, 20, 0, 10); ctx.bezierCurveTo(-10, 20, -20, 10, -10, 5);
                ctx.bezierCurveTo(-20, -5, -10, -15, 0, -10); ctx.fill();
                ctx.restore();
            }
        }

        class Ant {
            constructor() {
                const edge = Math.floor(Math.random() * 4); 
                const padding = 60;
                if (edge === 0) { this.x = Math.random() * canvas.width; this.y = -padding; }
                else if (edge === 1) { this.x = canvas.width + padding; this.y = Math.random() * canvas.height; }
                else if (edge === 2) { this.x = Math.random() * canvas.width; this.y = canvas.height + padding; }
                else { this.x = -padding; this.y = Math.random() * canvas.height; }

                let targetX, targetY;
                if (edge === 0) { targetX = Math.random() * canvas.width; targetY = canvas.height + padding; }
                else if (edge === 1) { targetX = -padding; targetY = Math.random() * canvas.height; }
                else if (edge === 2) { targetX = Math.random() * canvas.width; targetY = -padding; }
                else { targetX = canvas.width + padding; targetY = Math.random() * canvas.height; }

                this.type = Math.random() < 0.25 ? 'black' : 'red'; 

                // Slightly randomize speed
                const speedVar = Math.random() * 2;
                const speed = gameState.baseSpeed + speedVar;
                
                const angle = Math.atan2(targetY - this.y, targetX - this.x);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.angle = angle;
                
                this.legAngle = 0;
                this.legSpeed = 0.3 + (speed * 0.1);
                this.radius = 30; 
                this.dead = false;
                this.escaped = false;
            }

            update() {
                if (this.dead || this.escaped) return;
                this.x += this.vx; this.y += this.vy;
                this.legAngle += this.legSpeed;
                const margin = 100;
                if (this.x < -margin || this.x > canvas.width + margin || 
                    this.y < -margin || this.y > canvas.height + margin) {
                    this.escaped = true;
                }
            }

            draw(ctx) {
                if (this.dead) return;
                ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.angle + Math.PI / 2);
                
                // Bright Neon Colors
                // Red Ant: Bright Red. Black Ant: Very dark grey with white rim light/glow
                const color = this.type === 'red' ? '#ff3333' : '#1f2937'; 
                const glowColor = this.type === 'red' ? '#ff0000' : '#ffffff'; // White glow for black ants to see them

                // Enable Glow
                ctx.shadowBlur = 20;
                ctx.shadowColor = glowColor;

                // Legs
                ctx.strokeStyle = this.type === 'red' ? '#880000' : '#4b5563'; 
                ctx.lineWidth = 2;
                const offset = Math.sin(this.legAngle) * 6;
                for(let i=-1; i<=1; i++) {
                    let yPos = i * 6;
                    ctx.beginPath();
                    ctx.moveTo(-5, yPos); ctx.lineTo(-20 - (i%2==0 ? offset : -offset), yPos - 5); ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(5, yPos); ctx.lineTo(20 + (i%2==0 ? offset : -offset), yPos - 5); ctx.stroke();
                }

                // Body
                ctx.fillStyle = color;
                ctx.beginPath(); ctx.ellipse(0, 15, 12, 16, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.ellipse(0, 0, 8, 10, 0, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(0, -12, 10, 0, Math.PI*2); ctx.fill();
                
                // Eyes (Glowing)
                ctx.fillStyle = '#ffffff';
                ctx.shadowBlur = 5;
                ctx.shadowColor = '#ffffff';
                ctx.beginPath(); ctx.arc(-4, -15, 3, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -15, 3, 0, Math.PI*2); ctx.fill();
                ctx.restore();
            }
        }

        // --- Logic ---
        function initGame() {
            gameState.isPlaying = true;
            gameState.isPaused = false;
            gameState.score = 0;
            gameState.lives = 3;
            gameState.spawnInterval = 1500; 
            gameState.baseSpeed = 2.5;
            gameState.entities = [];
            gameState.particles = [];
            
            const now = performance.now();
            gameState.lastSpawn = now;
            gameState.lastRampUp = now;

            ui.score.innerText = '0';
            updateHearts();
            ui.startScreen.classList.add('hidden');
            ui.gameOverScreen.classList.add('hidden');
            ui.swarmWarning.classList.add('hidden');
            ui.pauseScreen.classList.add('hidden');

            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            gameLoop(now);
        }

        function togglePause() {
            if (!gameState.isPlaying || gameState.lives <= 0) return;

            gameState.isPaused = !gameState.isPaused;

            if (gameState.isPaused) {
                // Game Just Paused
                gameState.pauseStartTime = performance.now();
                ui.pauseScreen.classList.remove('hidden');
            } else {
                // Game Resumed
                const now = performance.now();
                const pauseDuration = now - gameState.pauseStartTime;
                
                // Shift timers forward so we don't think 10 minutes passed
                gameState.lastSpawn += pauseDuration;
                gameState.lastRampUp += pauseDuration;
                
                ui.pauseScreen.classList.add('hidden');
            }
        }

        function updateHearts() {
            let html = '';
            for(let i=0; i<gameState.lives; i++) html += '❤️';
            for(let i=gameState.lives; i<3; i++) html += '🖤';
            ui.hearts.innerHTML = html;
        }

        function triggerVibration(pattern) {
            if (navigator.vibrate) navigator.vibrate(pattern);
        }

        function handleSmash(ant) {
            ant.dead = true;
            if (ant.type === 'black') {
                gameState.lives--;
                updateHearts();
                playSound('wrong');
                triggerVibration([200, 50, 200]); // Long buzz for error
                gameState.entities.push(new Splat(ant.x, ant.y, '#333')); // Darker splat
                document.body.classList.add('shake');
                setTimeout(()=>document.body.classList.remove('shake'), 500);
                if (gameState.lives <= 0) gameOver("You smashed 3 Black Ants!");
            } else {
                gameState.score += 10;
                ui.score.innerText = gameState.score;
                ui.score.classList.remove('pulse-text');
                void ui.score.offsetWidth; // trigger reflow
                ui.score.classList.add('pulse-text');
                
                playSound('splat');
                triggerVibration(40); // Short buzz for success
                
                gameState.entities.push(new Splat(ant.x, ant.y, '#b91c1c'));
                for(let i=0; i<8; i++) gameState.particles.push(new Particle(ant.x, ant.y, '#ff0000'));
            }
        }

        function gameOver(msg) {
            gameState.isPlaying = false;
            ui.gameOverReason.innerText = msg;
            ui.finalScore.innerText = gameState.score;
            ui.gameOverScreen.classList.remove('hidden');
            ui.swarmWarning.classList.add('hidden');
            ui.pauseScreen.classList.add('hidden'); // Ensure pause screen is hidden on game over
        }

        function gameLoop(timestamp) {
            animationFrameId = requestAnimationFrame(gameLoop);

            if (!gameState.isPlaying) return;

            // PAUSE LOGIC
            if (gameState.isPaused) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // --- DIFFICULTY RAMP UP (Every 2 Seconds) ---
            if (timestamp - gameState.lastRampUp > 2000) {
                // Increase number of ants by 40% = Reduce interval by ~1.4
                gameState.spawnInterval = Math.max(80, gameState.spawnInterval / 1.4); 
                gameState.lastRampUp = timestamp;
                
                // Show warning when it gets crazy
                if (gameState.spawnInterval < 400 && ui.swarmWarning.classList.contains('hidden')) {
                    ui.swarmWarning.classList.remove('hidden');
                }
            }

            // Spawning
            if (timestamp - gameState.lastSpawn > gameState.spawnInterval) {
                gameState.entities.push(new Ant());
                gameState.lastSpawn = timestamp;
            }

            // Draw Entities
            // Layer 1: Splats
            gameState.entities.forEach(e => { if (e.type === 'splat') { e.update(); e.draw(ctx); } });
            // Layer 2: Ants
            gameState.entities.forEach(e => { if (e instanceof Ant) { e.update(); e.draw(ctx); } });
            // Layer 3: Particles
            gameState.particles.forEach(p => { p.update(); p.draw(ctx); });
            
            // Cleanup
            gameState.entities = gameState.entities.filter(e => {
                if (e instanceof Ant) return !e.dead && !e.escaped;
                if (e.type === 'splat') return e.alpha > 0;
                return true;
            });
            gameState.particles = gameState.particles.filter(p => p.life > 0);
        }

        // --- Inputs ---
        function checkHit(x, y) {
            for (let i = gameState.entities.length - 1; i >= 0; i--) {
                const e = gameState.entities[i];
                if (e instanceof Ant && !e.dead) {
                    const dx = x - e.x;
                    const dy = y - e.y;
                    if (Math.sqrt(dx*dx + dy*dy) < e.radius + 15) {
                        handleSmash(e);
                        return true; 
                    }
                }
            }
            return false;
        }

        canvas.addEventListener('mousedown', e => { 
            if(gameState.isPlaying && !gameState.isPaused) checkHit(e.clientX, e.clientY); 
        });
        
        canvas.addEventListener('touchstart', e => {
            if (!gameState.isPlaying || gameState.isPaused) return;
            e.preventDefault(); 
            for (let i = 0; i < e.changedTouches.length; i++) {
                checkHit(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
            }
        }, { passive: false });

        ui.startBtn.addEventListener('click', initGame);
        ui.restartBtn.addEventListener('click', initGame);
        ui.pauseBtn.addEventListener('click', togglePause);
        ui.resumeBtn.addEventListener('click', togglePause);
    </script>
</body>
</html>
