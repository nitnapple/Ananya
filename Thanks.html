<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Royal IAS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cinzel for Royal headings, Playfair for elegance -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #050505;
            color: white;
            font-family: 'Playfair Display', serif;
            overflow: hidden;
            perspective: 1000px;
        }

        /* Royal Animated Background */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #000000, #1a0524, #240505, #0a0a0a);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Gold Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 215, 0, 0.3); /* Gold tint */
            box-shadow: 0 0 5px rgba(255, 215, 0, 0.3);
            animation: float 20s infinite linear;
            z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) translateX(50px); opacity: 0; }
        }

        /* 3D Card Container */
        .scene {
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            width: 100%;
            max-width: 420px;
            /* Changed from fixed aspect ratio to min-height to prevent text clipping */
            min-height: 600px; 
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
            transition: transform 0.1s ease-out;
            will-change: transform;
            cursor: pointer;
        }

        /* Royal Glass Card Body */
        .card-face {
            position: absolute;
            inset: 0;
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 12px;
            /* Gold Border */
            border: 2px solid rgba(255, 215, 0, 0.4); 
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.8),
                inset 0 0 30px rgba(0, 0, 0, 0.8),
                0 0 0 1px rgba(255, 215, 0, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.5rem;
            transform-style: preserve-3d;
            /* Removed overflow:hidden to allow text to breathe if needed, though sizing fits now */
        }

        /* Ornate Corner borders */
        .corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(255, 215, 0, 0.8);
            transition: all 0.3s ease;
        }
        .tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
        .tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
        .bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
        .br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

        .card:hover .corner {
            width: 50px;
            height: 50px;
        }

        /* 3D Depth Elements */
        .card-content {
            transform: translateZ(50px);
            z-index: 10;
            width: 100%;
        }

        /* Typography */
        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
            font-size: clamp(2rem, 5vw, 3rem); /* Responsive font size */
            line-height: 1.3;
            margin-bottom: 1.5rem;
            /* Metallic Gold Gradient */
            background: linear-gradient(to bottom, #cfc09f 0%, #ffecb3 40%, #b3a070 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }

        .subtitle {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: clamp(1rem, 3vw, 1.25rem);
            color: #e2e8f0;
            opacity: 0.9;
            display: block;
            margin-top: 0.5rem;
            letter-spacing: 1px;
            font-weight: 400;
        }

        p.ias-text {
            font-family: 'Cinzel', serif;
            font-weight: 400;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: #e2e8f0;
            margin-top: 2rem;
            text-transform: uppercase;
        }

        .highlight-ias {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: 3rem;
            display: block;
            margin-top: 0.5rem;
            background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.3);
            animation: shimmer 3s infinite linear;
            background-size: 200%;
        }

        @keyframes shimmer {
            0% {background-position: 0% 50%;}
            100% {background-position: 200% 50%;}
        }

        /* Shine Effect */
        .shine {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(
                circle at var(--mouse-x) var(--mouse-y), 
                rgba(255, 236, 179, 0.15) 0%, 
                transparent 50%
            );
            border-radius: 12px;
            pointer-events: none;
            mix-blend-mode: soft-light;
            transform: translateZ(1px);
        }

        /* Crown/Emblem */
        .emblem {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            color: #fbbf24;
            transform: translateZ(40px);
            filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.4));
        }

        .divider {
            height: 2px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #ffd700, transparent);
            margin: 20px auto;
            transform: translateZ(30px);
        }

        @media (max-width: 640px) {
            .card { min-height: 500px; padding: 0 10px; }
            .card-face { padding: 1.5rem; }
            .highlight-ias { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <div class="bg-gradient-animate"></div>
    <div id="particles"></div>

    <div class="scene">
        <div class="card" id="tiltCard">
            <div class="card-face">
                <div class="shine"></div>
                
                <!-- Ornate Corners -->
                <div class="corner tl"></div>
                <div class="corner tr"></div>
                <div class="corner bl"></div>
                <div class="corner br"></div>

                <div class="card-content">
                    <div class="emblem">
                        ♔
                    </div>
                    
                    <h1>
                        Thank You
                        <span class="subtitle">for your Existence</span>
                    </h1>
                    
                    <div class="divider"></div>

                    <p class="ias-text">
                        Which makes me
                        <span class="highlight-ias">IAS</span>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Particle Generation
        const particleContainer = document.getElementById('particles');
        for (let i = 0; i < 40; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            const size = Math.random() * 3;
            p.style.width = size + 'px';
            p.style.height = size + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.top = Math.random() * 100 + 'vh';
            p.style.animationDuration = (Math.random() * 20 + 10) + 's';
            p.style.animationDelay = (Math.random() * 10) + 's';
            particleContainer.appendChild(p);
        }

        // 3D Tilt Logic
        const card = document.getElementById('tiltCard');
        const scene = document.querySelector('.scene');
        
        let bounds;
        
        function rotateToMouse(e) {
            bounds = card.getBoundingClientRect();
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;

            const leftX = clientX - bounds.x;
            const topY = clientY - bounds.y;
            
            const center = {
                x: leftX - bounds.width / 2,
                y: topY - bounds.height / 2
            }
            
            // Smoother rotation
            const rotateX = ((center.y / bounds.height) * -20).toFixed(2); 
            const rotateY = ((center.x / bounds.width) * 20).toFixed(2);

            card.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale3d(1.02, 1.02, 1.02)
            `;

            const shineX = (leftX / bounds.width) * 100;
            const shineY = (topY / bounds.height) * 100;

            card.style.setProperty('--mouse-x', `${shineX}%`);
            card.style.setProperty('--mouse-y', `${shineY}%`);
        }

        function stopRotate() {
            card.style.transform = `
                rotateX(0deg) 
                rotateY(0deg)
                scale3d(1, 1, 1)
            `;
        }

        scene.addEventListener('mousemove', rotateToMouse);
        scene.addEventListener('mouseleave', stopRotate);

        scene.addEventListener('touchmove', (e) => {
            e.preventDefault(); 
            rotateToMouse(e);
        }, { passive: false });
        
        scene.addEventListener('touchend', stopRotate);

        // Gentle auto-sway
        let autoAnimate = true;
        scene.addEventListener('mouseenter', () => autoAnimate = false);
        scene.addEventListener('touchstart', () => autoAnimate = false);

        let t = 0;
        function idleAnimation() {
            if (autoAnimate) {
                t += 0.015;
                const rotateX = Math.sin(t) * 3;
                const rotateY = Math.cos(t) * 3;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
            }
            requestAnimationFrame(idleAnimation);
        }
        idleAnimation();

    </script>
</body>
</html>
