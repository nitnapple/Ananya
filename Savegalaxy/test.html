<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday, Ananya!</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/nitnapple/src/refs/heads/main/cake.ico">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background: linear-gradient(120deg, #ffe0f7 0%, #fffbe6 50%, #e0e7ff 100%);
      overflow-x: hidden;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      animation: sparkle 2s infinite linear;
      opacity: 0.7;
    }

    @keyframes sparkle {
      0% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.2) translateY(-15px); }
      100% { transform: scale(1) translateY(0); }
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-30px); }
      100% { transform: translateY(0); }
    }

    .balloon {
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    .balloon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 28px;
      background: linear-gradient(to bottom, #aaa 30%, transparent 100%);
      transform: translateX(-50%);
    }

    .card-animate {
      animation: fadeInUp 1.2s cubic-bezier(.42,0,.58,1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .glow {
      box-shadow: 0 0 18px 4px #f472b6, 0 0 40px 10px #fff2, 0 4px 24px 2px #f0abfc;
    }

    .cake-animate {
      animation: cakePop 1.5s cubic-bezier(.42,0,.58,1) both;
    }

    @keyframes cakePop {
      from { opacity: 0; transform: scale(0.7); }
      70% { transform: scale(1.1); }
      to { opacity: 1; transform: scale(1); }
    }

    /* ===== GAME CTA STYLES ===== */
    .game-btn {
      position: relative;
      overflow: visible;
    }

    .game-badge {
      position: absolute;
      top: -8px;
      right: -8px;
      background: #f43f5e;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      box-shadow: 0 0 8px rgba(244,63,94,0.6);
      animation: pulseBadge 1.6s infinite;
    }

    @keyframes pulseBadge {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.15); opacity: 0.85; }
      100% { transform: scale(1); opacity: 1; }
    }

    .game-preview {
      position: absolute;
      bottom: 115%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 50;
    }

    .game-btn:hover .game-preview {
      opacity: 1;
      transform: translateX(-50%) translateY(-6px);
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center relative px-4 pb-28">

  <!-- Sparkles -->
  <div class="sparkle" style="top:10%; left:15%; width:18px; height:18px; background:radial-gradient(circle,#fff 60%,#fbbf24 100%);"></div>
  <div class="sparkle" style="top:20%; left:80%; width:12px; height:12px; background:radial-gradient(circle,#fff 60%,#f472b6 100%); animation-delay:1s"></div>
  <div class="sparkle" style="top:60%; left:25%; width:10px; height:10px; background:radial-gradient(circle,#fff 60%,#a78bfa 100%); animation-delay:0.7s"></div>
  <div class="sparkle" style="top:75%; left:70%; width:16px; height:16px; background:radial-gradient(circle,#fff 60%,#facc15 100%); animation-delay:1.4s"></div>

  <!-- Balloons -->
  <div class="absolute top-0 left-1/2 -translate-x-1/2 flex gap-6 z-10 pt-4">
    <div class="balloon w-8 h-16 sm:w-12 sm:h-24 bg-pink-400 rounded-full border-2 border-pink-200"></div>
    <div class="balloon w-8 h-16 sm:w-12 sm:h-24 bg-purple-400 rounded-full border-2 border-purple-200"></div>
    <div class="balloon w-8 h-16 sm:w-12 sm:h-24 bg-yellow-300 rounded-full border-2 border-yellow-100"></div>
    <div class="balloon w-8 h-16 sm:w-12 sm:h-24 bg-blue-300 rounded-full border-2 border-blue-100"></div>
  </div>

  <!-- Card -->
  <div class="text-center p-6 sm:p-10 bg-white/80 backdrop-blur-lg rounded-3xl shadow-2xl w-full max-w-md card-animate z-20 border-2 border-pink-200">

    <div class="flex justify-center mb-4 cake-animate">
      <!-- Cake SVG -->
      <svg width="80" height="80" viewBox="0 0 80 80">
        <ellipse cx="40" cy="66" rx="24" ry="8" fill="#fcd34d"/>
        <rect x="16" y="36" width="48" height="30" rx="12" fill="#fff" stroke="#fbbf24" stroke-width="2"/>
        <rect x="20" y="40" width="40" height="22" rx="8" fill="#f472b6"/>
        <ellipse cx="40" cy="40" rx="20" ry="8" fill="#fff"/>
        <rect x="36" y="22" width="8" height="18" rx="4" fill="#fbbf24"/>
        <ellipse cx="40" cy="22" rx="4" ry="2" fill="#fbbf24"/>
        <ellipse cx="40" cy="20" rx="2" ry="2" fill="#f87171"/>
      </svg>
    </div>

    <h1 class="text-4xl font-extrabold text-pink-600 mb-4 animate-pulse">
      🎉 Happy Birthday, <span class="text-yellow-500">Ananya!</span>
    </h1>

    <button onclick="launchConfetti()" class="bg-pink-500 hover:bg-pink-600 text-white font-bold py-2 px-8 rounded-full glow animate-bounce">
      Celebrate 🎈
    </button>

    <button onclick="showSurprise()" class="mt-4 bg-yellow-400 hover:bg-yellow-500 text-pink-800 font-bold py-2 px-8 rounded-full">
      Surprise! 🎁
    </button>

    <div id="surprise-message" class="mt-4 text-lg text-purple-600 font-semibold hidden"></div>
  </div>

  <!-- Footer -->
  <footer class="absolute bottom-0 left-0 w-full flex flex-wrap justify-center gap-4 py-6 z-30">

    <a href="https://nitnapple.github.io/Ananya/home">
      <button class="bg-pink-500 hover:bg-pink-600 text-white py-2 px-6 rounded-full">
        🏠 Home
      </button>
    </a>

    <a href="https://nitnapple.github.io/Ananya/Archive">
      <button class="bg-pink-500 hover:bg-pink-600 text-white py-2 px-6 rounded-full">
        📚 View Archive
      </button>
    </a>

    <a href="https://nitnapple.github.io/Ananya/Savegalaxy" class="game-btn">

      <video class="game-preview" src="https://nitnapple.github.io/Ananya/Savegalaxy/preview.mp4" muted loop autoplay playsinline></video>

      <button class="bg-purple-500 hover:bg-purple-600 text-white py-2 px-6 rounded-full animate-pulse">
        🎮 Try out our New Game
        <span class="game-badge">NEW</span>
      </button>

    </a>

  </footer>

  <audio id="birthdayMusic" loop>
    <source src="https://cdn.pixabay.com/download/audio/2025/03/20/audio_1488679301.mp3" type="audio/mpeg">
  </audio>

  <script>
    function launchConfetti() {
      confetti({ particleCount: 180, spread: 90, origin: { y: 0.6 } });
      document.getElementById('birthdayMusic').play();
    }

    function showSurprise() {
      const messages = ["👑 Happy Birthday to the monarch of magic—Ananya!"];
      const msg = messages[Math.floor(Math.random() * messages.length)];
      const div = document.getElementById('surprise-message');
      div.textContent = msg;
      div.classList.remove('hidden');
      confetti({ particleCount: 120, spread: 120, origin: { y: 0.5 } });
    }

    window.onload = () => {
      setTimeout(() => confetti({ particleCount: 100, spread: 80, origin: { y: 0.5 } }), 600);
    };
  </script>

</body>
</html>
