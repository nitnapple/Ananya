    body {
      background: linear-gradient(120deg, #ffe0f7 0%, #fffbe6 50%, #e0e7ff 100%);
      overflow-x: hidden;
    }

    .sparkle {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      animation: sparkle 2s infinite linear;
      opacity: 0.7;
    }

    @keyframes sparkle {
      0% { transform: scale(1) translateY(0);}
      50% { transform: scale(1.2) translateY(-15px);}
      100% { transform: scale(1) translateY(0);}
    }

    @keyframes float {
      0% { transform: translateY(0);}
      50% { transform: translateY(-30px);}
      100% { transform: translateY(0);}
    }

    .balloon {
      animation: float 4s ease-in-out infinite;
      position: relative;
      z-index: 2;
    }

    .balloon::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 100%;
      width: 2px;
      height: 28px;
      background: linear-gradient(to bottom, #aaa 30%, transparent 100%);
      transform: translateX(-50%);
    }

    .card-animate {
      animation: fadeInUp 1.2s cubic-bezier(.42,0,.58,1) both;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px);}
      to { opacity: 1; transform: translateY(0);}
    }

    .glow {
      box-shadow: 0 0 18px 4px #f472b6, 0 0 40px 10px #fff2;
    }

    /* GAME CTA */
    .game-btn { position: relative; }

    .game-badge {
      position: absolute;
      top: -6px;
      right: -6px;
      background: #f43f5e;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 999px;
      animation: pulseBadge 1.6s infinite;
    }

    @keyframes pulseBadge {
      0% { transform: scale(1); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .game-preview {
      position: absolute;
      bottom: 115%;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      border-radius: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 50;
    }

    .game-btn:hover .game-preview {
      opacity: 1;
    }

    /* MOBILE PREVIEW */
    .mobile-preview-overlay {
      position: fixed;

      background: rgba(0,0,0,0.85);

      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    #live-clock {
      transition: all 0.3s ease;

    /* COMPACT 12H CLOCK LOGIC */
    function updateClock() {
      const now = new Date();
      
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      
      hours = hours % 12;
      hours = hours ? hours : 12; // the hour '0' should be '12'
      const strHours = String(hours).padStart(2, '0');

      document.getElementById('clock-time').textContent = `${strHours}:${minutes}:${seconds}`;
      document.getElementById('clock-ampm').textContent = ampm;
      
      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById('clock-date').textContent = now.toLocaleDateString('en-US', options);
    }
    setInterval(updateClock, 1000);
    updateClock();

    let musicPlaying = false;

    function startMusic() {
      const music = document.getElementById('birthdayMusic');
      if (!musicPlaying) {
        music.play().then(() => {
          musicPlaying = true;
        }).catch(e => console.log("Waiting for user interaction for audio."));
      }
    }

    function launchConfetti() {
      startMusic();
      const duration = 3 * 1000;
      const end = Date.now() + duration;

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: ['#ec4899', '#eab308', '#a855f7']
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: ['#ec4899', '#eab308', '#a855f7']
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }
