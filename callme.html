<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome Back Ananya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-purple: #1a0526;
            --deep-plum: #3e1235;
            --gold: #d4af37;
            --bright-gold: #f3e5ab;
            --antique-gold: #8a6e2f;
            --overlay-dark: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;
            background: radial-gradient(circle at center, var(--deep-plum), var(--royal-purple));
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
            cursor: pointer;
            user-select: none;
        }

        /* Gold Frame around the screen - Responsive */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid var(--gold);
            z-index: 100;
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 22px;
            left: 22px;
            right: 22px;
            bottom: 22px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            z-index: 100;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        @media (max-width: 768px) {
            body::after {
                top: 8px; left: 8px; right: 8px; bottom: 8px;
                border-width: 1px;
            }
            body::before {
                top: 12px; left: 12px; right: 12px; bottom: 12px;
            }
        }

        .pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, transparent 60%, rgba(0,0,0,0.5) 100%),
                repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.03) 0px, rgba(212, 175, 55, 0.03) 2px, transparent 2px, transparent 10px);
            opacity: 1;
            z-index: 1;
            pointer-events: none;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .container {
            z-index: 10;
            padding: 4rem;
            width: 90%;
            max-width: 800px;
            position: relative;
            background: rgba(20, 5, 25, 0.4);
            backdrop-filter: blur(2px);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: padding 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }
        }

        /* --- Animations --- */
        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes growLine {
            from { width: 0; opacity: 0; }
            to { width: 150px; opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        /* Wobble Animation */
        @keyframes wobble {
            0% { transform: scale(1) rotate(0deg); }
            20% { transform: scale(1.02) rotate(-2deg); }
            40% { transform: scale(1.02) rotate(2deg); }
            60% { transform: scale(1.02) rotate(-1deg); }
            80% { transform: scale(1.02) rotate(1deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .wobble-effect {
            animation: wobble 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Sheen animation for scratch card */
        @keyframes sheen {
            0% { left: -100%; opacity: 0; }
            50% { left: 100%; opacity: 0.6; }
            100% { left: 200%; opacity: 0; }
        }

        /* Border Glow Pulse */
        @keyframes borderPulse {
            0% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); border-color: rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 25px rgba(212, 175, 55, 0.6), 0 0 5px rgba(243, 229, 171, 0.4); border-color: rgba(212, 175, 55, 0.8); }
            100% { box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); border-color: rgba(212, 175, 55, 0.4); }
        }

        .crown-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--gold);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
            opacity: 0;
            animation: fadeInUp 1.2s ease-out forwards, float 5s ease-in-out infinite 1.2s;
        }

        h1 {
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(3.5rem, 12vw, 7rem);
            font-weight: 400;
            letter-spacing: 0.02em;
            margin-bottom: 1rem;
            line-height: 1.2;
            background: linear-gradient(
                110deg, 
                var(--antique-gold) 0%, 
                var(--gold) 20%, 
                var(--bright-gold) 40%, 
                #ffffe0 50%, 
                var(--bright-gold) 60%, 
                var(--gold) 80%, 
                var(--antique-gold) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.6));
            opacity: 0;
            animation: fadeInUp 1.2s ease-out 0.4s forwards, shine 5s linear infinite;
        }

        .divider {
            height: 3px;
            width: 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 2.5rem auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            animation: growLine 1.5s ease-out 1s forwards;
        }

        /* Scratch Card Area */
        .scratch-container {
            position: relative;
            width: 320px;
            height: 100px;
            margin-top: 1rem;
            opacity: 0;
            animation: fadeInUp 1.2s ease-out 1.5s forwards, borderPulse 2.5s infinite ease-in-out 2s;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
            border: 1px dashed rgba(212, 175, 55, 0.4);
            background: rgba(0,0,0,0.2);
            /* Ensure touches on this trigger events properly */
            touch-action: none; 
        }

        /* Sheen Effect */
        .scratch-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transform: skewX(-20deg);
            animation: sheen 3.5s infinite ease-in-out;
            pointer-events: none;
            z-index: 5;
        }

        .scratch-container.revealed {
            animation: none;
            opacity: 1 !important;
            border-color: transparent;
            box-shadow: none;
        }
        
        .scratch-container.revealed::after {
            display: none;
        }

        .scratch-container.revealed #scratchCanvas {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease;
        }

        .hidden-message {
            position: absolute;
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffecb3;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            font-style: italic;
            text-align: center;
            width: 100%;
            z-index: 1;
            user-select: none;
            padding: 0 15px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .phone-link {
            text-decoration: none;
            font-size: 2.2rem;
            display: inline-block;
            cursor: pointer;
            animation: phone-ring 2s infinite ease-in-out;
            color: inherit;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
            transition: transform 0.2s;
        }

        .phone-link:active {
            transform: scale(0.9);
        }

        @keyframes phone-ring {
            0% { transform: rotate(0) scale(1); }
            10% { transform: rotate(-10deg) scale(1.1); }
            20% { transform: rotate(10deg) scale(1.1); }
            30% { transform: rotate(-10deg) scale(1.1); }
            40% { transform: rotate(10deg) scale(1.1); }
            50% { transform: rotate(0) scale(1); }
            100% { transform: rotate(0) scale(1); }
        }

        #scratchCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: grab;
            touch-action: none;
        }
        
        #scratchCanvas:active {
            cursor: grabbing;
        }

        /* Sparkle animation */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
        
        /* Click Sparkle Effect Styles */
        .click-sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: radial-gradient(circle, #fff 20%, #d4af37 80%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: sparkle-burst 0.8s ease-out forwards;
            box-shadow: 0 0 6px #d4af37;
        }

        @keyframes sparkle-burst {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }
        
        /* Audio Control */
        .audio-control {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 150;
            background: rgba(26, 5, 38, 0.8);
            border: 1px solid var(--gold);
            border-radius: 50%;
            color: var(--gold);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
            padding: 10px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            animation: pulse 3s infinite;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .audio-control {
                top: 15px;
                right: 15px;
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .audio-control:hover, .audio-control:active {
            transform: scale(1.1);
            background: rgba(62, 18, 53, 0.9);
        }

        .audio-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .music-hint {
            position: absolute;
            top: 100%;
            right: 0;
            width: 120px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px;
            border-radius: 4px;
            margin-top: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            font-family: sans-serif;
            text-align: center;
        }

    </style>
</head>
<body onclick="tryUnlockAudio()">

    <div class="pattern"></div>
    <div id="particles"></div>
    
    <!-- Audio Element: Angelic Echo Heavenly Choir -->
    <audio id="bgm" loop preload="auto">
        <source src="https://raw.githubusercontent.com/nitnapple/src/refs/heads/main/angelic-echo-heavenly-choir-ambience-spiritual-background-music-426613.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Audio Element: Magic Chime on Tap -->
    <audio id="clickSound" preload="auto">
        <source src="https://raw.githubusercontent.com/nitnapple/src/refs/heads/main/chime-2-356833.mp3" type="audio/mpeg">
    </audio>
    
    <!-- Audio Element: Scratch Sound -->
    <audio id="scratchSound" loop preload="auto">
        <source src="https://raw.githubusercontent.com/nitnapple/src/refs/heads/main/morris-head-scratch-103330.mp3" type="audio/mpeg">
    </audio>

    <button class="audio-control" onclick="toggleMusic(event)" aria-label="Toggle Music" title="Toggle Music">
        <svg class="audio-icon" id="icon-sound-off" style="display: block;" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <svg class="audio-icon" id="icon-sound-on" style="display: none;" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <div class="music-hint" id="musicHint">Music Paused</div>
    </button>

    <div class="container">
        <div class="crown-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="url(#goldGradient)" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#bf953f" />
                        <stop offset="50%" stop-color="#fcf6ba" />
                        <stop offset="100%" stop-color="#b38728" />
                    </linearGradient>
                </defs>
                <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5ZM19 19C19 19.5523 18.5523 20 18 20H6C5.44772 20 5 19.5523 5 19V18H19V19Z" />
            </svg>
        </div>
        
        <!-- Pinyon Script Font (Handwriting style) -->
        <h1>Welcome Back<br>Ananya</h1>
        
        <div class="divider"></div>
        
        <!-- Scratch Card Interaction -->
        <div class="scratch-container">
            <div class="hidden-message">
                Miss me, Why not make a Call? I am always there.
                <a href="tel:+919971721097" class="phone-link" aria-label="Call Now">📞</a>
            </div>
            <canvas id="scratchCanvas"></canvas>
        </div>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const scratchSound = document.getElementById('scratchSound');
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');
        const musicHint = document.getElementById('musicHint');
        
        // --- Sound Pool Setup ---
        const CLICK_SOUND_URL = "https://raw.githubusercontent.com/nitnapple/src/refs/heads/main/chime-2-356833.mp3";
        const POOL_SIZE = 5;
        const audioPool = [];
        let poolIndex = 0;

        for (let i = 0; i < POOL_SIZE; i++) {
            const audio = new Audio(CLICK_SOUND_URL);
            audio.volume = 0.4;
            audioPool.push(audio);
        }

        function playChime() {
            const sound = audioPool[poolIndex];
            sound.currentTime = 0;
            sound.play().catch(e => { /* Ignore auto-play blocks */ });
            poolIndex = (poolIndex + 1) % POOL_SIZE;
        }

        // --- Scratch Sound Control ---
        function playScratchFx() {
            scratchSound.volume = 0.6;
            // Only play if not already playing to avoid stuttering
            if (scratchSound.paused) {
                scratchSound.play().catch(e => console.log('Scratch sound blocked', e));
            }
        }

        function stopScratchFx() {
            scratchSound.pause();
            scratchSound.currentTime = 0;
        }

        let isPlaying = false;
        let hasUnlockedAudio = false;

        // --- Global Touch/Click Handler ---
        document.addEventListener('pointerdown', (e) => {
            // Play Chime
            playChime();

            // 2. Visual Sparkle
            createClickSparkle(e.pageX, e.pageY);

            // 3. Vibration
            if (navigator.vibrate) {
                navigator.vibrate(30);
            }

            // 4. Wobble Animation
            const container = document.querySelector('.container');
            container.classList.remove('wobble-effect');
            void container.offsetWidth; // Trigger reflow
            container.classList.add('wobble-effect');

            // 5. Unlock Background Audio (One-time)
            tryUnlockAudio();
        });

        function createClickSparkle(x, y) {
            const count = 10;
            for(let i=0; i<count; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('click-sparkle');
                sparkle.style.left = x + 'px';
                sparkle.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const velocity = 30 + Math.random() * 60;
                const tx = Math.cos(angle) * velocity + 'px';
                const ty = Math.sin(angle) * velocity + 'px';
                
                sparkle.style.setProperty('--tx', tx);
                sparkle.style.setProperty('--ty', ty);
                
                document.body.appendChild(sparkle);
                setTimeout(() => sparkle.remove(), 800);
            }
        }

        // --- Music Logic ---
        function tryUnlockAudio() {
            if (!hasUnlockedAudio && !isPlaying) {
                playAudio();
                hasUnlockedAudio = true;
            }
        }

        function playAudio() {
            bgm.volume = 0.5; // Slightly lower BGM so chimes are heard
            const playPromise = bgm.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    isPlaying = true;
                    updateIconState();
                    document.querySelector('.audio-control').style.animation = 'none';
                }).catch(error => {
                    console.log("Auto-play prevented. Waiting for explicit click.");
                    isPlaying = false;
                    updateIconState();
                });
            }
        }

        function toggleMusic(event) {
            if(event) event.stopPropagation();
            if (isPlaying) {
                bgm.pause();
                isPlaying = false;
            } else {
                playAudio();
            }
            updateIconState();
        }

        function updateIconState() {
            if (isPlaying) {
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
                musicHint.style.opacity = '0';
            } else {
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            }
        }

        // --- Scratch Card Logic ---
        function initScratchCard() {
            const canvas = document.getElementById('scratchCanvas');
            const ctx = canvas.getContext('2d');
            const container = document.querySelector('.scratch-container');
            let isRevealed = false;
            
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Fill with Gold Foil effect
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#bf953f');
            gradient.addColorStop(0.25, '#fcf6ba');
            gradient.addColorStop(0.5, '#b38728');
            gradient.addColorStop(0.75, '#fcf6ba');
            gradient.addColorStop(1, '#bf953f');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Add "Instruction" text
            ctx.font = "20px Cinzel";
            ctx.fillStyle = "#3e1235";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText("Sketch to Reveal", canvas.width/2, canvas.height/2);

            let isDrawing = false;

            function checkScratchPercent() {
                if (isRevealed) return;
                
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const pixels = imageData.data;
                let transparentPixels = 0;
                
                const step = 16; 
                for (let i = 3; i < pixels.length; i += step) {
                    if (pixels[i] < 128) {
                        transparentPixels++;
                    }
                }
                
                const totalSampled = pixels.length / step;
                const percent = (transparentPixels / totalSampled) * 100;

                if (percent > 80) {
                    isRevealed = true;
                    container.classList.add('revealed');
                    // Stop any ongoing scratch sound if revealed
                    stopScratchFx();
                }
            }

            function scratch(x, y) {
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(x, y, 20, 0, Math.PI * 2, false);
                ctx.fill();
            }

            function getMousePos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX || e.touches[0].clientX) - rect.left,
                    y: (e.clientY || e.touches[0].clientY) - rect.top
                };
            }

            // Canvas specific handlers (Sound handled by global pointerdown)
            
            // Mouse
            canvas.addEventListener('mousedown', (e) => {
                if(isRevealed) return;
                isDrawing = true;
                const pos = getMousePos(e);
                playScratchFx();
                scratch(pos.x, pos.y);
            });
            canvas.addEventListener('mousemove', (e) => {
                if (isDrawing && !isRevealed) {
                    const pos = getMousePos(e);
                    scratch(pos.x, pos.y);
                }
            });
            
            const stopDrawing = () => {
                if(isDrawing) {
                    isDrawing = false;
                    stopScratchFx();
                    checkScratchPercent();
                }
            };
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);

            // Touch
            canvas.addEventListener('touchstart', (e) => {
                if(isRevealed) return;
                isDrawing = true;
                e.preventDefault(); 
                const pos = getMousePos(e);
                playScratchFx();
                scratch(pos.x, pos.y);
            }, {passive: false});
            canvas.addEventListener('touchmove', (e) => {
                if (isDrawing && !isRevealed) {
                    e.preventDefault(); 
                    const pos = getMousePos(e);
                    scratch(pos.x, pos.y);
                }
            }, {passive: false});
            canvas.addEventListener('touchend', stopDrawing);
        }

        // --- Sparkle Logic ---
        function createSparkles() {
            const container = document.getElementById('particles');
            const particleCount = 40; 
            for (let i = 0; i < particleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                resetSparkle(sparkle);
                container.appendChild(sparkle);
            }
            function animate() {
                const sparkles = document.querySelectorAll('.sparkle');
                sparkles.forEach(sparkle => {
                    let opacity = parseFloat(sparkle.style.opacity);
                    let scale = parseFloat(sparkle.getAttribute('data-scale'));
                    let y = parseFloat(sparkle.style.top);
                    let speed = parseFloat(sparkle.getAttribute('data-speed'));
                    y -= speed * 0.05;
                    let phase = parseFloat(sparkle.getAttribute('data-phase'));
                    phase += 0.02;
                    sparkle.setAttribute('data-phase', phase);
                    opacity = Math.sin(phase); 
                    if(opacity < 0) {
                        resetSparkle(sparkle);
                        opacity = 0;
                    }
                    sparkle.style.opacity = Math.max(0, opacity);
                    sparkle.style.top = y + '%';
                    sparkle.style.transform = `scale(${scale})`;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function resetSparkle(el) {
            const x = Math.random() * 100;
            const y = Math.random() * 100 + 20; 
            const size = Math.random() * 3 + 1;
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.opacity = 0;
            el.style.background = Math.random() > 0.6 ? '#fff' : '#d4af37';
            el.style.boxShadow = `0 0 ${size * 2}px ${el.style.background}`;
            el.setAttribute('data-speed', Math.random() * 0.5 + 0.2);
            el.setAttribute('data-scale', Math.random() * 0.5 + 0.5);
            el.setAttribute('data-phase', Math.random() * Math.PI); 
        }

        window.onload = function() {
            createSparkles();
            initScratchCard();
            // Attempt autoplay
            playAudio();
        };
        
        window.onresize = function() {
            initScratchCard();
        }
    </script>
</body>
</html>
