<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retention Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
* { box-sizing:border-box; }

body {
    margin:0;
    font-family: system-ui, -apple-system, Segoe UI, sans-serif;
    background: radial-gradient(circle at top, #0f2a33, #050b10);
    color:white;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.app {
    width:100%;
    max-width:420px;
    height:100vh;
    padding:24px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

h1 {
    text-align:center;
    font-size:22px;
    letter-spacing:1px;
    opacity:0.9;
}

.progress {
    width:100%;
    height:10px;
    background:#0a1c22;
    border-radius:20px;
    overflow:hidden;
}

.bar {
    height:100%;
    background:linear-gradient(90deg,#00ffe0,#00ff88);
    transition:0.6s ease;
}

.card {
    background:rgba(255,255,255,0.04);
    border-radius:22px;
    padding:28px;
    text-align:center;
    box-shadow:0 0 40px rgba(0,255,255,0.12);
}

.day {
    font-size:40px;
    font-weight:700;
}

.quote {
    margin:22px 0;
    font-size:18px;
    line-height:1.5;
    color:#cafff4;
}

.countdown {
    margin-top:10px;
    font-size:16px;
    color:#00ffd5;
}

button {
    margin-top:22px;
    width:100%;
    padding:18px;
    border:none;
    border-radius:60px;
    font-size:18px;
    font-weight:600;
    background:linear-gradient(90deg,#00ffe0,#00ff88);
    color:#001;
    box-shadow:0 0 25px rgba(0,255,255,.6);
    transition:0.2s ease;
}

button:active {
    transform:scale(0.96);
}

button.done {
    background:#00aa88;
    color:white;
}

.footer {
    text-align:center;
    font-size:14px;
    opacity:0.6;
}
</style>
</head>

<body>
<div id="app" class="app">

<h1>10-Day Retention Challenge</h1>

<div class="progress">
    <div class="bar" :style="{width: progress+'%'}"></div>
</div>

<div class="card">
    <div class="day">Day {{ day }}</div>
    <div class="quote">“{{ quotes[day-1] }}”</div>
    <div class="countdown">⏳ {{ countdown }}</div>

    <button 
      @click="markComplete"
      :class="{done:completed[day-1]}"
    >
      {{ completed[day-1] ? "Completed" : "Mark Today Done" }}
    </button>
</div>

<div class="footer">
    12 Jan 2026 → 22 Jan 2026
</div>

</div>

<script>
const { createApp } = Vue;

createApp({
data(){
    return{
        start:new Date("2026-01-12"),
        end:new Date("2026-01-22T23:59:59"),
        now:new Date(),
        completed:Array(10).fill(false),
        quotes:[
            "Discipline is the foundation of power.",
            "Every urge resisted sharpens the mind.",
            "You are becoming harder to control — and easier to respect.",
            "Focus is stored energy.",
            "Self-control creates dominance.",
            "You are mastering biology.",
            "Every day retained multiplies your future.",
            "Your will is getting stronger.",
            "You now choose purpose over pleasure.",
            "A disciplined man is unstoppable."
        ]
    }
},
mounted(){
    setInterval(()=>{this.now=new Date()},1000)
},
computed:{
    day(){
        let d=Math.floor((this.now-this.start)/(1000*60*60*24))+1
        return Math.min(Math.max(d,1),10)
    },
    progress(){
        return (this.day-1)*10
    },
    countdown(){
        let diff=this.end-this.now
        if(diff<=0) return "Challenge Completed"
        let d=Math.floor(diff/(1000*60*60*24))
        let h=Math.floor(diff/(1000*60*60)%24)
        let m=Math.floor(diff/(1000*60)%60)
        let s=Math.floor(diff/1000%60)
        return `${d}d ${h}h ${m}m ${s}s`
    }
},
methods:{
    markComplete(){
        this.completed[this.day-1]=true
        navigator.vibrate?.(30)
    }
}
}).mount("#app")
</script>

</body>
</html>
