<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>10-Day Retention Challenge</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

<style>
body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 95%;
    max-width: 520px;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(12px);
    border-radius: 22px;
    padding: 32px;
    box-shadow: 0 0 50px rgba(0,255,255,0.25);
    text-align: center;
}

h1 {
    margin-bottom: 10px;
    letter-spacing: 1px;
}

.progress {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
    margin: 20px 0;
}

.bar {
    height: 100%;
    background: linear-gradient(90deg, #00f5ff, #00ff88);
    transition: width 0.5s ease;
}

.day-box {
    font-size: 24px;
    margin: 12px 0;
    font-weight: bold;
}

.quote {
    font-size: 18px;
    font-style: italic;
    margin: 20px 0;
    color: #c8f7ff;
}

.countdown {
    font-size: 20px;
    margin-top: 15px;
    color: #00ffcc;
}
</style>
</head>

<body>
<div id="app" class="app">
    <h1>10-Day Retention Challenge</h1>

    <div class="progress">
        <div class="bar" :style="{ width: progress + '%' }"></div>
    </div>

    <div class="day-box">
        Day {{ currentDay }} / 10
    </div>

    <div class="quote">
        "{{ quotes[currentDay-1] }}"
    </div>

    <div class="countdown">
        ⏳ {{ countdown }}
    </div>
</div>

<script>
const { createApp } = Vue;

createApp({
    data() {
        return {
            startDate: new Date("2026-01-12T00:00:00"),
            endDate: new Date("2026-01-22T23:59:59"),
            now: new Date(),
            quotes: [
                "Discipline is the bridge between who you are and who you will become.",
                "Your mind grows stronger every time you resist an impulse.",
                "Real power is self-control.",
                "You are training your brain to crave greatness, not pleasure.",
                "Energy saved today becomes strength tomorrow.",
                "Every urge you conquer builds a sharper mind.",
                "Your future self is watching your choices today.",
                "You are mastering desire instead of being mastered by it.",
                "Focus is your true superpower.",
                "A disciplined man is unstoppable."
            ]
        }
    },
    mounted() {
        setInterval(() => {
            this.now = new Date();
        }, 1000);
    },
    computed: {
        currentDay() {
            const diff = Math.floor((this.now - this.startDate) / (1000 * 60 * 60 * 24)) + 1;
            return Math.min(Math.max(diff, 1), 10);
        },
        progress() {
            return (this.currentDay - 1) * 10;
        },
        countdown() {
            let diff = this.endDate - this.now;
            if (diff <= 0) return "Challenge completed";

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / (1000 * 60)) % 60);
            const seconds = Math.floor((diff / 1000) % 60);

            return `${days}d ${hours}h ${minutes}m ${seconds}s remaining`;
        }
    }
}).mount("#app");
</script>
</body>
</html>
