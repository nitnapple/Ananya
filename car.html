<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High Intensity 3D Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #050505;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scroll bars during tilt */
            perspective: 2000px; /* Global perspective for better 3D depth */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .tilt-card {
            /* Removed the transition on 'transform' during movement 
               to eliminate input lag/smoothing delay. 
               We only transition box-shadow/opacity.
            */
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Smooth return to center when mouse leaves */
        .tilt-card.resetting {
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
    </style>
</head>
<body>

    <!-- 
      WRAPPER
      Added 'z-50' to ensure it pops above everything.
    -->
    <div id="card" class="tilt-card group relative h-[450px] w-80 rounded-3xl bg-slate-800 p-[2px] cursor-pointer">
        
        <!-- 
           INTENSE SHADOW EMITTER
           This is a separate div behind the card that creates the deep neon glow.
        -->
        <div class="absolute inset-0 rounded-3xl bg-indigo-600 blur-2xl opacity-0 group-hover:opacity-60 transition-opacity duration-500 group-hover:duration-200" style="transform: translateZ(-50px);"></div>

        <!-- 
           SPOTLIGHT BORDER
           Brighter colors (indigo-400) and higher opacity range.
        -->
        <div id="spotlight" class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity duration-300 rounded-3xl z-10 pointer-events-none"
             style="background: radial-gradient(400px circle at var(--x) var(--y), rgba(129, 140, 248, 0.8), transparent 40%);">
        </div>

        <!-- CARD CONTENT CONTAINER -->
        <div class="relative h-full w-full overflow-hidden rounded-[22px] bg-slate-950 z-20">
            
            <!-- IMAGE -->
            <div class="absolute inset-0 h-full w-full">
                <!-- 
                    Increased scale to 125 (1.25x zoom)
                    Sharper transition curve (ease-out)
                -->
                <img src="https://images.unsplash.com/photo-1634152962476-4b8a00e1915c?auto=format&fit=crop&q=80&w=800" 
                     class="h-full w-full object-cover transition-transform duration-300 ease-out group-hover:scale-125 opacity-70 group-hover:opacity-50" 
                     alt="Cyberpunk City">
                
                <!-- Gradient overlay -->
                <div class="absolute inset-0 bg-gradient-to-t from-black via-black/80 to-transparent"></div>
            </div>

            <!-- TEXT CONTENT -->
            <!-- Using translateZ to make text float strictly ABOVE the card surface (Parallax) -->
            <div class="absolute bottom-0 left-0 right-0 p-8 transform-style-3d" style="transform: translateZ(30px);">
                
                <div class="mb-4 translate-y-4 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 transition-all duration-300 delay-100">
                    <span class="inline-flex items-center justify-center rounded-full bg-cyan-500/20 px-3 py-1 text-xs font-bold text-cyan-300 ring-1 ring-inset ring-cyan-500/50 shadow-[0_0_10px_rgba(34,211,238,0.4)]">
                        LEGENDARY
                    </span>
                </div>

                <h3 class="text-3xl font-black text-white mb-2 leading-tight drop-shadow-lg group-hover:text-transparent group-hover:bg-clip-text group-hover:bg-gradient-to-r group-hover:from-indigo-300 group-hover:to-cyan-300 transition-all">
                    Neon Core
                </h3>
                
                <p class="text-slate-400 text-sm leading-relaxed mb-6 opacity-80 group-hover:text-slate-200 transition-colors">
                    Hyper-reactive interface elements for the next generation of web applications.
                </p>

                <!-- Button that appears with a pop -->
                <button class="w-full rounded-xl bg-white text-black font-bold py-3 hover:bg-indigo-400 hover:text-white transition-all transform translate-y-8 opacity-0 group-hover:translate-y-0 group-hover:opacity-100 shadow-lg active:scale-95 flex items-center justify-center gap-2">
                    Acquire Asset <i data-lucide="zap" class="w-4 h-4 fill-current"></i>
                </button>
            </div>

        </div>
    </div>

    <script>
        lucide.createIcons();

        const card = document.getElementById('card');
        const spotlight = document.getElementById('spotlight');

        let bounds;
        
        function rotateToMouse(e) {
            bounds = card.getBoundingClientRect();
            const mouseX = e.clientX;
            const mouseY = e.clientY;
            const leftX = mouseX - bounds.x;
            const topY = mouseY - bounds.y;
            
            // 1. SPOTLIGHT LOGIC
            const center = {
                x: leftX - bounds.width / 2,
                y: topY - bounds.height / 2
            }
            // Update CSS variables for the gradient
            spotlight.style.setProperty('--x', `${leftX}px`);
            spotlight.style.setProperty('--y', `${topY}px`);

            // 2. TILT LOGIC (INTENSIFIED)
            // Reduced the divisor from 20 to 8 for much higher sensitivity
            const rotateX = ((topY - bounds.height / 2) / 8) * -1; 
            const rotateY = (leftX - bounds.width / 2) / 8;

            // Added scale3d(1.1) to lift the card closer to the user
            card.style.transform = `
                perspective(1000px)
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale3d(1.1, 1.1, 1.1)
            `;
        }

        // Mouse Enter: Clear the reset class to allow instant movement
        card.addEventListener('mouseenter', () => {
            card.classList.remove('resetting');
            spotlight.style.opacity = '1';
        });

        card.addEventListener('mousemove', rotateToMouse);

        // Mouse Leave: Add reset class for smooth return, clear transforms
        card.addEventListener('mouseleave', () => {
            card.classList.add('resetting');
            spotlight.style.opacity = '0';
            card.style.transform = `
                perspective(1000px)
                rotateX(0deg)
                rotateY(0deg)
                scale3d(1, 1, 1)
            `;
        });
    </script>
</body>
</html>
