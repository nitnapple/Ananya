<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year Ananya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        /* Updated to Classic Fonts: Playfair Display (Headers) and Lora (Body) */
        @import url('https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        body {
            background-color: #050505;
            overflow: hidden; /* Prevent body scroll, handle inside card */
            font-family: 'Lora', serif; /* Classic Serif for body text */
        }

        /* 3D Container & Card */
        .scene {
            perspective: 1200px;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .card {
            width: 90%;
            max-width: 450px;
            height: 80vh; 
            max-height: 700px;
            transform-style: preserve-3d;
            border-radius: 20px;
            transition: transform 0.1s ease-out;
            position: relative;
            background: rgba(25, 25, 25, 0.4);
            box-shadow: 
                0 30px 60px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255, 215, 0, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Ambient float animation when not interacting */
        .card.floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotateX(0) rotateY(0); }
            50% { transform: translateY(-15px) rotateX(2deg) rotateY(-2deg); }
            100% { transform: translateY(0px) rotateX(0) rotateY(0); }
        }

        /* Content inside the card */
        .card-content {
            position: absolute;
            inset: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Base z-offset for content container */
            transform: translateZ(20px);
            text-align: center;
            color: white;
            z-index: 20;
            transform-style: preserve-3d;
        }

        .card-bg-gradient {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.1), transparent 70%),
                        linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%);
            z-index: 1;
        }

        .card-border-glow {
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.4), transparent);
            z-index: 0;
            opacity: 0.6;
        }

        /* Typography */
        h1.name-title {
            font-family: 'Playfair Display', serif; /* Elegant Classic Serif */
            font-style: italic;
            font-size: 3.2rem;
            background: linear-gradient(to bottom right, #fff 30%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            line-height: 1.1;
            pointer-events: none;
        }

        h2.year-title {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            letter-spacing: 4px;
            color: #f0e68c;
            font-size: 1.5rem;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            padding-bottom: 12px;
            width: 100%;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        /* Scrollable Wishes Area */
        .wishes-container {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.08);
            scrollbar-width: thin;
            scrollbar-color: #d4af37 rgba(0,0,0,0.2);
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .wishes-container::-webkit-scrollbar {
            width: 6px;
        }
        .wishes-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
        }
        .wishes-container::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .wish-item {
            font-size: 1rem; /* Slightly larger for readability with serif */
            color: #d1d1d1;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: flex-start;
            gap: 12px;
            line-height: 1.6;
            transition: all 0.3s ease;
        }

        .wish-item:hover {
            color: #fff;
            transform: translateX(5px);
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
            font-style: italic; /* Classic touch on hover */
        }

        .wish-icon {
            color: #ffd700;
            margin-top: 5px;
            font-size: 0.8rem;
            filter: drop-shadow(0 0 2px rgba(255, 215, 0, 0.5));
        }

        /* Parallax Depth Layers */
        .layer-bg { transform: translateZ(0px); }
        .layer-mid { transform: translateZ(40px); }
        .layer-high { transform: translateZ(80px); }
        .layer-super { transform: translateZ(110px); }

        /* Background Particles Container */
        #canvas-container {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            z-index: 1;
            transition: transform 0.1s ease-out;
        }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="fireworks"></canvas>
    </div>

    <div class="scene" id="scene">
        <div class="card floating" id="card">
            <div class="card-border-glow"></div>
            <div class="card-bg-gradient"></div>
            
            <div class="card-content">
                <!-- High Depth Layer: Titles -->
                <div class="layer-super w-full flex flex-col items-center">
                    <h1 class="name-title">Happy New Year<br>Ananya</h1>
                </div>

                <!-- Mid Depth Layer: Year -->
                <div class="layer-high w-full flex flex-col items-center">
                    <h2 class="year-title">2026</h2>
                </div>

                <!-- Base/Mid Depth Layer: List -->
                <div class="wishes-container layer-mid" id="wishes-list">
                    <!-- Wishes injected by JS -->
                </div>

                <!-- Lower Depth Layer: Instructions -->
                <div class="mt-4 text-xs text-yellow-500/60 layer-mid">
                    <i class="fas fa-heart text-red-500/80 mr-1 animate-pulse"></i>Scroll for wishes
                </div>
            </div>
        </div>
        <!-- Removed Hint Text as requested -->
    </div>

    <script>
        /* --- 50 Wishes Data --- */
        const wishes = [
            "May this year bring you endless happiness and love, Ananya.",
            "Wishing you a year filled with new adventures and accomplishments.",
            "May your dreams take flight in the coming year.",
            "Here's to a year of health, wealth, and endless joy.",
            "May every day of the new year glow with good cheer.",
            "Wishing you strength and courage to conquer your goals.",
            "May laughter fill your home and heart throughout 2026.",
            "Here’s to writing a beautiful new chapter in your life.",
            "May you find peace and serenity in every moment.",
            "Wishing you success in every step you take.",
            "May the New Year bring you warmth, love, and light.",
            "Cheers to another year of making beautiful memories.",
            "May you be surrounded by positivity and good vibes.",
            "Wishing you a year as bright and beautiful as your smile, Ananya.",
            "May kindness follow you wherever you go.",
            "Here’s to crushing your goals and setting new ones.",
            "May the coming year be full of pleasant surprises.",
            "Wishing you unwavering focus and boundless energy.",
            "May you discover new passions and joys.",
            "Here's to a fresh start and a bright future.",
            "May your hard work pay off in ways you never imagined.",
            "Wishing you love that grows stronger every day.",
            "May you find beauty in the small things this year.",
            "Here’s to a year of growth, learning, and fun.",
            "May your heart be light and your days be bright.",
            "Wishing you the courage to chase your wildest dreams.",
            "May you inspire others just by being yourself.",
            "Here’s to moments that take your breath away.",
            "May you overcome every challenge with grace.",
            "Wishing you a year of abundance in all things good.",
            "May your path be lined with sunshine and flowers.",
            "Here’s to friendship, family, and fun times ahead.",
            "May you achieve balance and harmony in your life.",
            "Wishing you a year that sparkles with magic.",
            "May you be blessed with opportunities galore.",
            "Here’s to making every second count, Ananya.",
            "May your confidence soar to new heights.",
            "Wishing you nights of peaceful rest and days of energy.",
            "May you be the reason someone smiles today.",
            "Here’s to a year of breaking boundaries.",
            "May your creativity flow effortlessly.",
            "Wishing you safety and security throughout the year.",
            "May you find comfort in the company of loved ones.",
            "Here’s to a year of exciting journeys.",
            "May wisdom guide your decisions in 2026.",
            "Wishing you a heart full of gratitude.",
            "May the New Year bring you closer to your true self.",
            "Here’s to 365 days of limitless possibilities.",
            "May your spirit remain unbreakable.",
            "Happy New Year, Ananya! Make it your best one yet."
        ];

        /* --- Inject Wishes --- */
        const wishesContainer = document.getElementById('wishes-list');
        
        wishes.forEach((wish, index) => {
            const div = document.createElement('div');
            div.className = 'wish-item';
            div.innerHTML = `<i class="fas fa-star wish-icon"></i><span>${wish}</span>`;
            div.style.animation = `fadeIn 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards ${index * 0.05}s`;
            div.style.opacity = '0'; 
            wishesContainer.appendChild(div);
        });

        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn {
                to { opacity: 1; transform: translateY(0); }
                from { opacity: 0; transform: translateY(20px); }
            }
        `;
        document.head.appendChild(styleSheet);


        /* --- Advanced 3D Parallax & Tilt Logic --- */
        const card = document.getElementById('card');
        const scene = document.getElementById('scene');
        const canvasContainer = document.getElementById('canvas-container');
        // Removed hint text JS logic

        let bounds;
        
        function rotateToMouse(e) {
            if (!bounds) bounds = card.getBoundingClientRect();
            
            // Safe coordinate detection
            const clientX = (e.clientX !== undefined) ? e.clientX : (e.touches ? e.touches[0].clientX : 0);
            const clientY = (e.clientY !== undefined) ? e.clientY : (e.touches ? e.touches[0].clientY : 0);
            
            const mouseX = clientX;
            const mouseY = clientY;
            
            const leftX = mouseX - bounds.x;
            const topY = mouseY - bounds.y;
            
            // Center calculation
            const center = {
                x: leftX - bounds.width / 2,
                y: topY - bounds.height / 2
            }
            
            // 1. CARD TILT
            // Max rotation degrees
            const rotateX = (center.y / (bounds.height/2)) * -18; 
            const rotateY = (center.x / (bounds.width/2)) * 18;

            card.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale3d(1.05, 1.05, 1.05)
            `;
            
            // 2. DYNAMIC SHADOW
            const shadowX = -rotateY * 1.5;
            const shadowY = rotateX * 1.5;
            card.style.boxShadow = `
                ${shadowX}px ${shadowY + 30}px 50px rgba(0,0,0,0.6),
                0 0 0 1px rgba(255, 215, 0, 0.2)
            `;

            // 3. BACKGROUND PARALLAX (Inverse movement)
            // Move background opposite to mouse to create depth
            const bgMoveX = (center.x / window.innerWidth) * -40;
            const bgMoveY = (center.y / window.innerHeight) * -40;
            canvasContainer.style.transform = `translate(${bgMoveX}px, ${bgMoveY}px)`;

            // 4. DYNAMIC LIGHTING
            const bg = card.querySelector('.card-bg-gradient');
            bg.style.background = `
                radial-gradient(circle at ${50 + (center.x/4)}% ${20 + (center.y/4)}%, rgba(255, 215, 0, 0.15), transparent 60%),
                linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%)
            `;
        }

        function stopRotate() {
            card.classList.add('floating');
            card.style.transform = '';
            card.style.boxShadow = '0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 215, 0, 0.15)';
            
            // Reset background parallax
            canvasContainer.style.transform = 'translate(0, 0)';

            const bg = card.querySelector('.card-bg-gradient');
            bg.style.background = `
                radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.1), transparent 70%),
                linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.6) 100%)
            `;
        }

        // Listeners
        scene.addEventListener('mouseenter', () => {
            bounds = card.getBoundingClientRect();
            card.classList.remove('floating');
        });
        
        scene.addEventListener('mousemove', (e) => {
            card.classList.remove('floating');
            window.requestAnimationFrame(() => rotateToMouse(e));
        });
        
        scene.addEventListener('mouseleave', stopRotate);

        scene.addEventListener('touchstart', (e) => {
            bounds = card.getBoundingClientRect();
            card.classList.remove('floating');
        });

        scene.addEventListener('touchmove', (e) => {
            window.requestAnimationFrame(() => rotateToMouse(e));
        });

        scene.addEventListener('touchend', stopRotate);


        /* --- Background Particles --- */
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            // Oversized canvas for parallax
            width = window.innerWidth * 1.2;
            height = window.innerHeight * 1.2;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 4 + 4);
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 50 + 40}, 100%, 75%)`; // Gold/Yellow
                this.size = Math.random() * 2 + 0.5;
                this.gravity = 0.05;
                this.exploding = false;
                this.shards = [];
            }

            update() {
                if (!this.exploding) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.alpha -= 0.005;

                    if (this.vy > -1 && Math.random() > 0.96) {
                        this.explode();
                    }
                    
                    if (this.y > height + 50 || this.alpha <= 0) this.reset();
                } else {
                    this.shards.forEach(shard => {
                        shard.x += shard.vx;
                        shard.y += shard.vy;
                        shard.vy += 0.05;
                        shard.alpha -= 0.015;
                    });
                    this.shards = this.shards.filter(s => s.alpha > 0);
                    if (this.shards.length === 0) this.reset();
                }
            }

            explode() {
                this.exploding = true;
                const count = Math.random() * 10 + 10;
                for (let i = 0; i < count; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3;
                    this.shards.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: this.color
                    });
                }
            }

            draw() {
                if (!this.exploding) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    this.shards.forEach(shard => {
                        ctx.fillStyle = shard.color;
                        ctx.globalAlpha = shard.alpha;
                        ctx.beginPath();
                        ctx.arc(shard.x, shard.y, 1.2, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                ctx.globalAlpha = 1;
            }
        }

        // Initialize particles
        for (let i = 0; i < 40; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            // Draw static stars
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            for(let i=0; i<15; i++) {
                // Simple pseudo-random stars based on frame to avoid object overhead
                // Actually better to draw fixed stars in this loop for performance? 
                // Let's just draw random noise for sparkle
                if(Math.random() > 0.95) {
                    const x = Math.random() * width;
                    const y = Math.random() * height;
                    ctx.fillRect(x, y, 1.5, 1.5);
                }
            }
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
