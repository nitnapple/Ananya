<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year Ananya</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Dancing+Script:wght@600&family=Montserrat:wght@300;400;600&display=swap');

        body {
            background-color: #050505;
            overflow: hidden; /* Prevent body scroll, handle inside card */
            font-family: 'Montserrat', sans-serif;
        }

        /* 3D Container & Card */
        .scene {
            perspective: 1000px;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .card {
            width: 90%;
            max-width: 450px;
            height: 80vh; /* Taller for the list */
            max-height: 700px;
            transform-style: preserve-3d;
            border-radius: 20px;
            transition: transform 0.1s ease-out; /* Smooth instant movement */
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.5),
                0 0 0 1px rgba(255, 215, 0, 0.1); /* Gold subtle border */
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Ambient float animation when not interacting */
        .card.floating {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotateX(0) rotateY(0); }
            50% { transform: translateY(-15px) rotateX(2deg) rotateY(-2deg); }
            100% { transform: translateY(0px) rotateX(0) rotateY(0); }
        }

        /* Content inside the card */
        .card-content {
            position: absolute;
            inset: 0;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* To make text appear slightly off the card surface */
            transform: translateZ(40px);
            text-align: center;
            color: white;
            z-index: 20;
        }

        .card-bg-gradient {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            background: radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15), transparent 60%),
                        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%);
            z-index: 1;
        }

        .card-border-glow {
            position: absolute;
            inset: -2px;
            border-radius: 22px;
            background: linear-gradient(45deg, transparent, rgba(255, 215, 0, 0.3), transparent);
            z-index: 0;
            opacity: 0.5;
        }

        /* Typography */
        h1.name-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            background: linear-gradient(to right, #fff, #ffd700);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 10px rgba(255, 215, 0, 0.3);
            margin-bottom: 5px;
            line-height: 1.2;
        }

        h2.year-title {
            font-family: 'Cinzel', serif;
            letter-spacing: 4px;
            color: #d4af37;
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            padding-bottom: 10px;
            width: 100%;
        }

        /* Scrollable Wishes Area */
        .wishes-container {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.05);
            scrollbar-width: thin;
            scrollbar-color: #d4af37 rgba(0,0,0,0.1);
            mask-image: linear-gradient(to bottom, transparent, black 10%, black 90%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }

        .wishes-container::-webkit-scrollbar {
            width: 6px;
        }
        .wishes-container::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.1);
            border-radius: 10px;
        }
        .wishes-container::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 10px;
        }

        .wish-item {
            font-size: 0.95rem;
            color: #e0e0e0;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: flex-start;
            gap: 10px;
            line-height: 1.5;
            transition: color 0.3s;
        }

        .wish-item:last-child {
            border-bottom: none;
        }

        .wish-item:hover {
            color: #ffd700;
        }

        .wish-icon {
            color: #d4af37;
            margin-top: 3px;
            font-size: 0.8rem;
        }

        /* Depth Layers */
        .layer-depth-1 { transform: translateZ(20px); }
        .layer-depth-2 { transform: translateZ(50px); }

        /* Background Particles */
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        /* Mobile Note */
        .mobile-hint {
            position: absolute;
            bottom: 20px;
            color: rgba(255,255,255,0.4);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            animation: fadeIn 2s 2s forwards;
        }

        @keyframes fadeIn { to { opacity: 1; } }

    </style>
</head>
<body>

    <div id="canvas-container">
        <canvas id="fireworks"></canvas>
    </div>

    <div class="scene" id="scene">
        <div class="card floating" id="card">
            <div class="card-border-glow"></div>
            <div class="card-bg-gradient"></div>
            
            <div class="card-content">
                <div class="layer-depth-2 w-full flex flex-col items-center">
                    <h1 class="name-title">Happy New Year<br>Ananya</h1>
                    <h2 class="year-title">2026</h2>
                </div>

                <div class="wishes-container layer-depth-1" id="wishes-list">
                    <!-- Wishes injected by JS -->
                </div>

                <div class="mt-4 text-xs text-yellow-500/60 layer-depth-1">
                    <i class="fas fa-heart text-red-500/80 mr-1 animate-pulse"></i>Scroll to read your wishes
                </div>
            </div>
        </div>
        <div class="mobile-hint" id="hint-text">Move cursor or drag to tilt</div>
    </div>

    <script>
        /* --- 50 Wishes Data --- */
        const wishes = [
            "May this year bring you endless happiness and love, Ananya.",
            "Wishing you a year filled with new adventures and accomplishments.",
            "May your dreams take flight in the coming year.",
            "Here's to a year of health, wealth, and endless joy.",
            "May every day of the new year glow with good cheer.",
            "Wishing you strength and courage to conquer your goals.",
            "May laughter fill your home and heart throughout 2026.",
            "Here’s to writing a beautiful new chapter in your life.",
            "May you find peace and serenity in every moment.",
            "Wishing you success in every step you take.",
            "May the New Year bring you warmth, love, and light.",
            "Cheers to another year of making beautiful memories.",
            "May you be surrounded by positivity and good vibes.",
            "Wishing you a year as bright and beautiful as your smile, Ananya.",
            "May kindness follow you wherever you go.",
            "Here’s to crushing your goals and setting new ones.",
            "May the coming year be full of pleasant surprises.",
            "Wishing you unwavering focus and boundless energy.",
            "May you discover new passions and joys.",
            "Here's to a fresh start and a bright future.",
            "May your hard work pay off in ways you never imagined.",
            "Wishing you love that grows stronger every day.",
            "May you find beauty in the small things this year.",
            "Here’s to a year of growth, learning, and fun.",
            "May your heart be light and your days be bright.",
            "Wishing you the courage to chase your wildest dreams.",
            "May you inspire others just by being yourself.",
            "Here’s to moments that take your breath away.",
            "May you overcome every challenge with grace.",
            "Wishing you a year of abundance in all things good.",
            "May your path be lined with sunshine and flowers.",
            "Here’s to friendship, family, and fun times ahead.",
            "May you achieve balance and harmony in your life.",
            "Wishing you a year that sparkles with magic.",
            "May you be blessed with opportunities galore.",
            "Here’s to making every second count, Ananya.",
            "May your confidence soar to new heights.",
            "Wishing you nights of peaceful rest and days of energy.",
            "May you be the reason someone smiles today.",
            "Here’s to a year of breaking boundaries.",
            "May your creativity flow effortlessly.",
            "Wishing you safety and security throughout the year.",
            "May you find comfort in the company of loved ones.",
            "Here’s to a year of exciting journeys.",
            "May wisdom guide your decisions in 2026.",
            "Wishing you a heart full of gratitude.",
            "May the New Year bring you closer to your true self.",
            "Here’s to 365 days of limitless possibilities.",
            "May your spirit remain unbreakable.",
            "Happy New Year, Ananya! Make it your best one yet."
        ];

        /* --- Inject Wishes --- */
        const wishesContainer = document.getElementById('wishes-list');
        
        wishes.forEach((wish, index) => {
            const div = document.createElement('div');
            div.className = 'wish-item';
            div.innerHTML = `<i class="fas fa-star wish-icon"></i><span>${wish}</span>`;
            div.style.animation = `fadeIn 0.5s ease forwards ${index * 0.05}s`;
            div.style.opacity = '0'; // Start hidden for animation
            wishesContainer.appendChild(div);
        });

        // Add keyframes for list loading
        const styleSheet = document.createElement("style");
        styleSheet.innerText = `
            @keyframes fadeIn {
                to { opacity: 1; transform: translateY(0); }
                from { opacity: 0; transform: translateY(10px); }
            }
        `;
        document.head.appendChild(styleSheet);


        /* --- 3D Tilt Logic --- */
        const card = document.getElementById('card');
        const scene = document.getElementById('scene');
        const hintText = document.getElementById('hint-text');

        let isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if(isTouchDevice) hintText.innerText = "Drag to tilt the card";

        let bounds;
        
        function rotateToMouse(e) {
            if (!bounds) bounds = card.getBoundingClientRect();
            
            // Fix: Check property existence explicitly to avoid "undefined" error on mouse events
            const mouseX = (e.clientX !== undefined) ? e.clientX : e.touches[0].clientX;
            const mouseY = (e.clientY !== undefined) ? e.clientY : e.touches[0].clientY;
            
            const leftX = mouseX - bounds.x;
            const topY = mouseY - bounds.y;
            
            const center = {
                x: leftX - bounds.width / 2,
                y: topY - bounds.height / 2
            }
            
            const distance = Math.sqrt(center.x**2 + center.y**2);

            // Rotate calculation
            // Max rotation is 15 degrees
            const rotateX = (center.y / (bounds.height/2)) * -15; 
            const rotateY = (center.x / (bounds.width/2)) * 15;

            card.style.transform = `
                rotateX(${rotateX}deg)
                rotateY(${rotateY}deg)
                scale3d(1.02, 1.02, 1.02)
            `;
            
            // Dynamic Shadow based on tilt
            const shadowX = -rotateY * 2;
            const shadowY = rotateX * 2;
            card.style.boxShadow = `
                ${shadowX}px ${shadowY + 20}px 30px rgba(0,0,0,0.4),
                0 0 0 1px rgba(255, 215, 0, 0.2)
            `;

            // Adjust glare/gradient background slightly
            const bg = card.querySelector('.card-bg-gradient');
            bg.style.background = `
                radial-gradient(circle at ${50 + (center.x/5)}% ${0 + (center.y/5)}%, rgba(255, 215, 0, 0.2), transparent 60%),
                linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.5) 100%)
            `;
        }

        function stopRotate() {
            // Add floating class back for ambient animation
            card.classList.add('floating');
            
            card.style.transform = '';
            card.style.boxShadow = '0 20px 50px rgba(0,0,0,0.5), 0 0 0 1px rgba(255, 215, 0, 0.1)';
            
            const bg = card.querySelector('.card-bg-gradient');
            bg.style.background = `
                radial-gradient(circle at 50% 0%, rgba(255, 215, 0, 0.15), transparent 60%),
                linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%)
            `;
        }

        // Mouse Events
        scene.addEventListener('mouseenter', () => {
            bounds = card.getBoundingClientRect();
            card.classList.remove('floating');
        });
        
        scene.addEventListener('mousemove', (e) => {
            card.classList.remove('floating');
            window.requestAnimationFrame(() => rotateToMouse(e));
        });
        
        scene.addEventListener('mouseleave', stopRotate);

        // Touch Events
        scene.addEventListener('touchstart', (e) => {
            bounds = card.getBoundingClientRect();
            card.classList.remove('floating');
        });

        scene.addEventListener('touchmove', (e) => {
            // Prevent scrolling body while touching card area
            // e.preventDefault(); 
            window.requestAnimationFrame(() => rotateToMouse(e));
        });

        scene.addEventListener('touchend', stopRotate);


        /* --- Background Particles (Fireworks style) --- */
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        
        let width, height;
        let particles = [];

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = height + Math.random() * 100;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = -(Math.random() * 4 + 4);
                this.alpha = 1;
                this.color = `hsl(${Math.random() * 60 + 30}, 100%, 70%)`; // Gold/Yellow/Orange hues
                this.size = Math.random() * 2 + 1;
                this.gravity = 0.05;
                this.exploding = false;
                this.shards = [];
            }

            update() {
                if (!this.exploding) {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.alpha -= 0.005;

                    if (this.vy > -1 && Math.random() > 0.95) {
                        this.explode();
                    }
                    
                    if (this.y > height + 50 || this.alpha <= 0) this.reset();
                } else {
                    this.shards.forEach(shard => {
                        shard.x += shard.vx;
                        shard.y += shard.vy;
                        shard.vy += 0.05;
                        shard.alpha -= 0.015;
                    });
                    this.shards = this.shards.filter(s => s.alpha > 0);
                    if (this.shards.length === 0) this.reset();
                }
            }

            explode() {
                this.exploding = true;
                for (let i = 0; i < 20; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const speed = Math.random() * 3;
                    this.shards.push({
                        x: this.x,
                        y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        alpha: 1,
                        color: this.color
                    });
                }
            }

            draw() {
                if (!this.exploding) {
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    this.shards.forEach(shard => {
                        ctx.fillStyle = shard.color;
                        ctx.globalAlpha = shard.alpha;
                        ctx.beginPath();
                        ctx.arc(shard.x, shard.y, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    });
                }
                ctx.globalAlpha = 1;
            }
        }

        // Initialize particles
        for (let i = 0; i < 30; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            // Draw star background
            ctx.fillStyle = 'white';
            for(let i=0; i<10; i++) {
                if(Math.random() > 0.5)
                ctx.fillRect(Math.random()*width, Math.random()*height, 1, 1);
            }
            
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

    </script>
</body>
</html>
