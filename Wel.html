<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Welcome Back Ananya</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Pinyon+Script&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --royal-purple: #1a0526;
            --deep-plum: #3e1235;
            --gold: #d4af37;
            --bright-gold: #f3e5ab;
            --antique-gold: #8a6e2f;
            --overlay-dark: rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile browsers */
            width: 100vw;
            overflow: hidden;
            background: radial-gradient(circle at center, var(--deep-plum), var(--royal-purple));
            color: var(--gold);
            font-family: 'Playfair Display', serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        /* Gold Frame around the screen - Responsive */
        body::after {
            content: '';
            position: fixed;
            top: 15px;
            left: 15px;
            right: 15px;
            bottom: 15px;
            border: 2px solid var(--gold);
            z-index: 100;
            pointer-events: none;
            box-shadow: inset 0 0 30px rgba(212, 175, 55, 0.15);
            transition: all 0.3s ease;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 22px;
            left: 22px;
            right: 22px;
            bottom: 22px;
            border: 1px solid rgba(212, 175, 55, 0.4);
            z-index: 100;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        /* Mobile adjustments for the frame */
        @media (max-width: 768px) {
            body::after {
                top: 8px; left: 8px; right: 8px; bottom: 8px;
                border-width: 1px;
            }
            body::before {
                top: 12px; left: 12px; right: 12px; bottom: 12px;
            }
        }

        /* Decorative background pattern */
        .pattern {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 50% 50%, transparent 0%, transparent 60%, rgba(0,0,0,0.5) 100%),
                repeating-linear-gradient(45deg, rgba(212, 175, 55, 0.03) 0px, rgba(212, 175, 55, 0.03) 2px, transparent 2px, transparent 10px);
            opacity: 1;
            z-index: 1;
            pointer-events: none;
        }

        /* Particles container */
        #particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .container {
            z-index: 10;
            padding: 4rem;
            width: 90%;
            max-width: 800px;
            position: relative;
            background: rgba(20, 5, 25, 0.4);
            backdrop-filter: blur(2px);
            border-radius: 8px;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: padding 0.3s ease;
        }

        @media (max-width: 768px) {
            .container {
                padding: 2rem 1rem;
            }
        }

        /* --- Animations --- */

        @keyframes shine {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes growLine {
            from { width: 0; opacity: 0; }
            to { width: 150px; opacity: 1; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .crown-icon {
            font-size: 4rem;
            margin-bottom: 1.5rem;
            color: var(--gold);
            filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.6));
            opacity: 0;
            animation: fadeInUp 1.2s ease-out forwards, float 5s ease-in-out infinite 1.2s;
        }

        h1 {
            /* Changed to Pinyon Script */
            font-family: 'Pinyon Script', cursive;
            font-size: clamp(3.5rem, 12vw, 7rem); /* Slightly larger base for script font */
            font-weight: 400;
            letter-spacing: 0.02em;
            /* Removed uppercase because script fonts look better in title case */
            margin-bottom: 1rem;
            line-height: 1.2;
            
            /* Gold Gradient Text */
            background: linear-gradient(
                110deg, 
                var(--antique-gold) 0%, 
                var(--gold) 20%, 
                var(--bright-gold) 40%, 
                #ffffe0 50%, 
                var(--bright-gold) 60%, 
                var(--gold) 80%, 
                var(--antique-gold) 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.6));
            
            opacity: 0;
            animation: fadeInUp 1.2s ease-out 0.4s forwards, shine 5s linear infinite;
        }

        .divider {
            height: 3px;
            width: 0;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 0 auto 2rem auto;
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
            animation: growLine 1.5s ease-out 1s forwards;
        }

        .subtitle {
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: var(--bright-gold);
            font-style: italic;
            margin-bottom: 3rem;
            letter-spacing: 0.05em;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            opacity: 0;
            animation: fadeInUp 1.2s ease-out 1.2s forwards;
            padding: 0 10px;
        }

        button {
            background: rgba(212, 175, 55, 0.05);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 1.2rem 4rem;
            font-family: 'Cinzel', serif; /* Kept readable for button */
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fadeInUp 1.2s ease-out 1.6s forwards;
            /* Mobile touch target optimization */
            touch-action: manipulation; 
        }

        @media (max-width: 768px) {
            button {
                padding: 1rem 2.5rem;
                font-size: 1rem;
                letter-spacing: 2px;
                width: 80%;
                max-width: 250px;
            }
        }

        button:hover, button:active {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            letter-spacing: 5px;
            transform: scale(1.05);
            text-shadow: 0 0 8px rgba(255, 255, 224, 0.8);
        }

        button::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
            opacity: 0;
            transform: scale(0.5);
            transition: opacity 0.5s, transform 0.5s;
        }
        
        button:active::after {
            opacity: 1;
            transform: scale(1);
            transition: 0s;
        }

        /* Sparkle animation */
        .sparkle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
        }
        
        /* Modal Styles */
        #royalModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            backdrop-filter: blur(5px);
        }
        
        #royalModal.active {
            opacity: 1;
            pointer-events: all;
        }
        
        .modal-content {
            background: radial-gradient(circle at center, #2a0e26, #15041f);
            border: 2px solid var(--gold);
            padding: 2.5rem;
            text-align: center;
            max-width: 500px;
            width: 85%;
            transform: scale(0.8);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
        }
        
        #royalModal.active .modal-content {
            transform: scale(1);
        }
        
        .modal-text {
            font-family: 'Playfair Display', serif;
            color: var(--bright-gold);
            font-size: clamp(1.2rem, 4vw, 1.5rem);
            margin-bottom: 2rem;
            line-height: 1.6;
        }
        
        .modal-btn {
            background: var(--gold);
            color: var(--royal-purple);
            border: none;
            font-weight: bold;
            font-size: 1rem;
            padding: 1rem 2rem;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: background 0.3s;
            text-transform: uppercase;
        }
        
        .modal-btn:hover, .modal-btn:active {
            background: #fff;
            box-shadow: 0 0 15px #fff;
        }

        /* Audio Control */
        .audio-control {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 150;
            background: rgba(26, 5, 38, 0.8);
            border: 1px solid var(--gold);
            border-radius: 50%;
            color: var(--gold);
            cursor: pointer;
            opacity: 1;
            transition: opacity 0.3s, transform 0.3s, box-shadow 0.3s;
            padding: 10px;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
            animation: pulse 3s infinite;
            /* Better tap area */
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        @media (max-width: 768px) {
            .audio-control {
                top: 15px;
                right: 15px;
            }
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); }
        }

        .audio-control:hover, .audio-control:active {
            transform: scale(1.1);
            background: rgba(62, 18, 53, 0.9);
        }

        .audio-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .music-hint {
            position: absolute;
            top: 100%;
            right: 0;
            width: 120px;
            background: rgba(0,0,0,0.8);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px;
            border-radius: 4px;
            margin-top: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
            font-family: sans-serif;
            text-align: center;
        }

    </style>
</head>
<body onclick="ensureMusicPlays()">

    <div class="pattern"></div>
    <div id="particles"></div>
    
    <!-- Audio Element: Handel's Entrance of the Queen of Sheba (MP3 Format) -->
    <audio id="bgm" loop preload="auto">
        <source src="https://ia801309.us.archive.org/25/items/HandelEntranceOfTheQueenOfSheba/Handel%20-%20Entrance%20of%20the%20Queen%20of%20Sheba.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <button class="audio-control" onclick="toggleMusic(event)" aria-label="Toggle Music" title="Toggle Music">
        <svg class="audio-icon" id="icon-sound-off" style="display: block;" viewBox="0 0 24 24">
            <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
        </svg>
        <svg class="audio-icon" id="icon-sound-on" style="display: none;" viewBox="0 0 24 24">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <div class="music-hint" id="musicHint">Music Paused</div>
    </button>

    <div class="container">
        <div class="crown-icon">
            <svg width="80" height="80" viewBox="0 0 24 24" fill="url(#goldGradient)" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#bf953f" />
                        <stop offset="50%" stop-color="#fcf6ba" />
                        <stop offset="100%" stop-color="#b38728" />
                    </linearGradient>
                </defs>
                <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5ZM19 19C19 19.5523 18.5523 20 18 20H6C5.44772 20 5 19.5523 5 19V18H19V19Z" />
            </svg>
        </div>
        
        <!-- Pinyon Script Font (Handwriting style) -->
        <h1>Welcome Back<br>Ananya</h1>
        
        <div class="divider"></div>
        
        <p class="subtitle">The Royal Court Awaits Your Presence</p>

        <button onclick="enterCourt(event)">Enter the Throne Room</button>
    </div>

    <!-- Custom Modal -->
    <div id="royalModal">
        <div class="modal-content">
            <div class="crown-icon" style="font-size: 2rem; margin-bottom: 1rem;">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5ZM19 19C19 19.5523 18.5523 20 18 20H6C5.44772 20 5 19.5523 5 19V18H19V19Z" />
                </svg>
            </div>
            <p class="modal-text">You have been formally announced. The court bows in your honor.</p>
            <button class="modal-btn" onclick="closeModal()">Proceed</button>
        </div>
    </div>

    <script>
        const bgm = document.getElementById('bgm');
        const iconOn = document.getElementById('icon-sound-on');
        const iconOff = document.getElementById('icon-sound-off');
        const musicHint = document.getElementById('musicHint');
        let isPlaying = false;
        let hasInteracted = false;

        // Try to initialize audio on the first interaction with the body
        function ensureMusicPlays() {
            if (!hasInteracted && !isPlaying) {
                playAudio();
                hasInteracted = true;
            }
        }

        function playAudio() {
            bgm.volume = 0.6;
            const playPromise = bgm.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    isPlaying = true;
                    updateIconState();
                    // Remove pulse animation once playing
                    document.querySelector('.audio-control').style.animation = 'none';
                })
                .catch(error => {
                    console.log("Auto-play was prevented. Waiting for explicit click.");
                    isPlaying = false;
                    updateIconState();
                });
            }
        }

        function toggleMusic(event) {
            // Stop propagation so body onclick doesn't fire double
            if(event) event.stopPropagation();

            if (isPlaying) {
                bgm.pause();
                isPlaying = false;
            } else {
                playAudio();
            }
            updateIconState();
        }

        function updateIconState() {
            if (isPlaying) {
                iconOn.style.display = 'block';
                iconOff.style.display = 'none';
                musicHint.style.opacity = '0';
            } else {
                iconOn.style.display = 'none';
                iconOff.style.display = 'block';
            }
        }

        function enterCourt(event) {
            if(event) event.stopPropagation(); // prevent double firing
            
            const btn = document.querySelector('.container button');
            
            // Try to play music if not playing (explicit interaction)
            if (!isPlaying) {
                playAudio();
            }

            // Visual feedback
            btn.style.transform = "scale(0.95)";
            setTimeout(() => btn.style.transform = "scale(1)", 150);
            
            // Show modal
            const modal = document.getElementById('royalModal');
            modal.classList.add('active');
        }

        function closeModal() {
            const modal = document.getElementById('royalModal');
            modal.classList.remove('active');
        }

        // Add some ambient sparkles
        function createSparkles() {
            const container = document.getElementById('particles');
            const particleCount = 40; 

            for (let i = 0; i < particleCount; i++) {
                const sparkle = document.createElement('div');
                sparkle.classList.add('sparkle');
                resetSparkle(sparkle);
                container.appendChild(sparkle);
            }

            function animate() {
                const sparkles = document.querySelectorAll('.sparkle');
                sparkles.forEach(sparkle => {
                    let opacity = parseFloat(sparkle.style.opacity);
                    let scale = parseFloat(sparkle.getAttribute('data-scale'));
                    let y = parseFloat(sparkle.style.top);
                    let speed = parseFloat(sparkle.getAttribute('data-speed'));

                    y -= speed * 0.05;
                    
                    let phase = parseFloat(sparkle.getAttribute('data-phase'));
                    phase += 0.02;
                    sparkle.setAttribute('data-phase', phase);
                    
                    opacity = Math.sin(phase); 
                    if(opacity < 0) {
                        resetSparkle(sparkle);
                        opacity = 0;
                    }

                    sparkle.style.opacity = Math.max(0, opacity);
                    sparkle.style.top = y + '%';
                    sparkle.style.transform = `scale(${scale})`;
                });
                requestAnimationFrame(animate);
            }
            animate();
        }

        function resetSparkle(el) {
            const x = Math.random() * 100;
            const y = Math.random() * 100 + 20; 
            const size = Math.random() * 3 + 1;
            
            el.style.left = `${x}%`;
            el.style.top = `${y}%`;
            el.style.width = `${size}px`;
            el.style.height = `${size}px`;
            el.style.opacity = 0;
            
            el.style.background = Math.random() > 0.6 ? '#fff' : '#d4af37';
            el.style.boxShadow = `0 0 ${size * 2}px ${el.style.background}`;
            
            el.setAttribute('data-speed', Math.random() * 0.5 + 0.2);
            el.setAttribute('data-scale', Math.random() * 0.5 + 0.5);
            el.setAttribute('data-phase', Math.random() * Math.PI); 
        }

        window.onload = createSparkles;
    </script>
</body>
</html>
